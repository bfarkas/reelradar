<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>ReelRadar</title>
<style>
/* Fixed 1920x1080 stage, Tizen 4.0 (Chromium M56): no flex gap, no inset. "Screening room" look. */
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #120e0b; color: #f4ede3; font-family: sans-serif; }
.layer { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; }
.hidden { display: none; }
.serif { font-family: Georgia, "Times New Roman", serif; }
#backdrop { position: absolute; right: 0; top: 0; width: 1400px; height: 790px; background: #120e0b center / cover no-repeat; }
#shade { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
  background: linear-gradient(90deg, #120e0b 28%, rgba(18,14,11,0.9) 48%, rgba(18,14,11,0.15) 80%, rgba(18,14,11,0.3)),
              linear-gradient(0deg, #120e0b 34%, rgba(18,14,11,0) 58%),
              linear-gradient(180deg, rgba(18,14,11,0.94) 0%, rgba(18,14,11,0.8) 10%, rgba(18,14,11,0) 18%); }
header { position: absolute; left: 80px; top: 36px; width: 1760px; height: 68px; white-space: nowrap; }
.logo { display: inline-block; vertical-align: middle; margin-right: 20px; font-size: 48px; font-weight: bold; }
.logo span { color: #e0412a; }
#views { display: inline-block; vertical-align: middle; }
/* shortcut: room for Clear filter in the header; goes when it moves to the filter screen (OS-T-99KST) */
#views.tight .btn { padding-left: 14px; padding-right: 14px; }
#tools { position: absolute; right: 0; top: 0; }
#count { position: absolute; right: 80px; top: 616px; line-height: 44px; color: #bdb1a3; font-size: 24px; font-variant-numeric: tabular-nums; }
.btn { display: inline-block; vertical-align: middle; padding: 14px 20px; font-size: 26px; border: 4px solid transparent; border-radius: 40px; color: #f4ede3; }
/* outlined pills: the line is an inner shadow, so the white focus border does not change their size */
#open-filter, #clear-filter { margin-right: 14px; padding: 14px 22px; background: rgba(18,14,11,0.8); box-shadow: inset 0 0 0 2px #7a6a5c; }
.btn.on, #open-filter.on { background: #c8321e; box-shadow: none; }
.btn.hidden { display: none; }
.btn.focus { border-color: #fff; background: rgba(255,255,255,0.14); }
#open-filter.focus, #clear-filter.focus { box-shadow: none; background: rgba(255,255,255,0.14); }
.btn.on.focus, #open-filter.on.focus { background: #c8321e; }
/* layout switcher like the web page: one segmented control, the active half red */
#layout { display: inline-block; vertical-align: middle; border: 2px solid #7a6a5c; border-radius: 40px; padding: 2px; background: rgba(18,14,11,0.8); }
#layout .btn { padding: 10px 21px; }
.ico { display: inline-block; vertical-align: middle; width: 26px; height: 26px; }
.ico.wall { background: linear-gradient(#f4ede3, #f4ede3) 0 0 / 11px 11px no-repeat, linear-gradient(#f4ede3, #f4ede3) 15px 0 / 11px 11px no-repeat,
  linear-gradient(#f4ede3, #f4ede3) 0 15px / 11px 11px no-repeat, linear-gradient(#f4ede3, #f4ede3) 15px 15px / 11px 11px no-repeat; }
.ico.rows { background: linear-gradient(#f4ede3, #f4ede3) 0 2px / 26px 4px no-repeat, linear-gradient(#f4ede3, #f4ede3) 0 11px / 26px 4px no-repeat,
  linear-gradient(#f4ede3, #f4ede3) 0 20px / 26px 4px no-repeat; }
#hero { position: absolute; left: 80px; top: 152px; width: 1080px; }
#hero-date { font-size: 28px; line-height: 36px; height: 36px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #e8dccd; }
#hero-date .kbadge { display: inline-block; margin-right: 16px; padding: 0 14px; border-radius: 18px; background: #1f5f6b; color: #fff; font-size: 22px; font-weight: bold; line-height: 34px; vertical-align: 1px; }
#hero-title { margin-top: 16px; font-size: 72px; line-height: 1.1; letter-spacing: -0.01em; max-height: 159px; overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
#hero-text { margin-top: 16px; font-size: 27px; line-height: 1.4; color: #d6cabb; width: 980px; max-height: 76px; overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
#hero-text .lang { border: 2px solid #d6cabb; border-radius: 5px; font-size: 18px; margin-right: 12px; padding: 0 7px; vertical-align: 3px; }
#hero-actions { margin-top: 32px; white-space: nowrap; }
.action { display: inline-block; margin-right: 22px; padding: 14px 34px; font-size: 28px; font-weight: bold; border-radius: 12px; border: 4px solid #f4ede3; }
.action.solid { background: #f4ede3; color: #1d1712; }
#hero-actions .action { vertical-align: middle; margin-right: 20px; padding: 16px 36px; border-color: #a89c8e; background: rgba(18,14,11,0.8); }
#hero-actions .action.solid { border-color: #f4ede3; background: #f4ede3; }
#hero-actions .action.focus { border-color: #fff; }
/* a dark gap and a white ring: seen on the cream button as well as on the dark ones */
.action.focus { border-color: #fff; box-shadow: 0 0 0 4px #120e0b, 0 0 0 9px #fff; }
.action-note { display: inline-block; vertical-align: middle; margin-right: 20px; font-size: 26px; color: #9fcf8f; }
/* 10px of room left and above for the focus ring: posters start at 80,684. One shelf is 442px, and the list ends 20px
   under a caption, so moving down a shelf puts the next heading on the count's line. */
#list { position: absolute; left: 70px; top: 612px; width: 1850px; height: 438px; overflow: hidden; }
.shelf-title { margin: 0 0 18px 10px; font-size: 34px; line-height: 44px; height: 44px; }
.shelf { white-space: nowrap; overflow: hidden; height: 370px; padding: 10px 0 0 10px; }
.poster { display: inline-block; vertical-align: top; width: 200px; margin-right: 22px; white-space: normal; }
.poster .frame { width: 200px; height: 300px; border-radius: 8px; background: #2a221c center / cover no-repeat; position: relative; overflow: hidden; }
.poster .fallback { position: absolute; left: 16px; right: 16px; top: 96px; text-align: center; font-size: 26px; line-height: 1.25; }
.poster .cap { margin-top: 16px; height: 30px; line-height: 30px; font-size: 24px; color: #bdb1a3; white-space: nowrap; overflow: hidden; font-variant-numeric: tabular-nums; }
.poster.focus .frame { box-shadow: 0 0 0 4px #120e0b, 0 0 0 10px #fff; }
.poster.focus .cap { color: #fff; }
/* badge on posters; poster wall mode (denser grid, no hero; OK plays, long OK opens the info dialog) */
/* a centred pill near the bottom edge; the negative right margin lets it use the whole poster before it wraps */
.badge { position: absolute; left: 50%; bottom: 10px; margin-right: -50%; transform: translateX(-50%); max-width: 180px; box-sizing: border-box; white-space: pre-line; word-wrap: break-word; text-align: center; padding: 6px 14px; border-radius: 20px; background: #120e0b; color: #fff; font-size: 22px; line-height: 1.15; font-weight: bold; }
.badge.streaming { background: #a2240f; }
.badge.series { background: #1f5f6b; }
#main.wall #hero, #main.wall #backdrop { display: none; }
#main.wall #shade { background: #120e0b; }
#main.wall #count { top: 136px; }
#main.wall #list { top: 132px; height: 948px; }
#main.wall .shelf { white-space: normal; height: auto; overflow: visible; }
#main.wall .poster { margin: 0 22.8px 24px 0; }
#main.wall .poster .cap { display: none; }
#main.wall #message { top: 200px; }
#main.wall #retry { top: 270px; }
/* info dialog over the wall (long press OK) */
#dialog { background: rgba(0, 0, 0, 0.72); }
#dlg { position: absolute; left: 160px; top: 120px; width: 1600px; height: 840px; background: #1d1712; border: 2px solid #3a2f27; border-radius: 16px; }
#dlg-poster { position: absolute; left: 40px; top: 40px; width: 320px; height: 480px; border-radius: 10px; background: #2a221c center / cover no-repeat; }
#dlg-body { position: absolute; left: 400px; top: 40px; width: 1160px; height: 760px; }
#dlg-title { font-size: 54px; line-height: 1.1; max-height: 120px; overflow: hidden; margin-bottom: 14px; }
#dlg-date { font-size: 30px; color: #e8dccd; height: 44px; }
#dlg-text { font-size: 27px; line-height: 1.4; color: #cfc3b5; max-height: 454px; overflow: hidden; margin-top: 10px; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 12; }
#dlg-text .lang { border: 2px solid #cfc3b5; border-radius: 5px; font-size: 18px; margin-right: 12px; padding: 0 7px; vertical-align: 3px; }
#dlg-actions { position: absolute; left: 10px; top: 670px; white-space: nowrap; }
#filter { background: rgba(18, 14, 11, 0.97); }
#filter h2 { margin: 24px 80px 10px; font-size: 40px; }
#filter-hint { margin: 0 80px; color: #a89c8e; font-size: 28px; }
.tags { margin: 0 70px; }
#keywords { height: 430px; overflow: hidden; }
.tag { display: inline-block; margin: 10px; padding: 12px 26px; font-size: 30px; background: #2a221c; border: 4px solid #2a221c; border-radius: 30px; }
.tag.on { background: #c8321e; border-color: #c8321e; }
.tag.focus { border-color: #fff; }
#player { background: #000; }
#video { width: 1920px; height: 1080px; }
#ctl { position: absolute; left: 0; bottom: 0; width: 1920px; height: 170px; background: linear-gradient(0deg, rgba(0,0,0,0.75), rgba(0,0,0,0)); }
#ctl .pi { position: absolute; left: 80px; bottom: 74px; width: 40px; height: 40px; }
#ctl .pi.playing { width: 0; height: 0; border-style: solid; border-width: 20px 0 20px 34px; border-color: transparent transparent transparent #f4ede3; }
#ctl .pi.paused { border-left: 14px solid #f4ede3; border-right: 14px solid #f4ede3; width: 12px; box-sizing: content-box; }
#ptime { position: absolute; left: 144px; bottom: 74px; font-size: 34px; line-height: 40px; color: #f4ede3; }
#pbar { position: absolute; left: 80px; bottom: 40px; width: 1760px; height: 8px; background: rgba(255,255,255,0.3); }
#pfill { width: 0; height: 8px; background: #e0412a; }
#status { position: absolute; left: 0; top: 480px; width: 1920px; text-align: center; font-size: 44px; color: #ddd; }
#message { position: absolute; left: 80px; top: 680px; font-size: 34px; color: #cfc3b5; }
#retry { position: absolute; left: 80px; top: 750px; }
#notice { position: absolute; left: 660px; top: 968px; width: 600px; box-sizing: border-box; padding: 20px 32px; text-align: center; font-size: 30px; background: #f4ede3; color: #1d1712; border-radius: 40px; box-shadow: 0 16px 48px rgba(0,0,0,0.6); }
</style>
</head>
<body>
<div id="main" class="layer">
  <div id="backdrop"></div>
  <div id="shade"></div>
  <header>
    <span class="logo serif">Reel<span>Radar</span></span>
    <div id="views"></div>
    <div id="tools">
      <span class="btn hidden" id="clear-filter">Clear filter</span><span class="btn" id="open-filter">Filter</span><span id="layout"><span class="btn focusable" id="layout-wall"><span class="ico wall"></span></span><span class="btn focusable" id="layout-rows"><span class="ico rows"></span></span></span>
    </div>
  </header>
  <div id="count"></div>
  <div id="hero">
    <div id="hero-date"></div>
    <div id="hero-title" class="serif"></div>
    <div id="hero-text"></div>
    <div id="hero-actions"></div>
  </div>
  <div id="message">Loading titles...</div>
  <span class="btn hidden" id="retry">Try again</span>
  <div id="list"></div>
  <div id="notice" class="hidden"></div>
</div>
<div id="dialog" class="layer hidden">
  <div id="dlg">
    <div id="dlg-poster"></div>
    <div id="dlg-body">
      <div id="dlg-title" class="serif"></div>
      <div id="dlg-date"></div>
      <div id="dlg-text"></div>
      <div id="dlg-actions"></div>
    </div>
  </div>
</div>
<div id="filter" class="layer hidden">
  <h2>Releases</h2>
  <div class="tags" id="kinds"></div>
  <h2>Genres</h2>
  <div class="tags" id="genres"></div>
  <h2>Keywords</h2>
  <div id="filter-hint">OK toggles · Back closes · shows titles matching ANY choice</div>
  <div class="tags" id="keywords"></div>
</div>
<div id="player" class="layer hidden">
  <video id="video"></video>
  <div id="status"></div>
  <div id="ctl" class="hidden"><span id="pi" class="pi playing"></span><span id="ptime"></span><div id="pbar"><div id="pfill"></div></div></div>
</div>
<script>
// ES5 only. API on rei3 (LAN, behind Caddy).
var API = 'http://192.168.42.57:8095';
var KEYS = { LEFT: 37, UP: 38, RIGHT: 39, DOWN: 40, ENTER: 13, BACK: 10009, ESC: 27, BACKSPACE: 8,
  PLAY: 415, PAUSE: 19, PLAY_PAUSE: 10252, STOP: 413, FF: 417, RW: 412 };
var FILTER_KEY = 'reelradar.filter';
// ---- identity: movie and series ids overlap in TMDB, so a title is (media_type, tmdb_id) ----
function mediaType(title) { return title.media_type === 'tv' ? 'tv' : 'movie'; }
function isSeries(title) { return mediaType(title) === 'tv'; }
function titleKey(title) { return mediaType(title) + ':' + title.tmdb_id; }
// A series has no German dates. Where it streams in Germany comes from TMDB's flatrate list; null shows nothing.
function availableText(title, short) {
  if (!isSeries(title) || !title.providers || !title.providers.length) return null;
  var names = title.providers.map(function (p) { return p.name; }).join(', ');
  return short ? 'On ' + names : 'Available on ' + names + ' in Germany';
}

// ---- views (same logic in frontend/index.html and tv-app/index.html) ----
var VIEWS = [['upcoming', 'Release calendar'], ['trailers', 'New trailers'], ['recent', 'Recently released'], ['genres', 'Genres'], ['all', 'All titles']];
var KINDS = [['all', 'All releases'], ['cinema', 'Cinema'], ['streaming', 'Streaming']];
var WINDOW_DAYS = 90; // "recently released" looks three months back
var AHEAD_DAYS = 183; // "upcoming" looks six months ahead, matching the import

function isoDay(offsetDays) {
  var d = new Date(Date.now() + offsetDays * 86400000);
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
}

// A title's German releases as entries; kind filter applies. Cinema = theatrical, streaming = digital.
function releases(title, kind) {
  var list = [];
  if (title.de_theatrical && kind !== 'streaming') list.push({ title: title, kind: 'cinema', date: title.de_theatrical });
  if (title.de_digital && kind !== 'cinema') list.push({ title: title, kind: 'streaming', date: title.de_digital });
  return list;
}

// Kind filter for the views without a calendar. A series has no cinema release; it counts as streaming when
// TMDB lists a German flatrate service for it.
function inKind(title, kind) {
  if (kind === 'all') return true;
  if (isSeries(title)) return kind === 'streaming' && !!(title.providers && title.providers.length);
  return releases(title, kind).length > 0;
}

// -> [{heading, note, items:[{title, kind, date}]}]; calendar views list each release on its day. A series has no
// German date, so it is not in the calendar views (Release calendar, Recently released); it is in the others.
// It is never under Cinema, and under Streaming only while it is on a German service.
function viewSections(view, titles, kind) {
  var today = isoDay(0);
  if (view === 'upcoming' || view === 'recent') {
    var from = view === 'upcoming' ? today : isoDay(-WINDOW_DAYS);
    var to = view === 'upcoming' ? isoDay(AHEAD_DAYS + 1) : today;
    var entries = [];
    titles.forEach(function (title) {
      releases(title, kind).forEach(function (entry) { if (entry.date >= from && entry.date < to) entries.push(entry); });
    });
    entries.sort(function (a, b) {
      var order = a.date < b.date ? -1 : a.date > b.date ? 1 : 0;
      return view === 'upcoming' ? order : -order;
    });
    var days = [];
    entries.forEach(function (entry) {
      var last = days[days.length - 1];
      if (!last || last.date !== entry.date) { last = { date: entry.date, heading: longDate(entry.date), items: [] }; days.push(last); }
      last.items.push(entry);
    });
    days.forEach(function (day) { day.note = day.items.length + (day.items.length === 1 ? ' release' : ' releases'); });
    return days;
  }
  var kept = titles.filter(function (title) { return inKind(title, kind); });
  function asItem(title) { return { title: title, kind: null, date: null }; }
  if (view === 'trailers') {
    var withTrailer = kept.filter(function (title) { return title.trailer; });
    withTrailer.sort(function (a, b) { return (b.trailer.published_at || '') > (a.trailer.published_at || '') ? 1 : -1; });
    return [{ heading: '', items: withTrailer.map(asItem) }];
  }
  if (view === 'genres') {
    var byName = {}, names = [];
    kept.forEach(function (title) {
      (title.genres || []).forEach(function (genre) {
        if (!byName[genre.name]) { byName[genre.name] = []; names.push(genre.name); }
        byName[genre.name].push(title);
      });
    });
    return names.sort().map(function (name) {
      return { heading: name, note: byName[name].length + ' titles', items: byName[name].map(asItem) };
    });
  }
  kept.sort(byTitle);
  return [{ heading: '', items: kept.map(asItem) }];
}
// A to Z, ignoring case and accents. Equal titles go by id: the TV's engine does not keep their order by itself.
function byTitle(a, b) {
  return a.title.localeCompare(b.title, 'en', { sensitivity: 'base' }) || (titleKey(a) < titleKey(b) ? -1 : 1);
}

var DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
function longDate(iso) {
  var d = new Date(iso + 'T12:00:00');
  return DAYS[d.getDay()] + ', ' + d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear();
}
function shortDate(iso) {
  var d = new Date(iso + 'T12:00:00');
  return d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear();
}

var currentView = 'upcoming';
var LAYOUT_KEY = 'reelradar.layout';
var wall = false; // poster wall layout instead of hero + rows
try { wall = window.localStorage.getItem(LAYOUT_KEY) === 'wall'; } catch (error) {}
var allTitles = [];
var loadError = ''; // the message while the list could not be loaded
var seerrStatus = {}; // titleKey -> none|requested|partial|available
var SEERR_LABELS = { requested: 'Requested in Seerr', partial: 'Partly in the library', available: 'In the library' };
var selection = loadSelection();
var layer = 'main';           // main | filter | player | dialog (dialog sits over main)
var focused = { main: null, filter: null, dialog: null };
var playToken = 0;

function $(id) { return document.getElementById(id); }
function el(tag, className, text) {
  var e = document.createElement(tag);
  if (className) e.className = className;
  if (text !== undefined) e.textContent = text;
  return e;
}

function loadSelection() {
  try {
    var value = JSON.parse(window.localStorage.getItem(FILTER_KEY));
    if (value && value.v === 1 && value.genres instanceof Array && value.keywords instanceof Array) {
      value.kind = value.kind || 'all'; // filters saved before there was a Cinema/Streaming choice
      return value;
    }
  } catch (error) {}
  return { v: 1, genres: [], keywords: [], kind: 'all' };
}
function activeCount() {
  return selection.genres.length + selection.keywords.length + (selection.kind === 'all' ? 0 : 1);
}
function saveSelection() {
  try { window.localStorage.setItem(FILTER_KEY, JSON.stringify(selection)); } catch (error) {}
}
function hasAny(tags, ids) {
  for (var i = 0; i < tags.length; i += 1) if (ids.indexOf(tags[i].id) !== -1) return true;
  return false;
}
// Same rule as the web page: ANY selected genre or keyword; nothing selected shows everything.
function matchesFilter(title) {
  if (!selection.genres.length && !selection.keywords.length) return true;
  return hasAny(title.genres || [], selection.genres) || hasAny(title.keywords || [], selection.keywords);
}
function collectTags(kind) {
  var byId = {}, list = [];
  allTitles.forEach(function (title) {
    (title[kind] || []).forEach(function (tag) {
      if (!byId[tag.id]) { byId[tag.id] = { id: tag.id, name: tag.name, count: 0 }; list.push(byId[tag.id]); }
      byId[tag.id].count += 1;
    });
  });
  return list;
}

// ---- focus: spatial navigation over the .focusable elements of the current layer ----
function focusables() {
  return Array.prototype.slice.call($(layer).querySelectorAll('.focusable'));
}
function removeClass(e, name) {
  e.className = e.className.replace(new RegExp('(^| )' + name + '(?= |$)', 'g'), '');
}
function setFocus(target) {
  var old = $(layer).querySelector('.focus');
  if (old) removeClass(old, 'focus');
  if (!target) return;
  target.className += ' focus';
  focused[layer] = target;
  if (target.item) { focused.poster = target; if (!wall && target.item !== heroItem) showHero(target.item); }
  ensureVisible(target);
  // the wall's heading scrolls away; the count beside it is not part of the list, so it goes with it
  if (target.item) $('count').style.visibility = wall && $('list').scrollTop > 0 ? 'hidden' : '';
}
function ensureVisible(target) {
  for (var box = target.parentNode; box && box !== document.body; box = box.parentNode) {
    var t = target.getBoundingClientRect(), b = box.getBoundingClientRect();
    if (box.scrollHeight > box.clientHeight) {
      // upwards the list leaves room for the heading (72px in both layouts), so it comes back whole with its row
      if (t.top < b.top) box.scrollTop -= b.top - t.top + (box.id === 'list' ? 72 : 20);
      else if (t.bottom > b.bottom) box.scrollTop += t.bottom - b.bottom + 20;
    }
    if (box.scrollWidth > box.clientWidth) {
      if (t.left < b.left) box.scrollLeft -= b.left - t.left + 20;
      else if (t.right > b.right) box.scrollLeft += t.right - b.right + 20;
    }
  }
}
function move(dx, dy) {
  var current = $(layer).querySelector('.focus');
  var items = focusables();
  if (!current) { setFocus(items[0]); return; }
  // Down from the hero buttons returns to the poster the hero shows.
  if (dy === 1 && current.parentNode === $('hero-actions') && focused.poster) { setFocus(focused.poster); return; }
  // Rows layout: Up/Down move one shelf; only Up from the first shelf goes to the hero's first button (Play trailer).
  if (!wall && dy && current.item) {
    var shelves = Array.prototype.slice.call($('list').querySelectorAll('.shelf'));
    var index = shelves.indexOf(current.parentNode);
    if (shelves[index + dy]) { setFocus(nearest(current, shelves[index + dy].querySelectorAll('.focusable'))); return; }
    var firstAction = $('hero-actions').querySelector('.focusable');
    if (dy === -1 && firstAction) { setFocus(firstAction); return; }
  }
  var a = current.getBoundingClientRect();
  var ax = a.left + a.width / 2, ay = a.top + a.height / 2;
  var best = null, bestScore = Infinity;
  items.forEach(function (item) {
    if (item === current) return;
    var b = item.getBoundingClientRect();
    var bx = b.left + b.width / 2, by = b.top + b.height / 2;
    var along = dx ? (bx - ax) * dx : (by - ay) * dy;
    var across = dx ? Math.abs(by - ay) : Math.abs(bx - ax);
    // must lie in the pressed direction; on the same line for left/right
    if (along <= 1) return;
    if (dx && across > a.height / 2 + b.height / 2) return;
    var score = along + across * 3;
    if (score < bestScore) { bestScore = score; best = item; }
  });
  if (best) setFocus(best);
}

// The item whose centre is closest horizontally: a short shelf must not be skipped for being off to one side.
function nearest(current, items) {
  function centre(e) { var r = e.getBoundingClientRect(); return r.left + r.width / 2; }
  var x = centre(current);
  return Array.prototype.slice.call(items).sort(function (a, b) { return Math.abs(centre(a) - x) - Math.abs(centre(b) - x); })[0];
}

// ---- main: hero for the focused title, poster rows below ----
var IMG = 'https://image.tmdb.org/t/p/';
var heroItem = null;
var ROW_TITLE = { upcoming: 'Coming soon in Germany', trailers: 'Newest trailers', recent: 'Recently released in Germany', all: 'All titles' };

// The release an item stands for: its calendar entry, or the title's next (else latest) German date.
function itemRelease(item) {
  if (item.kind) return item;
  var all = releases(item.title, 'all').sort(function (a, b) { return a.date < b.date ? -1 : 1; });
  var today = isoDay(0);
  return all.filter(function (entry) { return entry.date >= today; })[0] || all[all.length - 1] || null;
}
// Line for a title without a German date: a series says where it streams, a movie says it has no date.
function releaseless(title) {
  return isSeries(title) ? availableText(title) || '' : 'No German release date';
}
// "Premieres on Netflix": a streaming release whose service is only expected (TMDB's release note), not yet listed as streaming.
function premiereText(title, kind, date) {
  if (kind !== 'streaming' || (title.providers && title.providers.length) || date < isoDay(0)) return null;
  var expected = title.providers_expected || [];
  return expected.length ? 'Premieres on ' + expected.map(function (p) { return p.name; }).join(', ') : null;
}
function whereText(title, kind, date) {
  if (kind === 'cinema') return 'Cinema';
  return premiereText(title, kind, date) || (title.providers && title.providers.length ? title.providers.map(function (p) { return p.name; }).join(', ') : 'Streaming');
}

// place (shelf and data-id of a poster) restores the viewer's position; without it, or when the title is gone, the first poster.
function renderList(place) {
  var list = $('list');
  var shown = allTitles.filter(matchesFilter);
  var active = activeCount();
  renderFilterButtons();
  var sections = viewSections(currentView, shown, selection.kind);
  var count = viewCount(shown, selection.kind);
  list.textContent = '';
  list.scrollTop = 0;
  focused.poster = null;
  $('count').textContent = loadError ? '' : countText(count, active ? viewCount(allTitles, 'all') : null);
  $('count').style.visibility = '';
  $('message').textContent = loadError || (count ? '' : (allTitles.length ? 'No titles in this view match the filter.' : 'No titles imported yet.'));
  $('retry').className = loadError ? 'btn focusable' : 'btn hidden';
  // Calendar views come back per day; on the TV they are one row in date order.
  var rows = currentView === 'genres' ? sections :
    [{ heading: ROW_TITLE[currentView], items: [].concat.apply([], sections.map(function (s) { return s.items; })) }];
  rows.forEach(function (row) {
    if (!row.items.length) return;
    list.appendChild(el('h3', 'shelf-title serif', row.heading));
    var shelf = el('div', 'shelf');
    row.items.forEach(function (item) {
      var card = posterCard(item);
      card.setAttribute('data-shelf', row.heading);
      shelf.appendChild(card);
    });
    list.appendChild(shelf);
  });
  var first = list.querySelector('.focusable');
  var target = (place && (list.querySelector('[data-shelf="' + place.shelf + '"][data-id="' + place.id + '"]') ||
    list.querySelector('[data-id="' + place.id + '"]'))) || first;
  if (!wall) showHero(target ? target.item : null);
  setFocus(target || (loadError ? $('retry') : $('open-filter')));
}

// What the current view lists: releases in the calendar views, else titles (once, though on several genre shelves).
function viewCount(titles, kind) {
  if (currentView === 'genres') return titles.filter(function (title) { return inKind(title, kind); }).length;
  return viewSections(currentView, titles, kind).reduce(function (sum, section) { return sum + section.items.length; }, 0);
}
// "310 releases", or "44 of 310 releases" with a filter (total is then the unfiltered number).
function countText(count, total) {
  var noun = currentView === 'upcoming' || currentView === 'recent' ? 'release' : 'title';
  var last = total === null ? count : total;
  return (total === null ? '' : count + ' of ') + last + ' ' + noun + (last === 1 ? '' : 's');
}

// The header says that a filter is on. Clear filter exists only then; a hidden one must not be focusable.
function renderFilterButtons() {
  var active = activeCount();
  $('open-filter').textContent = active ? 'Filter (' + active + ')' : 'Filter';
  $('open-filter').className = 'btn focusable' + (active ? ' on' : '') + (/(^| )focus( |$)/.test($('open-filter').className) ? ' focus' : '');
  $('clear-filter').className = active ? 'btn focusable' : 'btn hidden';
  $('views').className = active ? 'tight' : '';
}

function captionDate(iso) { // "Tue 24 Nov"
  return longDate(iso).replace(',', '').replace(/ \d{4}$/, '');
}

function posterCard(item) {
  var title = item.title;
  var card = el('div', 'poster focusable');
  var frame = el('div', 'frame');
  if (title.poster_path) frame.style.backgroundImage = 'url(' + IMG + 'w342' + title.poster_path + ')';
  else frame.appendChild(el('div', 'fallback serif', title.title));
  card.appendChild(frame);
  var release = itemRelease(item);
  if (isSeries(title)) frame.appendChild(el('div', 'badge series', 'Series'));
  else if (release) frame.appendChild(el('div', 'badge ' + release.kind, release.kind === 'cinema' ? 'Cinema' :
    // "Premieres on" and the service on two lines
    (premiereText(title, release.kind, release.date) || (title.providers && title.providers.length ? title.providers[0].name : 'Streaming')).replace(/^Premieres on /, 'Premieres on\n')));
  card.appendChild(el('div', 'cap', release ? captionDate(release.date) : (availableText(title, true) || (title.trailer ? '' : 'No trailer'))));
  card.setAttribute('data-id', titleKey(title));
  card.item = item;
  card.onactivate = function () {
    if (title.trailer) play(title);
    else showNotice('No trailer', wall ? ' \u00b7 hold OK for details' : '');
  };
  card.onlongpress = function () { openDialog(item); };
  return card;
}

var NOTICE_MS = 3000;
var noticeTimer = null;
function showNotice(strong, rest) {
  $('notice').textContent = '';
  $('notice').appendChild(el('strong', '', strong));
  if (rest) $('notice').appendChild(el('span', '', rest));
  $('notice').className = '';
  clearTimeout(noticeTimer);
  noticeTimer = setTimeout(function () { $('notice').className = 'hidden'; }, NOTICE_MS);
}

// Rows layout: the hero follows the focused poster: backdrop, date, title, synopsis, Play / Details / Request.
function showHero(item) {
  heroItem = item;
  var actions = $('hero-actions');
  actions.textContent = '';
  if (!item) {
    $('hero-title').textContent = ''; $('hero-date').textContent = ''; $('hero-text').textContent = '';
    $('backdrop').style.backgroundImage = 'none';
    return;
  }
  var title = item.title;
  var release = itemRelease(item);
  $('hero-title').textContent = title.title;
  $('hero-date').textContent = release ? longDate(release.date) + ' · ' + whereText(title, release.kind, release.date) : releaseless(title);
  // in front, so a long line never cuts the mark off
  if (isSeries(title)) $('hero-date').insertBefore(el('span', 'kbadge', 'Series'), $('hero-date').firstChild);
  fillSynopsis($('hero-text'), title);
  $('backdrop').style.backgroundImage = title.backdrop_path ? 'url(' + IMG + 'w1280' + title.backdrop_path + ')' : 'none';

  if (title.trailer) {
    var playButton = el('span', 'action solid focusable', 'Play trailer');
    playButton.onactivate = function () { play(title); };
    actions.appendChild(playButton);
  } else {
    actions.appendChild(el('span', 'action-note', 'No trailer'));
  }
  if (title.overview) { // the hero shows two lines; the dialog has the whole synopsis
    var details = el('span', 'action focusable', 'Details');
    details.onactivate = function () { openDialog(item); };
    actions.appendChild(details);
  }
  appendRequest(actions, title, function () {
    if (heroItem && heroItem.title === title) refreshHero();
  });
}
// Redraws the hero (Seerr state changed) without moving focus: it stays where it is, in whatever layer; only a hero
// button that was focused is replaced by its successor, or by the poster when none is left.
function refreshHero() {
  if (!heroItem) return;
  var actions = $('hero-actions');
  var old = actions.querySelector('.focus');
  var at = old ? Array.prototype.indexOf.call(actions.querySelectorAll('.focusable'), old) : -1;
  showHero(heroItem);
  if (at < 0) return;
  var now = actions.querySelectorAll('.focusable');
  var target = now[Math.min(at, now.length - 1)] || focused.poster;
  target.className += ' focus';
  focused.main = target;
}
// Synopsis with the DE badge when the stored text is the German fallback.
function fillSynopsis(box, title) {
  box.textContent = title.overview || '';
  if (title.overview && title.overview_lang === 'de') box.insertBefore(el('span', 'lang', 'DE'), box.firstChild);
}
// Seerr status label, or the request button when the title is not requested yet.
function appendRequest(box, title, done) {
  var status = seerrStatus[titleKey(title)];
  if (SEERR_LABELS[status]) box.appendChild(el('span', 'action-note', SEERR_LABELS[status]));
  else box.appendChild(requestButton(title, done));
}

function renderViews() {
  var nav = $('views');
  nav.textContent = '';
  VIEWS.forEach(function (view) {
    var button = el('span', 'btn focusable' + (view[0] === currentView ? ' on' : ''), view[1]);
    button.onactivate = function () {
      currentView = view[0];
      renderViews();
      renderList();
      setFocus($('views').querySelector('.on'));
    };
    nav.appendChild(button);
  });
}
// OK sends the title's request to Seerr through the backend; done runs once the status is known.
function requestButton(title, done) {
  var button = el('span', 'action focusable', isSeries(title) ? 'Request season 1 via Seerr' : 'Request via Seerr'); // a series request asks for the first season only
  button.onactivate = function () {
    if (button.busy) return;
    button.busy = true;
    button.textContent = 'Requesting...';
    sendJson('POST', API + '/api/request/' + mediaType(title) + '/' + title.tmdb_id, function (error, result) {
      button.busy = false;
      if (error) { button.textContent = 'Failed - OK retries'; return; }
      seerrStatus[titleKey(title)] = result.status;
      done();
    });
  };
  return button;
}

function renderLayout() {
  $('main').className = 'layer' + (wall ? ' wall' : '') + (layer === 'main' ? '' : ' hidden');
  removeClass($('layout-wall'), 'on');
  removeClass($('layout-rows'), 'on');
  $(wall ? 'layout-wall' : 'layout-rows').className += ' on';
}
[['layout-wall', true], ['layout-rows', false]].forEach(function (option) {
  $(option[0]).onactivate = function () {
    if (wall === option[1]) return;
    wall = option[1];
    try { window.localStorage.setItem(LAYOUT_KEY, wall ? 'wall' : 'rows'); } catch (error) {}
    renderLayout();
    renderList();
    setFocus($(option[0]));
  };
});
renderLayout();
renderViews();
renderFilterButtons();
$('open-filter').onactivate = openFilter;
$('clear-filter').onactivate = function () {
  selection = { v: 1, genres: [], keywords: [], kind: 'all' };
  saveSelection();
  renderList();
};

// ---- wall: long press OK opens an info dialog, short press plays ----
// Tizen 4.0 repeats keydown while OK is held, so the hold time is measured from the first keydown.
var LONG_PRESS_MS = 600;
var REPEAT_GAP_MS = 1000; // a keydown this long after the last one is a new press (a keyup got lost)
// -> { press, event: 'start' | 'hold' | 'long' }; 'long' fires once per press. Mutates press.
function okDown(press, now) {
  if (!press || now - press.last > REPEAT_GAP_MS) return { press: { start: now, last: now, long: false }, event: 'start' };
  press.last = now;
  if (!press.long && now - press.start >= LONG_PRESS_MS) { press.long = true; return { press: press, event: 'long' }; }
  return { press: press, event: 'hold' };
}
var okPress = null;
var dialogItem = null;

// Play comes first and has focus; without a trailer Close has it, so a stray OK never sends a Seerr request.
function openDialog(item) {
  dialogItem = item;
  var title = item.title;
  var release = itemRelease(item);
  $('dlg-poster').style.backgroundImage = title.poster_path ? 'url(' + IMG + 'w342' + title.poster_path + ')' : 'none';
  $('dlg-poster').textContent = '';
  if (isSeries(title)) $('dlg-poster').appendChild(el('div', 'badge series', 'Series'));
  $('dlg-title').textContent = title.title;
  $('dlg-date').textContent = release ? whereText(title, release.kind, release.date) + ' · ' + shortDate(release.date) : releaseless(title);
  fillSynopsis($('dlg-text'), title);
  var actions = $('dlg-actions');
  actions.textContent = '';
  var playButton = null;
  if (title.trailer) {
    playButton = el('span', 'action solid focusable', '\u25B6  Play trailer');
    playButton.onactivate = function () { closeDialog(); play(title); }; // Back from the player then lands on the poster
    actions.appendChild(playButton);
  }
  appendRequest(actions, title, function () {
    if (!wall && heroItem && heroItem.title === title) refreshHero(); // the dialog may sit over the hero
    if (layer === 'dialog' && dialogItem === item) openDialog(item);
  });
  if (!title.trailer) actions.appendChild(el('span', 'action-note', 'No trailer  '));
  var close = el('span', 'action focusable', 'Close');
  close.onactivate = closeDialog;
  actions.appendChild(close);
  $('dialog').className = 'layer';
  layer = 'dialog';
  setFocus(playButton || close);
}
function closeDialog() {
  $('dialog').className = 'layer hidden';
  layer = 'main';
  setFocus(focused.main);
}

// ---- filter panel ----
function tagButton(kind, tag) {
  var ids = selection[kind];
  var button = el('span', 'tag focusable' + (ids.indexOf(tag.id) !== -1 ? ' on' : ''),
    tag.name + (kind === 'keywords' ? ' (' + tag.count + ')' : ''));
  button.onactivate = function () {
    var index = ids.indexOf(tag.id);
    if (index === -1) ids.push(tag.id); else ids.splice(index, 1);
    if (index === -1) button.className = button.className.replace('tag', 'tag on');
    else removeClass(button, 'on');
    saveSelection();
  };
  return button;
}
// Exactly one release kind is chosen: OK moves the choice, and pressing the chosen one keeps it.
function kindButton(kind) {
  var button = el('span', 'tag focusable' + (selection.kind === kind[0] ? ' on' : ''), kind[1]);
  button.onactivate = function () {
    selection.kind = kind[0];
    var chosen = $('kinds').querySelector('.on');
    if (chosen) removeClass(chosen, 'on');
    button.className = button.className.replace('tag', 'tag on');
    saveSelection();
  };
  return button;
}
function byName(a, b) { return a.name < b.name ? -1 : a.name > b.name ? 1 : 0; }
function openFilter() {
  var genres = $('genres'), keywords = $('keywords');
  genres.textContent = '';
  keywords.textContent = '';
  $('kinds').textContent = '';
  KINDS.forEach(function (kind) { $('kinds').appendChild(kindButton(kind)); });
  collectTags('genres').sort(byName).forEach(function (tag) { genres.appendChild(tagButton('genres', tag)); });
  // shortcut: top 60 keywords by count, no text search (typing with the remote is painful); add paging if users miss some.
  collectTags('keywords').sort(function (a, b) { return b.count - a.count || byName(a, b); }).slice(0, 60)
    .forEach(function (tag) { keywords.appendChild(tagButton('keywords', tag)); });
  keywords.scrollTop = 0;
  filterOpenedWith = JSON.stringify(selection);
  showLayer('filter');
  setFocus($('kinds').querySelector('.on') || $('kinds').querySelector('.focusable'));
}
var filterOpenedWith = ''; // the choices when Filter opened: unchanged ones leave the list, and its scroll, alone
function closeFilter() {
  showLayer('main');
  var poster = focused.poster;
  if (poster && JSON.stringify(selection) === filterOpenedWith) { setFocus(poster); return; }
  renderList(poster ? { shelf: poster.getAttribute('data-shelf'), id: poster.getAttribute('data-id') } : null);
}

// ---- player: fullscreen <video> on the backend's cached MP4 ----
// Overlay helpers are pure (tested in backend/test/tv-player.test.js).
var OVERLAY_MS = 3000;
function fmtTime(sec) {
  sec = sec > 0 && isFinite(sec) ? Math.floor(sec) : 0;
  var s = sec % 60;
  return Math.floor(sec / 60) + ':' + (s < 10 ? '0' : '') + s;
}
// Seek target: base + delta, never below 0, never past the end once the duration is known.
function seekPosition(base, delta, duration) {
  var t = base + delta;
  if (duration > 0 && isFinite(duration)) t = Math.min(t, duration);
  return Math.max(0, t);
}
function overlayState(position, duration) {
  var known = duration > 0 && isFinite(duration);
  return { text: fmtTime(position) + ' / ' + fmtTime(duration), percent: known ? Math.min(100, Math.max(0, position / duration * 100)) : 0 };
}
var overlayTimer = null;
var seekTarget = null; // set while a seek is pending, so repeated presses add up and the bar shows the target
function paintOverlay() {
  var video = $('video');
  var state = overlayState(seekTarget !== null ? seekTarget : video.currentTime, video.duration);
  $('ptime').textContent = state.text;
  $('pfill').style.width = state.percent + '%';
  $('pi').className = 'pi ' + (video.paused ? 'paused' : 'playing');
}
function hideOverlay() {
  clearTimeout(overlayTimer);
  overlayTimer = null;
  $('ctl').className = 'hidden';
}
// Shown on every seek/pause/resume; stays while paused, hides OVERLAY_MS after the last key while playing.
function showOverlay() {
  $('ctl').className = '';
  paintOverlay();
  clearTimeout(overlayTimer);
  overlayTimer = $('video').paused ? null : setTimeout(hideOverlay, OVERLAY_MS);
}
function syncOverlay() {
  if (!$('video').seeking) seekTarget = null;
  if ($('ctl').className === '') paintOverlay();
}
function play(title) {
  var token = ++playToken;
  var video = $('video');
  showLayer('player');
  hideOverlay();
  seekTarget = null;
  $('status').textContent = 'Loading trailer: ' + title.title;
  getJson(API + '/api/stream/' + mediaType(title) + '/' + title.tmdb_id, function (error, stream) {
    if (token !== playToken) return;
    if (error) { $('status').textContent = 'Trailer unavailable (' + error + '). Back returns.'; return; }
    video.src = API + stream.url;
    video.play();
  });
}
function closePlayer() {
  var video = $('video');
  playToken += 1;
  video.pause();
  video.removeAttribute('src');
  video.load();
  hideOverlay();
  seekTarget = null;
  showLayer('main');
  setFocus(focused.main);
}
$('video').addEventListener('playing', function () { $('status').textContent = ''; });
$('video').addEventListener('ended', closePlayer);
$('video').addEventListener('timeupdate', syncOverlay);
$('video').addEventListener('seeked', syncOverlay);
$('video').addEventListener('error', function () {
  if ($('video').getAttribute('src')) $('status').textContent = 'Playback failed. Back returns.';
});
function playerKey(code) {
  var video = $('video');
  if (code === KEYS.ENTER || code === KEYS.PLAY_PAUSE || code === KEYS.PLAY || code === KEYS.PAUSE) {
    if (video.paused) video.play(); else video.pause();
    showOverlay();
  } else if (code === KEYS.RIGHT || code === KEYS.FF || code === KEYS.LEFT || code === KEYS.RW) {
    var forward = code === KEYS.RIGHT || code === KEYS.FF;
    seekTarget = seekPosition(seekTarget !== null ? seekTarget : video.currentTime, forward ? 10 : -10, video.duration);
    video.currentTime = seekTarget;
    showOverlay();
  } else if (code === KEYS.STOP) {
    closePlayer();
  }
}

function showLayer(name) {
  ['main', 'filter', 'player'].forEach(function (id) {
    $(id).className = 'layer' + (id === 'main' && wall ? ' wall' : '') + (id === name ? '' : ' hidden');
  });
  layer = name;
}

function exitApp() {
  try { tizen.application.getCurrentApplication().exit(); } catch (error) {}
}

document.addEventListener('keydown', function (event) {
  var code = event.keyCode;
  var back = code === KEYS.BACK || code === KEYS.ESC || code === KEYS.BACKSPACE;
  if (back) {
    event.preventDefault();
    if (layer === 'dialog') closeDialog();
    else if (layer === 'player') closePlayer();
    else if (layer === 'filter') closeFilter();
    else exitApp();
    return;
  }
  if (layer === 'player') { playerKey(code); event.preventDefault(); return; }
  if (code === KEYS.LEFT) move(-1, 0);
  else if (code === KEYS.RIGHT) move(1, 0);
  else if (code === KEYS.UP) move(0, -1);
  else if (code === KEYS.DOWN) move(0, 1);
  else if (code === KEYS.ENTER) {
    var current = $(layer).querySelector('.focus');
    var step = okDown(okPress, Date.now());
    okPress = step.press;
    if (step.event === 'start') {
      // A wall poster waits for keyup (short = play) or the hold time (long = info); everything else acts at once.
      okPress.target = wall && layer === 'main' && current && current.onlongpress ? current : null;
      if (!okPress.target && current && current.onactivate) current.onactivate();
      // The timer works whether or not the TV repeats keydown while OK is held.
      if (okPress.target) {
        var press = okPress;
        press.timer = setTimeout(function () {
          if (okPress === press && !press.long && layer === 'main') { press.long = true; press.target.onlongpress(); }
        }, LONG_PRESS_MS);
      }
    } else if (step.event === 'long' && okPress.target) okPress.target.onlongpress();
  } else return;
  event.preventDefault();
});
document.addEventListener('keyup', function (event) {
  if (event.keyCode !== KEYS.ENTER) return;
  var press = okPress;
  okPress = null;
  if (press) clearTimeout(press.timer);
  if (press && press.target && !press.long && layer === 'main') press.target.onactivate();
});

// Media keys are only delivered after registration; arrows/OK/Back need none.
try {
  ['MediaPlay', 'MediaPause', 'MediaPlayPause', 'MediaStop', 'MediaFastForward', 'MediaRewind'].forEach(function (name) {
    tizen.tvinputdevice.registerKey(name);
  });
} catch (error) {}

function getJson(url, callback) { sendJson('GET', url, callback); }
function sendJson(method, url, callback) {
  var request = new XMLHttpRequest();
  request.open(method, url);
  request.timeout = 5 * 60 * 1000; // first play of a title may wait for the download
  request.onload = function () {
    var body;
    try { body = JSON.parse(request.responseText); } catch (error) { return callback('bad response'); }
    if (request.status < 200 || request.status >= 300) return callback(body.error || 'HTTP ' + request.status);
    callback(null, body);
  };
  request.onerror = function () { callback('backend unreachable'); };
  request.ontimeout = function () { callback('timeout'); };
  request.send();
}

function loadTitles() {
  getJson(API + '/api/titles', function (error, titles) {
    if (error) { loadError = 'Could not load titles: ' + error; renderList(); return; }
    allTitles = titles;
    renderList();
    // Seerr state comes second; without it the request button is still offered.
    getJson(API + '/api/seerr', function (seerrError, statuses) {
      if (seerrError) return;
      seerrStatus = statuses;
      if (!wall) refreshHero(); // posters carry no Seerr state, so the list stays as it is
    });
  });
}
$('retry').onactivate = function () {
  loadError = '';
  $('retry').className = 'btn hidden';
  $('message').textContent = 'Loading titles...';
  setFocus($('open-filter')); // focus must not stay on the hidden button
  loadTitles();
};
loadTitles();
</script>
</body>
</html>
