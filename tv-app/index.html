<!DOCTYPE html>
<html class="rr rr-tv" data-theme="dark">
<head>
<meta charset="utf-8">
<title>ReelRadar</title>
<link rel="stylesheet" href="design/tokens.css">
<link rel="stylesheet" href="design/components.css">
<style>
/* Fixed 1920x1080 stage, Tizen 4.0 (Chromium M56): no flex gap, no inset. Kit rules (design/README.md): text on orange is
   teal, focus is a white ring, orange only on the one primary action, nothing under 24px or outside the
   96 x 54 safe area (--tv-safe-x / --tv-safe-y). Components come from design/components.css. */
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--fg); }
.layer { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; }
.hidden, .rr-btn.hidden { display: none; }
.display { font-weight: 800; letter-spacing: -0.02em; }
#backdrop { position: absolute; right: 0; top: 0; width: 1400px; height: 790px; background: var(--bg) center / cover no-repeat; }
#shade { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
  background: linear-gradient(90deg, #071B1E 28%, rgba(7,27,30,0.9) 48%, rgba(7,27,30,0.15) 80%, rgba(7,27,30,0.3)),
              linear-gradient(0deg, #071B1E 34%, rgba(7,27,30,0) 58%),
              linear-gradient(180deg, rgba(7,27,30,0.94) 0%, rgba(7,27,30,0.8) 10%, rgba(7,27,30,0) 18%); }
header { position: absolute; left: var(--tv-safe-x); top: var(--tv-safe-y); width: 1728px; height: 64px; white-space: nowrap; }
.logo { display: inline-block; vertical-align: middle; height: 44px; margin-right: 24px; }
#views { display: inline-block; vertical-align: middle; }
#views .rr-btn { margin: 0; padding: 0 18px; color: var(--fg-muted); }
/* the current view: a raised teal fill and full-strength text; focus (white fill and ring) still reads over it */
#views .rr-btn.is-on { background: var(--surface-raised); color: var(--fg); }
#views .rr-btn.is-on.focus { background: var(--brand-white); color: var(--brand-teal); }
#tools { position: absolute; right: 0; top: 0; }
#tools > * { vertical-align: middle; }
#tools .rr-btn { margin: 0 16px 0 0; background: rgba(7,27,30,0.8); }
#tools .rr-btn.is-on { background: var(--fg); border-color: var(--fg); color: var(--bg); }
#tools .rr-btn.focus { background: var(--brand-white); color: var(--brand-teal); }
/* Wall / Rows: an outlined pill like Filter; the current layout has the raised fill, focus the white fill like every TV button */
#layout { padding: 2px; border: 2px solid var(--line-strong); background: rgba(7,27,30,0.8); }
#layout .rr-seg__opt { display: inline-block; vertical-align: top; width: 80px; height: 56px; padding: 0; text-align: center; line-height: 56px; color: var(--fg-muted); box-shadow: none; }
#layout .rr-seg__opt.is-on { background: var(--surface-raised); color: var(--fg); }
#layout .rr-seg__opt.focus { background: var(--brand-white); color: var(--brand-teal); }
#layout .ico { vertical-align: top; margin-top: 15px; }
#count { position: absolute; right: var(--tv-safe-x); top: 600px; line-height: 44px; color: var(--fg-muted); font-size: 24px; font-variant-numeric: tabular-nums; }
.ico { display: inline-block; vertical-align: middle; width: 26px; height: 26px; }
.ico.wall { background: linear-gradient(currentColor, currentColor) 0 0 / 11px 11px no-repeat, linear-gradient(currentColor, currentColor) 15px 0 / 11px 11px no-repeat,
  linear-gradient(currentColor, currentColor) 0 15px / 11px 11px no-repeat, linear-gradient(currentColor, currentColor) 15px 15px / 11px 11px no-repeat; }
.ico.rows { background: linear-gradient(currentColor, currentColor) 0 2px / 26px 4px no-repeat, linear-gradient(currentColor, currentColor) 0 11px / 26px 4px no-repeat,
  linear-gradient(currentColor, currentColor) 0 20px / 26px 4px no-repeat; }
#hero { position: absolute; left: var(--tv-safe-x); top: 146px; width: 1080px; }
#hero-date { font-size: 28px; line-height: 36px; height: 36px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--fg); font-weight: 500; font-variant-numeric: tabular-nums; }
#hero-date .rr-badge { margin-right: 16px; vertical-align: 2px; }
#hero-title { margin-top: 12px; font-size: 72px; line-height: 78px; max-height: 156px; overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
#hero-text { margin-top: 12px; font-size: 28px; line-height: 40px; color: var(--fg-muted); width: 980px; max-height: 80px; overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
.lang { display: inline-block; border: 2px solid currentColor; border-radius: 6px; font-size: 24px; line-height: 28px; font-weight: 700; margin-right: 12px; padding: 0 8px; vertical-align: 2px; }
#hero-actions { margin-top: 28px; white-space: nowrap; }
#hero-actions > *, #dlg-actions > * { vertical-align: middle; margin: 0 20px 0 0; }
#hero-actions .rr-btn--secondary { background: rgba(7,27,30,0.8); }
#hero-actions .rr-btn--secondary.focus { background: var(--brand-white); }
/* Seerr state is a real success; a missing trailer is only an absence */
.action-note { display: inline-block; font-size: 28px; font-weight: 600; color: var(--success); }
.action-note.muted { color: var(--fg-muted); }
/* Rows: posters start at the safe edge (96 px); the 24 px to their left holds the focus ring and its scale.
   A shelf is 426 px (44 heading + 14 + 14 padding + 354), the same as the list, so a step down shows one whole shelf. */
#list { position: absolute; left: 72px; top: 600px; width: 1848px; height: 426px; overflow: hidden; }
.shelf-title { margin: 0 0 6px 24px; font-size: 36px; font-weight: 700; line-height: 44px; height: 44px; white-space: nowrap; }
.shelf-title .note { margin-left: 20px; font-size: 26px; font-weight: 500; color: var(--fg-muted); }
/* 22px above the posters: a focused one grows 9px (scale 1.06) and its ring adds 8px, which the shelf must not clip */
.shelf { white-space: nowrap; overflow: hidden; height: 354px; padding: 22px 0 0 24px; }
.frame { background: var(--poster-empty) center / cover no-repeat; box-shadow: inset 0 0 0 2px var(--line); }
.frame.art { box-shadow: none; }
.frame .fallback { position: absolute; left: 16px; right: 16px; top: 38%; text-align: center; font-size: 26px; line-height: 32px; font-weight: 700; color: var(--fg); }
.rr-tvposter__cap { font-variant-numeric: tabular-nums; }
/* the poster's own pill near the bottom edge; the negative right margin lets it use the whole poster before it wraps */
.badge { position: absolute; left: 50%; bottom: 10px; margin-right: -50%; transform: translateX(-50%); max-width: 184px; box-sizing: border-box; white-space: pre-line; word-wrap: break-word; text-align: center; padding: 6px 14px; border-radius: 20px; background: var(--brand-teal); box-shadow: inset 0 0 0 2px rgba(255,255,255,0.18); color: var(--brand-white); font-size: 24px; line-height: 28px; font-weight: 700; }
.badge.streaming { background: var(--accent); box-shadow: none; color: var(--on-accent); }
.badge.series { background: var(--series); box-shadow: none; }
/* poster wall: eight posters a row between the safe edges, no hero; OK plays, holding OK opens the info dialog */
#main.wall #hero, #main.wall #backdrop { display: none; }
#main.wall #shade { background: var(--bg); }
#main.wall #count { top: 132px; }
#main.wall #list { top: 132px; height: 804px; }
#main.wall .shelf { white-space: normal; height: auto; overflow: visible; }
#main.wall .rr-tvposter { margin: 0 18px 24px 0; }
#main.wall .rr-tvposter__cap { display: none; }
#main.wall #message { top: 200px; }
/* the wall has no captions; under the list it only says what OK does */
#info { display: none; position: absolute; left: var(--tv-safe-x); top: 954px; width: 1728px; height: 72px; white-space: nowrap; }
#main.wall #info { display: block; }
#info-hint { position: absolute; right: 0; top: 0; font-size: 24px; line-height: 44px; color: var(--fg-muted); }
.key { display: inline-block; padding: 0 10px; margin: 0 8px 0 0; border-radius: 6px; border: 2px solid var(--line-strong); color: var(--fg); font-weight: 700; line-height: 34px; }
/* info dialog over the wall (long press OK) */
#dialog { background: var(--scrim); }
#dlg { position: absolute; left: 260px; top: 220px; width: 1400px; height: 640px; box-sizing: border-box; background: var(--surface); border: 2px solid var(--line); border-radius: 16px; box-shadow: var(--shadow-pop); }
#dlg-poster { position: absolute; left: 48px; top: 48px; width: 360px; height: 540px; border-radius: 8px; background: var(--poster-empty) center / cover no-repeat; }
#dlg-body { position: absolute; left: 464px; top: 48px; width: 884px; height: 540px; }
#dlg-title { font-size: 52px; line-height: 60px; max-height: 120px; overflow: hidden; margin-bottom: 8px; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
#dlg-date { font-size: 28px; line-height: 36px; font-weight: 500; color: var(--fg); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#dlg-genres { margin-top: 4px; font-size: 26px; line-height: 34px; color: var(--fg-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#dlg-text { font-size: 28px; line-height: 40px; color: var(--fg-muted); max-height: 200px; overflow: hidden; margin-top: 20px; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 5; }
#dlg-actions { position: absolute; left: 0; bottom: 0; white-space: nowrap; }
/* filter screen: Clear filter and Show sit top right, beside the title and the live count; neither is orange */
#filter { background: var(--bg); box-sizing: border-box; padding: var(--tv-safe-y) var(--tv-safe-x) 0; }
#filter h1 { margin: 0 0 32px; font-size: 48px; line-height: 64px; font-weight: 800; letter-spacing: -0.02em; white-space: nowrap; }
#filter h1 small { margin-left: 32px; font-size: 28px; font-weight: 500; letter-spacing: 0; color: var(--fg-muted); font-variant-numeric: tabular-nums; }
#filter-tools { position: absolute; right: var(--tv-safe-x); top: var(--tv-safe-y); }
#filter h2 { margin: 0 0 14px; font-size: 36px; line-height: 44px; font-weight: 700; }
#filter .rr-chips { margin-bottom: 16px; }
.rr-chip__count { margin-left: 12px; }
/* four whole rows, so a fourth row of genres still fits above the safe edge; the padding keeps the focus ring inside */
#filter #keywords { height: 272px; overflow: hidden; margin: -10px -10px 0; padding: 10px; }
/* titles cannot be loaded: the lockup, what to check and Try again; no header controls */
#error .logo { position: absolute; left: var(--tv-safe-x); top: var(--tv-safe-y); }
#error-body { position: absolute; left: var(--tv-safe-x); top: 380px; width: 1100px; }
#error h1 { margin: 0 0 24px; font-size: 72px; line-height: 78px; font-weight: 800; letter-spacing: -0.02em; }
#error p { margin: 0 0 48px; font-size: 32px; line-height: 46px; color: var(--fg-muted); }
#player { background: #000; }
#video { width: 1920px; height: 1080px; }
#ctl { position: absolute; left: 0; bottom: 0; width: 1920px; height: 260px; background: linear-gradient(0deg, rgba(0,0,0,0.8), rgba(0,0,0,0)); }
#ptitle { position: absolute; left: var(--tv-safe-x); bottom: 150px; width: 1400px; font-size: 36px; line-height: 44px; font-weight: 700; color: var(--brand-white); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* the icon is what OK does next: a play triangle while paused, pause bars while playing */
#ctl .pi { position: absolute; left: var(--tv-safe-x); bottom: 92px; width: 40px; height: 40px; }
#ctl .pi.paused { width: 0; height: 0; border-style: solid; border-width: 20px 0 20px 34px; border-color: transparent transparent transparent var(--brand-white); }
#ctl .pi.playing { border-left: 14px solid var(--brand-white); border-right: 14px solid var(--brand-white); width: 12px; box-sizing: content-box; }
#ptime { position: absolute; left: 160px; bottom: 92px; font-size: 30px; line-height: 40px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--brand-white); }
#phint { position: absolute; right: var(--tv-safe-x); bottom: 92px; font-size: 24px; line-height: 40px; color: rgba(255,255,255,0.82); }
#pbar { position: absolute; left: var(--tv-safe-x); bottom: 62px; width: 1728px; height: 10px; border-radius: 4px; overflow: hidden; background: rgba(255,255,255,0.24); }
#pfill { width: 0; height: 10px; background: var(--brand-orange); }
#status { position: absolute; left: var(--tv-safe-x); top: 480px; width: 1728px; text-align: center; font-size: 40px; line-height: 52px; color: var(--fg); }
#status small { display: block; margin-top: 16px; font-size: 28px; color: var(--fg-muted); }
#message { position: absolute; left: var(--tv-safe-x); top: 680px; width: 1728px; font-size: 32px; line-height: 44px; color: var(--fg-muted); }
#notice { position: absolute; left: 610px; top: 930px; width: 700px; box-sizing: border-box; padding: 18px 32px; text-align: center; font-size: 28px; line-height: 36px; font-weight: 600; background: var(--surface-raised); color: var(--brand-white); border-radius: 40px; box-shadow: inset 0 0 0 2px var(--line-strong), var(--shadow-pop); }
#notice span { font-weight: 500; color: var(--fg-muted); }
</style>
</head>
<body>
<div id="main" class="layer">
  <div id="backdrop"></div>
  <div id="shade"></div>
  <header>
    <img class="logo" src="design/logo-on-dark.svg" alt="ReelRadar">
    <div id="views"></div>
    <div id="tools">
      <span class="rr-btn rr-btn--secondary" id="open-filter">Filter</span><span id="layout" class="rr-seg"><span class="rr-seg__opt focusable" id="layout-wall"><span class="ico wall"></span></span><span class="rr-seg__opt focusable" id="layout-rows"><span class="ico rows"></span></span></span>
    </div>
  </header>
  <div id="count"></div>
  <div id="hero">
    <div id="hero-date"></div>
    <div id="hero-title" class="display"></div>
    <div id="hero-text"></div>
    <div id="hero-actions"></div>
  </div>
  <div id="message">Loading titles...</div>
  <div id="list"></div>
  <div id="info"><span id="info-hint"><span class="key">OK</span>Play trailer &nbsp; <span class="key">Hold OK</span>Details</span></div>
  <div id="notice" class="hidden"></div>
</div>
<div id="dialog" class="layer hidden">
  <div id="dlg">
    <div id="dlg-poster"></div>
    <div id="dlg-body">
      <div id="dlg-title" class="display"></div>
      <div id="dlg-date"></div>
      <div id="dlg-genres"></div>
      <div id="dlg-text"></div>
      <div id="dlg-actions"></div>
    </div>
  </div>
</div>
<div id="filter" class="layer hidden">
  <h1>Filter <small id="filter-count"></small></h1>
  <div id="filter-tools"><span class="rr-btn rr-btn--secondary focusable" id="filter-clear">Clear filter</span> <span class="rr-btn rr-btn--secondary focusable" id="filter-show"></span></div>
  <h2>Releases</h2>
  <div class="rr-chips" id="kinds"></div>
  <h2>Genres</h2>
  <div class="rr-chips" id="genres"></div>
  <h2>Keywords</h2>
  <div class="rr-chips" id="keywords"></div>
</div>
<div id="player" class="layer hidden">
  <video id="video"></video>
  <div id="status"></div>
  <div id="ctl" class="hidden"><div id="ptitle"></div><span id="pi" class="pi playing"></span><span id="ptime"></span><span id="phint">OK pauses · Left and Right skip 10 s · Back closes</span><div id="pbar"><div id="pfill"></div></div></div>
</div>
<div id="error" class="layer hidden">
  <img class="logo" src="design/logo-on-dark.svg" alt="ReelRadar">
  <div id="error-body">
    <h1>Can’t reach ReelRadar</h1>
    <p>Check that the ReelRadar server is running and that the TV is on your home network.</p>
    <span class="rr-btn rr-btn--primary focusable" id="retry">Try again</span>
  </div>
</div>
<script>
// ES5 only. API on rei3 (LAN, behind Caddy).
var API = 'http://192.168.42.57:8095';
var KEYS = { LEFT: 37, UP: 38, RIGHT: 39, DOWN: 40, ENTER: 13, BACK: 10009, ESC: 27, BACKSPACE: 8,
  PLAY: 415, PAUSE: 19, PLAY_PAUSE: 10252, STOP: 413, FF: 417, RW: 412 };
var FILTER_KEY = 'reelradar.filter';
// ---- identity: movie and series ids overlap in TMDB, so a title is (media_type, tmdb_id) ----
function mediaType(title) { return title.media_type === 'tv' ? 'tv' : 'movie'; }
function isSeries(title) { return mediaType(title) === 'tv'; }
function titleKey(title) { return mediaType(title) + ':' + title.tmdb_id; }
// A series has no German dates. Where it streams in Germany comes from TMDB's flatrate list; null shows nothing.
function availableText(title, short) {
  if (!isSeries(title) || !title.providers || !title.providers.length) return null;
  var names = title.providers.map(function (p) { return p.name; }).join(', ');
  return short ? 'On ' + names : 'Available on ' + names + ' in Germany';
}

// ---- views (same logic in frontend/index.html and tv-app/index.html) ----
var VIEWS = [['upcoming', 'Release calendar'], ['trailers', 'New trailers'], ['recent', 'Recently released'], ['genres', 'Genres'], ['all', 'All titles']];
var KINDS = [['all', 'All releases'], ['cinema', 'Cinema'], ['streaming', 'Streaming']];
var WINDOW_DAYS = 90; // "recently released" looks three months back
var AHEAD_DAYS = 183; // "upcoming" looks six months ahead, matching the import

function isoDay(offsetDays) {
  var d = new Date(Date.now() + offsetDays * 86400000);
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
}

// A title's German releases as entries; kind filter applies. Cinema = theatrical, streaming = digital.
function releases(title, kind) {
  var list = [];
  if (title.de_theatrical && kind !== 'streaming') list.push({ title: title, kind: 'cinema', date: title.de_theatrical });
  if (title.de_digital && kind !== 'cinema') list.push({ title: title, kind: 'streaming', date: title.de_digital });
  return list;
}

// Kind filter for the views without a calendar. A series has no cinema release; it counts as streaming when
// TMDB lists a German flatrate service for it.
function inKind(title, kind) {
  if (kind === 'all') return true;
  if (isSeries(title)) return kind === 'streaming' && !!(title.providers && title.providers.length);
  return releases(title, kind).length > 0;
}

// -> [{heading, note, items:[{title, kind, date}]}]; calendar views list each release on its day. A series has no
// German date, so it is not in the calendar views (Release calendar, Recently released); it is in the others.
// It is never under Cinema, and under Streaming only while it is on a German service.
function viewSections(view, titles, kind) {
  var today = isoDay(0);
  if (view === 'upcoming' || view === 'recent') {
    var from = view === 'upcoming' ? today : isoDay(-WINDOW_DAYS);
    var to = view === 'upcoming' ? isoDay(AHEAD_DAYS + 1) : today;
    var entries = [];
    titles.forEach(function (title) {
      releases(title, kind).forEach(function (entry) { if (entry.date >= from && entry.date < to) entries.push(entry); });
    });
    entries.sort(function (a, b) {
      var order = a.date < b.date ? -1 : a.date > b.date ? 1 : 0;
      return view === 'upcoming' ? order : -order;
    });
    var days = [];
    entries.forEach(function (entry) {
      var last = days[days.length - 1];
      if (!last || last.date !== entry.date) { last = { date: entry.date, heading: longDate(entry.date), items: [] }; days.push(last); }
      last.items.push(entry);
    });
    days.forEach(function (day) { day.note = day.items.length + (day.items.length === 1 ? ' release' : ' releases'); });
    return days;
  }
  var kept = titles.filter(function (title) { return inKind(title, kind); });
  function asItem(title) { return { title: title, kind: null, date: null }; }
  if (view === 'trailers') {
    var withTrailer = kept.filter(function (title) { return title.trailer; });
    withTrailer.sort(function (a, b) { return (b.trailer.published_at || '') > (a.trailer.published_at || '') ? 1 : -1; });
    return [{ heading: '', items: withTrailer.map(asItem) }];
  }
  if (view === 'genres') {
    var byName = {}, names = [];
    kept.forEach(function (title) {
      (title.genres || []).forEach(function (genre) {
        if (!byName[genre.name]) { byName[genre.name] = []; names.push(genre.name); }
        byName[genre.name].push(title);
      });
    });
    return names.sort().map(function (name) {
      return { heading: name, note: byName[name].length + ' titles', items: byName[name].map(asItem) };
    });
  }
  kept.sort(byTitle);
  return [{ heading: '', items: kept.map(asItem) }];
}
// A to Z, ignoring case and accents. Equal titles go by id: the TV's engine does not keep their order by itself.
function byTitle(a, b) {
  return a.title.localeCompare(b.title, 'en', { sensitivity: 'base' }) || (titleKey(a) < titleKey(b) ? -1 : 1);
}

var DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
function longDate(iso) {
  var d = new Date(iso + 'T12:00:00');
  return DAYS[d.getDay()] + ', ' + d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear();
}
function shortDate(iso) {
  var d = new Date(iso + 'T12:00:00');
  return d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear();
}

var currentView = 'upcoming';
var LAYOUT_KEY = 'reelradar.layout';
var wall = false; // poster wall layout instead of hero + rows
try { wall = window.localStorage.getItem(LAYOUT_KEY) === 'wall'; } catch (error) {}
var allTitles = [];
var loadFailed = false; // the error screen shows while the titles cannot be loaded
var seerrStatus = {}; // titleKey -> none|requested|partial|available
var SEERR_LABELS = { requested: 'Requested in Seerr', partial: 'Partly in the library', available: 'In the library' };
var selection = loadSelection();
var layer = 'main';           // main | filter | player | error | dialog (dialog sits over main)
var focused = { main: null, filter: null, error: null, dialog: null };
var playToken = 0;

function $(id) { return document.getElementById(id); }
function el(tag, className, text) {
  var e = document.createElement(tag);
  if (className) e.className = className;
  if (text !== undefined) e.textContent = text;
  return e;
}

function loadSelection() {
  try {
    var value = JSON.parse(window.localStorage.getItem(FILTER_KEY));
    if (value && value.v === 1 && value.genres instanceof Array && value.keywords instanceof Array) {
      value.kind = value.kind || 'all'; // filters saved before there was a Cinema/Streaming choice
      return value;
    }
  } catch (error) {}
  return { v: 1, genres: [], keywords: [], kind: 'all' };
}
function activeCount() {
  return selection.genres.length + selection.keywords.length + (selection.kind === 'all' ? 0 : 1);
}
function saveSelection() {
  try { window.localStorage.setItem(FILTER_KEY, JSON.stringify(selection)); } catch (error) {}
}
function hasAny(tags, ids) {

// Posters are fetched only near what is on screen: 300 background images at once stall the TV.

  $('filter-show').textContent = 'Show ' + count + ' ' + noun(count);
}
function byName(a, b) { return a.name < b.name ? -1 : a.name > b.name ? 1 : 0; }
function openFilter() {
  var genres = $('genres'), keywords = $('keywords');
  genres.textContent = '';
  keywords.textContent = '';
  $('kinds').textContent = '';
  KINDS.forEach(function (kind) { $('kinds').appendChild(kindButton(kind)); });
  collectTags('genres').sort(byName).forEach(function (tag) { genres.appendChild(tagButton('genres', tag)); });
  // shortcut: top 60 keywords by count, no text search (typing with the remote is painful); add paging if users miss some.
  collectTags('keywords').sort(function (a, b) { return b.count - a.count || byName(a, b); }).slice(0, 60)
    .forEach(function (tag) { keywords.appendChild(tagButton('keywords', tag)); });
  keywords.scrollTop = 0;
  filterOpenedWith = JSON.stringify(selection);
  renderFilterCount();
  showLayer('filter');
  setFocus($('kinds').querySelector('.is-on') || $('kinds').querySelector('.focusable'));
}
// Show closes the screen, as Back does. Clear filter stays on it; the list then shows everything.
$('filter-show').onactivate = closeFilter;
$('filter-clear').onactivate = function () {
  var openedWith = filterOpenedWith; // closing compares with the choices from before Filter opened
  selection = { v: 1, genres: [], keywords: [], kind: 'all' };
  saveSelection();
  openFilter();
  filterOpenedWith = openedWith;
};
var filterOpenedWith = ''; // the choices when Filter opened: unchanged ones leave the list, and its scroll, alone
function closeFilter() {
  showLayer('main');
  var poster = focused.poster;
  if (poster && JSON.stringify(selection) === filterOpenedWith) { setFocus(poster); return; }
  renderList(poster ? { shelf: poster.getAttribute('data-shelf'), id: poster.getAttribute('data-id') } : null);
}

// ---- player: fullscreen <video> on the backend's cached MP4 ----
// Overlay helpers are pure (tested in backend/test/tv-player.test.js).
var OVERLAY_MS = 3000;
function fmtTime(sec) {
  sec = sec > 0 && isFinite(sec) ? Math.floor(sec) : 0;
  var s = sec % 60;
  return Math.floor(sec / 60) + ':' + (s < 10 ? '0' : '') + s;
}
// Seek target: base + delta, never below 0, never past the end once the duration is known.
function seekPosition(base, delta, duration) {
  var t = base + delta;
  if (duration > 0 && isFinite(duration)) t = Math.min(t, duration);
  return Math.max(0, t);
}
function overlayState(position, duration) {
  var known = duration > 0 && isFinite(duration);
  return { text: fmtTime(position) + ' / ' + fmtTime(duration), percent: known ? Math.min(100, Math.max(0, position / duration * 100)) : 0 };
}
var overlayTimer = null;
var seekTarget = null; // set while a seek is pending, so repeated presses add up and the bar shows the target
function paintOverlay() {
  var video = $('video');
  var state = overlayState(seekTarget !== null ? seekTarget : video.currentTime, video.duration);
  $('ptime').textContent = state.text;
  $('pfill').style.width = state.percent + '%';
  $('pi').className = 'pi ' + (video.paused ? 'paused' : 'playing');
}
function hideOverlay() {
  clearTimeout(overlayTimer);
  overlayTimer = null;
  $('ctl').className = 'hidden';
}
// Shown on every seek/pause/resume; stays while paused, hides OVERLAY_MS after the last key while playing.
function showOverlay() {
  $('ctl').className = '';
  paintOverlay();
  clearTimeout(overlayTimer);
  overlayTimer = $('video').paused ? null : setTimeout(hideOverlay, OVERLAY_MS);
}
function syncOverlay() {
  if (!$('video').seeking) seekTarget = null;
  if ($('ctl').className === '') paintOverlay();
}
function play(title) {
  var token = ++playToken;
  var video = $('video');
  showLayer('player');
  hideOverlay();
  seekTarget = null;
  setStatus('Loading the trailer…', title.title);
  $('ptitle').textContent = title.title;
  getJson(API + '/api/stream/' + mediaType(title) + '/' + title.tmdb_id, function (error, stream) {
    if (token !== playToken) return;
    if (error) { setStatus('This trailer can’t be played: ' + error + '.', 'Back returns to the list'); return; }
    video.src = API + stream.url;
    video.play();
  });
}
function closePlayer() {
  var video = $('video');
  playToken += 1;
  video.pause();
  video.removeAttribute('src');
  video.load();
  hideOverlay();
  seekTarget = null;
  showLayer('main');
  setFocus(focused.main);
}
// A message with a quieter second line, in the middle of the player.
function setStatus(message, detail) {
  $('status').textContent = message;
  if (detail) $('status').appendChild(el('small', '', detail));
}
$('video').addEventListener('playing', function () { $('status').textContent = ''; });
$('video').addEventListener('ended', closePlayer);
$('video').addEventListener('timeupdate', syncOverlay);
$('video').addEventListener('seeked', syncOverlay);
$('video').addEventListener('error', function () {
  if ($('video').getAttribute('src')) setStatus('This trailer stopped playing.', 'Back returns to the list');
});
function playerKey(code) {
  var video = $('video');
  if (code === KEYS.ENTER || code === KEYS.PLAY_PAUSE || code === KEYS.PLAY || code === KEYS.PAUSE) {
    if (video.paused) video.play(); else video.pause();
    showOverlay();
  } else if (code === KEYS.RIGHT || code === KEYS.FF || code === KEYS.LEFT || code === KEYS.RW) {
    var forward = code === KEYS.RIGHT || code === KEYS.FF;
    seekTarget = seekPosition(seekTarget !== null ? seekTarget : video.currentTime, forward ? 10 : -10, video.duration);
    video.currentTime = seekTarget;
    showOverlay();
  } else if (code === KEYS.STOP) {
    closePlayer();
  }
}

function showLayer(name) {
  ['main', 'filter', 'player', 'error'].forEach(function (id) {
    $(id).className = 'layer' + (id === 'main' && wall ? ' wall' : '') + (id === name ? '' : ' hidden');
  });
  layer = name;
}

function exitApp() {
  try { tizen.application.getCurrentApplication().exit(); } catch (error) {}
}

document.addEventListener('keydown', function (event) {
  var code = event.keyCode;
  var back = code === KEYS.BACK || code === KEYS.ESC || code === KEYS.BACKSPACE;
  if (back) {
    event.preventDefault();
    if (layer === 'dialog') closeDialog();
    else if (layer === 'player') closePlayer();
    else if (layer === 'filter') closeFilter();
    else exitApp();
    return;
  }
  if (layer === 'player') { playerKey(code); event.preventDefault(); return; }
  if (code === KEYS.LEFT) move(-1, 0);
  else if (code === KEYS.RIGHT) move(1, 0);
  else if (code === KEYS.UP) move(0, -1);
  else if (code === KEYS.DOWN) move(0, 1);
  else if (code === KEYS.ENTER) {
    var current = $(layer).querySelector('.focus');
    var step = okDown(okPress, Date.now());
    okPress = step.press;
    if (step.event === 'start') {
      // A wall poster waits for keyup (short = play) or the hold time (long = info); everything else acts at once.
      okPress.target = wall && layer === 'main' && current && current.onlongpress ? current : null;
      if (!okPress.target && current && current.onactivate) current.onactivate();
      // The timer works whether or not the TV repeats keydown while OK is held.
      if (okPress.target) {
        var press = okPress;
        press.timer = setTimeout(function () {
          if (okPress === press && !press.long && layer === 'main') { press.long = true; press.target.onlongpress(); }
        }, LONG_PRESS_MS);
      }
    } else if (step.event === 'long' && okPress.target) okPress.target.onlongpress();
  } else return;
  event.preventDefault();
});
document.addEventListener('keyup', function (event) {
  if (event.keyCode !== KEYS.ENTER) return;
  var press = okPress;
  okPress = null;
  if (press) clearTimeout(press.timer);
  if (press && press.target && !press.long && layer === 'main') press.target.onactivate();
});

// Media keys are only delivered after registration; arrows/OK/Back need none.
try {
  ['MediaPlay', 'MediaPause', 'MediaPlayPause', 'MediaStop', 'MediaFastForward', 'MediaRewind'].forEach(function (name) {
    tizen.tvinputdevice.registerKey(name);
  });
} catch (error) {}

function getJson(url, callback) { sendJson('GET', url, callback); }
function sendJson(method, url, callback) {
  var request = new XMLHttpRequest();
  request.open(method, url);
  request.timeout = 5 * 60 * 1000; // first play of a title may wait for the download
  request.onload = function () {
    var body;
    // The messages are shown on screen, so they say what happened in words, never a status code.
    try { body = JSON.parse(request.responseText); } catch (error) { return callback('the server sent an unreadable answer'); }
    if (request.status < 200 || request.status >= 300) return callback(body.error || 'the server had a problem');
    callback(null, body);
  };
  request.onerror = function () { callback('the ReelRadar server cannot be reached'); };
  request.ontimeout = function () { callback('the server took too long'); };
  request.send();
}

function loadTitles() {
  getJson(API + '/api/titles', function (error, titles) {
    loadFailed = !!error; // the screen says what to check; the cause (a status, a bad answer) helps nobody on a sofa
    if (error) { renderList(); return; }
    allTitles = titles;
    renderList();
    // Seerr state comes second; without it the request button is still offered.
    getJson(API + '/api/seerr', function (seerrError, statuses) {
      if (seerrError) return;
      seerrStatus = statuses;
      if (!wall) refreshHero(); // posters carry no Seerr state, so the list stays as it is
    });
  });
}
// The error screen stays until the titles are there, so a second failure does not flash the empty list.
$('retry').onactivate = function () {
  if ($('retry').busy) return;
  $('retry').busy = true;
  $('retry').textContent = 'Trying\u2026';
  loadTitles();
};
loadTitles();
</script>
