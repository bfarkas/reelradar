<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>ReelRadar</title>
<style>
/* Fixed 1920x1080 stage, Tizen 4.0 (Chromium M56): no flex gap, no inset. "Screening room" look. */
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #120e0b; color: #f4ede3; font-family: sans-serif; }
.layer { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; }
.hidden { display: none; }
.serif { font-family: Georgia, "Times New Roman", serif; }
#backdrop { position: absolute; right: 0; top: 0; width: 1400px; height: 790px; background: #120e0b center / cover no-repeat; }
#shade { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
  background: linear-gradient(90deg, #120e0b 28%, rgba(18,14,11,0.85) 45%, rgba(18,14,11,0.2) 75%, rgba(18,14,11,0.35)),
              linear-gradient(0deg, #120e0b 30%, rgba(18,14,11,0) 55%); }
header { position: absolute; left: 80px; top: 36px; width: 1760px; height: 80px; white-space: nowrap; }
.logo { display: inline-block; vertical-align: middle; margin-right: 30px; font-size: 54px; font-weight: bold; }
.logo span { color: #e0412a; }
#views { display: inline-block; vertical-align: middle; margin-right: 24px; }
#count { position: absolute; right: 80px; top: 648px; color: #a89c8e; font-size: 24px; }
.btn { display: inline-block; vertical-align: middle; margin-right: 6px; padding: 12px 20px; font-size: 26px; border: 4px solid transparent; border-radius: 40px; color: #f4ede3; }
.btn.on { background: #c8321e; }
.btn.focus { border-color: #fff; background: rgba(255,255,255,0.14); }
.btn.on.focus { background: #c8321e; }
/* layout switcher like the web page: one segmented control, the active half red */
#layout { display: inline-block; vertical-align: middle; border: 2px solid #5a4d42; border-radius: 40px; padding: 2px; }
#layout .btn { margin: 0; padding: 12px 22px; }
.ico { display: inline-block; vertical-align: middle; width: 26px; height: 26px; }
.ico.wall { background: linear-gradient(#f4ede3, #f4ede3) 0 0 / 11px 11px no-repeat, linear-gradient(#f4ede3, #f4ede3) 15px 0 / 11px 11px no-repeat,
  linear-gradient(#f4ede3, #f4ede3) 0 15px / 11px 11px no-repeat, linear-gradient(#f4ede3, #f4ede3) 15px 15px / 11px 11px no-repeat; }
.ico.rows { background: linear-gradient(#f4ede3, #f4ede3) 0 2px / 26px 4px no-repeat, linear-gradient(#f4ede3, #f4ede3) 0 11px / 26px 4px no-repeat,
  linear-gradient(#f4ede3, #f4ede3) 0 20px / 26px 4px no-repeat; }
#hero { position: absolute; left: 80px; top: 170px; width: 1150px; height: 440px; }
#kicker { color: #e0412a; font-size: 24px; font-weight: bold; letter-spacing: 4px; text-transform: uppercase; height: 34px; }
#hero-title { margin: 6px 0 14px; font-size: 76px; line-height: 1.05; max-height: 160px; overflow: hidden; }
#hero-date { font-size: 30px; color: #e8dccd; height: 44px; }
#hero-text { font-size: 27px; line-height: 1.4; color: #cfc3b5; width: 1000px; max-height: 114px; overflow: hidden; }
#hero-actions { position: absolute; left: 0; top: 372px; white-space: nowrap; }
.action { display: inline-block; margin-right: 22px; padding: 14px 34px; font-size: 28px; font-weight: bold; border-radius: 12px; border: 4px solid #f4ede3; }
.action.solid { background: #f4ede3; color: #1d1712; }
.action.focus { border-color: #e0412a; box-shadow: 0 0 0 4px #e0412a; }
.action-note { display: inline-block; font-size: 26px; color: #9fcf8f; }
#list { position: absolute; left: 80px; top: 640px; width: 1840px; height: 440px; overflow: hidden; }
.shelf-title { margin: 0 0 14px; font-size: 34px; height: 44px; }
.shelf { white-space: nowrap; overflow: hidden; height: 370px; padding: 6px 0 0 6px; }
.poster { display: inline-block; vertical-align: top; width: 200px; margin-right: 22px; white-space: normal; }
.poster .frame { width: 200px; height: 300px; border-radius: 10px; background: #2a221c center / cover no-repeat; border: 5px solid transparent; margin: -5px; position: relative; overflow: hidden; }
.poster .fallback { position: absolute; left: 12px; right: 12px; top: 110px; text-align: center; font-size: 26px; }
.poster .cap { margin-top: 14px; font-size: 21px; color: #a89c8e; white-space: nowrap; overflow: hidden; }
.poster.focus .frame { border-color: #e0412a; box-shadow: 0 0 30px rgba(224,65,42,0.6); }
.poster.focus .cap { color: #f4ede3; }
/* badge on posters; poster wall mode (denser grid, info bar instead of the hero) */
.badge { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); max-width: 160px; overflow: hidden; white-space: nowrap; padding: 4px 10px; border-radius: 5px; background: rgba(18,14,11,0.88); font-size: 17px; font-weight: bold; letter-spacing: 1px; text-transform: uppercase; }
.badge.streaming { background: #c8321e; }
#infobar { display: none; position: absolute; left: 80px; top: 966px; width: 1760px; height: 74px; border-top: 2px solid #3a2f27; padding-top: 18px; white-space: nowrap; }
#infobar .mark { display: inline-block; vertical-align: middle; width: 6px; height: 46px; background: #e0412a; margin-right: 22px; }
#infobar .name { display: inline-block; vertical-align: middle; max-width: 820px; overflow: hidden; font-size: 40px; }
#infobar .sep { display: inline-block; vertical-align: middle; width: 2px; height: 40px; background: #5a4e44; margin: 0 28px; }
#infobar .info { display: inline-block; vertical-align: middle; font-size: 28px; color: #e8dccd; }
#infobar-actions { position: absolute; right: 0; top: 12px; }
#main.wall #hero, #main.wall #backdrop { display: none; }
#main.wall #shade { background: #120e0b; }
#main.wall #infobar { display: block; }
#main.wall #count { display: none; }
#main.wall #list { top: 128px; height: 820px; }
#main.wall .shelf { white-space: normal; height: auto; overflow: visible; padding-top: 8px; }
#main.wall .poster { width: 190px; margin: 0 24px 26px 0; }
#main.wall .poster .frame { width: 190px; height: 285px; }
#main.wall .poster .cap { display: none; }
#main.wall #message { top: 200px; }
#filter { background: rgba(18, 14, 11, 0.97); }
#filter h2 { margin: 40px 80px 10px; font-size: 40px; }
#filter-hint { margin: 0 80px; color: #a89c8e; font-size: 28px; }
.tags { margin: 0 70px; }
#keywords { height: 520px; overflow: hidden; }
.tag { display: inline-block; margin: 10px; padding: 12px 26px; font-size: 30px; background: #2a221c; border: 4px solid #2a221c; border-radius: 30px; }
.tag.on { background: #c8321e; border-color: #c8321e; }
.tag.focus { border-color: #fff; }
#player { background: #000; }
#video { width: 1920px; height: 1080px; }
#status { position: absolute; left: 0; top: 480px; width: 1920px; text-align: center; font-size: 44px; color: #ddd; }
#message { position: absolute; left: 80px; top: 680px; font-size: 34px; color: #cfc3b5; }
</style>
</head>
<body>
<div id="main" class="layer">
  <div id="backdrop"></div>
  <div id="shade"></div>
  <header>
    <span class="logo serif">Reel<span>Radar</span></span>
    <div id="views"></div>
    <span class="btn" id="open-filter">Filter</span>
    <span class="btn" id="clear-filter">Clear filter</span>
    <span id="layout"><span class="btn focusable" id="layout-wall"><span class="ico wall"></span></span><span class="btn focusable" id="layout-rows"><span class="ico rows"></span></span></span>
  </header>
  <div id="count"></div>
  <div id="hero">
    <div id="kicker"></div>
    <div id="hero-title" class="serif"></div>
    <div id="hero-date"></div>
    <div id="hero-text"></div>
    <div id="hero-actions"></div>
  </div>
  <div id="infobar"><span class="mark"></span><span class="name serif" id="info-name"></span><span class="sep"></span><span class="info" id="info-date"></span><span class="sep"></span><span class="info" id="info-where"></span><div id="infobar-actions"></div></div>
  <div id="message">Loading titles...</div>
  <div id="list"></div>
</div>
<div id="filter" class="layer hidden">
  <h2>Genres</h2>
  <div class="tags" id="genres"></div>
  <h2>Keywords</h2>
  <div id="filter-hint">OK toggles · Back closes · shows titles matching ANY choice</div>
  <div class="tags" id="keywords"></div>
</div>
<div id="player" class="layer hidden">
  <video id="video"></video>
  <div id="status"></div>
</div>
<script>
// ES5 only. API on rei3 (LAN, behind Caddy).
var API = 'http://192.168.42.57:8095';
var KEYS = { LEFT: 37, UP: 38, RIGHT: 39, DOWN: 40, ENTER: 13, BACK: 10009, ESC: 27, BACKSPACE: 8,
  PLAY: 415, PAUSE: 19, PLAY_PAUSE: 10252, STOP: 413, FF: 417, RW: 412 };
var FILTER_KEY = 'reelradar.filter';
// ---- views (same logic in frontend/index.html and tv-app/index.html) ----
var VIEWS = [['upcoming', 'Release calendar'], ['trailers', 'New trailers'], ['recent', 'Recently released'], ['genres', 'Genres'], ['all', 'All titles']];
var KINDS = [['all', 'All releases'], ['cinema', 'Cinema'], ['streaming', 'Streaming']];
var WINDOW_DAYS = 90; // "recently released" looks three months back
var AHEAD_DAYS = 183; // "upcoming" looks six months ahead, matching the import

function isoDay(offsetDays) {
  var d = new Date(Date.now() + offsetDays * 86400000);
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
}

// A title's German releases as entries; kind filter applies. Cinema = theatrical, streaming = digital.
function releases(title, kind) {
  var list = [];
  if (title.de_theatrical && kind !== 'streaming') list.push({ title: title, kind: 'cinema', date: title.de_theatrical });
  if (title.de_digital && kind !== 'cinema') list.push({ title: title, kind: 'streaming', date: title.de_digital });
  return list;
}

// -> [{heading, note, items:[{title, kind, date}]}]; calendar views list each release on its day.
function viewSections(view, titles, kind) {
  var today = isoDay(0);
  if (view === 'upcoming' || view === 'recent') {
    var from = view === 'upcoming' ? today : isoDay(-WINDOW_DAYS);
    var to = view === 'upcoming' ? isoDay(AHEAD_DAYS + 1) : today;
    var entries = [];
    titles.forEach(function (title) {
      releases(title, kind).forEach(function (entry) { if (entry.date >= from && entry.date < to) entries.push(entry); });
    });
    entries.sort(function (a, b) {
      var order = a.date < b.date ? -1 : a.date > b.date ? 1 : 0;
      return view === 'upcoming' ? order : -order;
    });
    var days = [];
    entries.forEach(function (entry) {
      var last = days[days.length - 1];
      if (!last || last.date !== entry.date) { last = { date: entry.date, heading: longDate(entry.date), items: [] }; days.push(last); }
      last.items.push(entry);
    });
    days.forEach(function (day) { day.note = day.items.length + (day.items.length === 1 ? ' release' : ' releases'); });
    return days;
  }
  var kept = titles.filter(function (title) { return kind === 'all' || releases(title, kind).length; });
  function asItem(title) { return { title: title, kind: null, date: null }; }
  if (view === 'trailers') {
    var withTrailer = kept.filter(function (title) { return title.trailer; });
    withTrailer.sort(function (a, b) { return (b.trailer.published_at || '') > (a.trailer.published_at || '') ? 1 : -1; });
    return [{ heading: '', items: withTrailer.map(asItem) }];
  }
  if (view === 'genres') {
    var byName = {}, names = [];
    kept.forEach(function (title) {
      (title.genres || []).forEach(function (genre) {
        if (!byName[genre.name]) { byName[genre.name] = []; names.push(genre.name); }
        byName[genre.name].push(title);
      });
    });
    return names.sort().map(function (name) {
      return { heading: name, note: byName[name].length + ' titles', items: byName[name].map(asItem) };
    });
  }
  return [{ heading: '', items: kept.map(asItem) }];
}

var DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
function longDate(iso) {
  var d = new Date(iso + 'T12:00:00');
  return DAYS[d.getDay()] + ', ' + d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear();
}
function shortDate(iso) {
  var d = new Date(iso + 'T12:00:00');
  return d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear();
}

var currentView = 'upcoming';
var LAYOUT_KEY = 'reelradar.layout';
var wall = false; // poster wall layout instead of hero + rows
try { wall = window.localStorage.getItem(LAYOUT_KEY) === 'wall'; } catch (error) {}
var allTitles = [];
var seerrStatus = {}; // tmdb_id -> none|requested|partial|available
var SEERR_LABELS = { requested: 'Requested in Seerr', partial: 'Partly in the library', available: 'In the library' };
var selection = loadSelection();
var layer = 'main';           // main | filter | player
var focused = { main: null, filter: null };
var playToken = 0;

function $(id) { return document.getElementById(id); }
function el(tag, className, text) {
  var e = document.createElement(tag);
  if (className) e.className = className;
  if (text !== undefined) e.textContent = text;
  return e;
}

function loadSelection() {
  try {
    var value = JSON.parse(window.localStorage.getItem(FILTER_KEY));
    if (value && value.v === 1 && value.genres instanceof Array && value.keywords instanceof Array) return value;
  } catch (error) {}
  return { v: 1, genres: [], keywords: [] };
}
function saveSelection() {
  try { window.localStorage.setItem(FILTER_KEY, JSON.stringify(selection)); } catch (error) {}
}
function hasAny(tags, ids) {
  for (var i = 0; i < tags.length; i += 1) if (ids.indexOf(tags[i].id) !== -1) return true;
  return false;
}
// Same rule as the web page: ANY selected genre or keyword; nothing selected shows everything.
function matchesFilter(title) {
  if (!selection.genres.length && !selection.keywords.length) return true;
  return hasAny(title.genres || [], selection.genres) || hasAny(title.keywords || [], selection.keywords);
}
function collectTags(kind) {
  var byId = {}, list = [];
  allTitles.forEach(function (title) {
    (title[kind] || []).forEach(function (tag) {
      if (!byId[tag.id]) { byId[tag.id] = { id: tag.id, name: tag.name, count: 0 }; list.push(byId[tag.id]); }
      byId[tag.id].count += 1;
    });
  });
  return list;
}

// ---- focus: spatial navigation over the .focusable elements of the current layer ----
function focusables() {
  return Array.prototype.slice.call($(layer).querySelectorAll('.focusable'));
}
function removeClass(e, name) {
  e.className = e.className.replace(new RegExp('(^| )' + name + '(?= |$)', 'g'), '');
}
function setFocus(target) {
  var old = $(layer).querySelector('.focus');
  if (old) removeClass(old, 'focus');
  if (!target) return;
  target.className += ' focus';
  focused[layer] = target;
  if (target.item) { focused.poster = target; if (target.item !== heroItem) showHero(target.item); }
  ensureVisible(target);
}
function ensureVisible(target) {
  for (var box = target.parentNode; box && box !== document.body; box = box.parentNode) {
    var t = target.getBoundingClientRect(), b = box.getBoundingClientRect();
    if (box.scrollHeight > box.clientHeight) {
      if (t.top < b.top) box.scrollTop -= b.top - t.top + 20;
      else if (t.bottom > b.bottom) box.scrollTop += t.bottom - b.bottom + 20;
    }
    if (box.scrollWidth > box.clientWidth) {
      if (t.left < b.left) box.scrollLeft -= b.left - t.left + 20;
      else if (t.right > b.right) box.scrollLeft += t.right - b.right + 20;
    }
  }
}
function move(dx, dy) {
  var current = $(layer).querySelector('.focus');
  var items = focusables();
  if (!current) { setFocus(items[0]); return; }
  // Down from the hero buttons returns to the poster the hero shows.
  if (dy === 1 && current.parentNode === $('hero-actions') && focused.poster) { setFocus(focused.poster); return; }
  if (dy === -1 && current.parentNode === $('infobar-actions') && focused.poster) { setFocus(focused.poster); return; }
  // Rows layout: Up from a poster goes to the hero's first button (Play trailer).
  var firstAction = $('hero-actions').querySelector('.focusable');
  if (!wall && dy === -1 && current.item && firstAction) { setFocus(firstAction); return; }
  var a = current.getBoundingClientRect();
  var ax = a.left + a.width / 2, ay = a.top + a.height / 2;
  var best = null, bestScore = Infinity;
  items.forEach(function (item) {
    if (item === current) return;
    var b = item.getBoundingClientRect();
    var bx = b.left + b.width / 2, by = b.top + b.height / 2;
    var along = dx ? (bx - ax) * dx : (by - ay) * dy;
    var across = dx ? Math.abs(by - ay) : Math.abs(bx - ax);
    // must lie in the pressed direction; on the same line for left/right
    if (along <= 1) return;
    if (dx && across > a.height / 2 + b.height / 2) return;
    var score = along + across * 3;
    if (score < bestScore) { bestScore = score; best = item; }
  });
  if (best) setFocus(best);
}

// ---- main: hero for the focused title, poster rows below ----
var IMG = 'https://image.tmdb.org/t/p/';
var heroItem = null;
var KICKER = { upcoming: 'Upcoming', trailers: 'New trailer', recent: 'Just released', genres: 'Genre', all: 'ReelRadar' };
var ROW_TITLE = { upcoming: 'Coming soon in Germany', trailers: 'Newest trailers', recent: 'Recently released in Germany', all: 'All titles' };

// The release an item stands for: its calendar entry, or the title's next (else latest) German date.
function itemRelease(item) {
  if (item.kind) return item;
  var all = releases(item.title, 'all').sort(function (a, b) { return a.date < b.date ? -1 : 1; });
  var today = isoDay(0);
  return all.filter(function (entry) { return entry.date >= today; })[0] || all[all.length - 1] || null;
}
function whereText(title, kind) {
  if (kind === 'cinema') return 'Cinema';
  return title.providers && title.providers.length ? title.providers.map(function (p) { return p.name; }).join(', ') : 'Streaming';
}

function renderList() {
  var list = $('list');
  var shown = allTitles.filter(matchesFilter);
  var active = selection.genres.length + selection.keywords.length;
  var sections = viewSections(currentView, shown, 'all');
  var count = 0;
  sections.forEach(function (section) { count += section.items.length; });
  if (currentView === 'genres') count = shown.length;
  list.textContent = '';
  list.scrollTop = 0;
  $('count').textContent = count + ' of ' + allTitles.length + ' titles' + (active ? ' · ' + active + ' filter' + (active > 1 ? 's' : '') + ' on' : '');
  $('message').textContent = count ? '' : (allTitles.length ? 'No titles in this view match the filter.' : 'No titles imported yet.');
  // Calendar views come back per day; on the TV they are one row in date order.
  var rows = currentView === 'genres' ? sections :
    [{ heading: ROW_TITLE[currentView], items: [].concat.apply([], sections.map(function (s) { return s.items; })) }];
  rows.forEach(function (row) {
    if (!row.items.length) return;
    list.appendChild(el('h3', 'shelf-title serif', row.heading));
    var shelf = el('div', 'shelf');
    row.items.forEach(function (item) { shelf.appendChild(posterCard(item)); });
    list.appendChild(shelf);
  });
  var first = list.querySelector('.focusable');
  showHero(first ? first.item : null);
  setFocus(first || $('open-filter'));
}

function posterCard(item) {
  var title = item.title;
  var card = el('div', 'poster focusable');
  var frame = el('div', 'frame');
  if (title.poster_path) frame.style.backgroundImage = 'url(' + IMG + 'w342' + title.poster_path + ')';
  else frame.appendChild(el('div', 'fallback serif', title.title));
  card.appendChild(frame);
  var release = itemRelease(item);
  if (release) frame.appendChild(el('div', 'badge ' + release.kind, release.kind === 'cinema' ? 'Cinema' :
    (title.providers && title.providers.length ? title.providers[0].name : 'Streaming')));
  card.appendChild(el('div', 'cap', release ? shortDate(release.date).replace(/ \d{4}$/, '') + ' · ' + (release.kind === 'cinema' ? 'Cinema' : 'Streaming') : (title.trailer ? '' : 'No trailer')));
  card.setAttribute('data-id', title.tmdb_id);
  card.item = item;
  card.onactivate = function () { if (title.trailer) play(title); };
  return card;
}

// Hero follows the focused poster: backdrop, title, date, synopsis, Play / Request.
function showHero(item) {
  heroItem = item;
  $('hero-actions').textContent = '';
  $('infobar-actions').textContent = '';
  var actions = wall ? $('infobar-actions') : $('hero-actions');
  if (!item) {
    $('kicker').textContent = ''; $('hero-title').textContent = ''; $('hero-date').textContent = ''; $('hero-text').textContent = '';
    $('backdrop').style.backgroundImage = 'none';
    $('info-name').textContent = ''; $('info-date').textContent = ''; $('info-where').textContent = '';
    return;
  }
  var title = item.title;
  var release = itemRelease(item);
  var kicker = KICKER[currentView];
  if (currentView === 'genres' && title.genres && title.genres.length) kicker = title.genres.map(function (g) { return g.name; }).slice(0, 2).join(' · ');
  if (release) kicker += ' · ' + (release.kind === 'cinema' ? 'Cinema' : 'Streaming');
  $('kicker').textContent = kicker;
  $('hero-title').textContent = title.title;
  $('hero-date').textContent = release ? longDate(release.date) + '  ·  ' + whereText(title, release.kind) : 'No German release date';
  $('hero-text').textContent = title.overview || '';
  $('backdrop').style.backgroundImage = !wall && title.backdrop_path ? 'url(' + IMG + 'w1280' + title.backdrop_path + ')' : 'none';
  $('info-name').textContent = title.title;
  $('info-date').textContent = release ? longDate(release.date) : 'No German date';
  $('info-where').textContent = release ? whereText(title, release.kind) : '';

  if (wall) {
    // OK on a poster plays; the info bar only offers the request.
  } else if (title.trailer) {
    var playButton = el('span', 'action solid focusable', '\u25B6  Play trailer');
    playButton.onactivate = function () { play(title); };
    actions.appendChild(playButton);
  } else {
    actions.appendChild(el('span', 'action-note', 'No trailer'));
  }
  if (wall && !title.trailer) actions.appendChild(el('span', 'action-note', 'No trailer  '));
  var status = seerrStatus[title.tmdb_id];
  if (SEERR_LABELS[status]) actions.appendChild(el('span', 'action-note', SEERR_LABELS[status]));
  else actions.appendChild(requestButton(title));
}

function renderViews() {
  var nav = $('views');
  nav.textContent = '';
  VIEWS.forEach(function (view) {
    var button = el('span', 'btn focusable' + (view[0] === currentView ? ' on' : ''), view[1]);
    button.onactivate = function () {
      currentView = view[0];
      renderViews();
      renderList();
      setFocus($('views').querySelector('.on'));
    };
    nav.appendChild(button);
  });
}
// OK sends the hero title's request to Seerr through the backend.
function requestButton(title) {
  var button = el('span', 'action focusable', 'Request via Seerr');
  button.onactivate = function () {
    if (button.busy) return;
    button.busy = true;
    button.textContent = 'Requesting...';
    sendJson('POST', API + '/api/request/' + title.tmdb_id, function (error, result) {
      button.busy = false;
      if (error) { button.textContent = 'Failed - OK retries'; return; }
      seerrStatus[title.tmdb_id] = result.status;
      if (heroItem && heroItem.title === title) {
        showHero(heroItem);
        setFocus((wall ? $('infobar-actions') : $('hero-actions')).querySelector('.focusable') || focused.poster);
      }
    });
  };
  return button;
}

function renderLayout() {
  $('main').className = 'layer' + (wall ? ' wall' : '') + (layer === 'main' ? '' : ' hidden');
  removeClass($('layout-wall'), 'on');
  removeClass($('layout-rows'), 'on');
  $(wall ? 'layout-wall' : 'layout-rows').className += ' on';
}
[['layout-wall', true], ['layout-rows', false]].forEach(function (option) {
  $(option[0]).onactivate = function () {
    if (wall === option[1]) return;
    wall = option[1];
    try { window.localStorage.setItem(LAYOUT_KEY, wall ? 'wall' : 'rows'); } catch (error) {}
    renderLayout();
    renderList();
    setFocus($(option[0]));
  };
});
renderLayout();
renderViews();
$('open-filter').className += ' focusable';
$('open-filter').onactivate = openFilter;
$('clear-filter').className += ' focusable';
$('clear-filter').onactivate = function () {
  selection = { v: 1, genres: [], keywords: [] };
  saveSelection();
  renderList();
};

// ---- filter panel ----
function tagButton(kind, tag) {
  var ids = selection[kind];
  var button = el('span', 'tag focusable' + (ids.indexOf(tag.id) !== -1 ? ' on' : ''),
    tag.name + (kind === 'keywords' ? ' (' + tag.count + ')' : ''));
  button.onactivate = function () {
    var index = ids.indexOf(tag.id);
    if (index === -1) ids.push(tag.id); else ids.splice(index, 1);
    if (index === -1) button.className = button.className.replace('tag', 'tag on');
    else removeClass(button, 'on');
    saveSelection();
  };
  return button;
}
function byName(a, b) { return a.name < b.name ? -1 : a.name > b.name ? 1 : 0; }
function openFilter() {
  var genres = $('genres'), keywords = $('keywords');
  genres.textContent = '';
  keywords.textContent = '';
  collectTags('genres').sort(byName).forEach(function (tag) { genres.appendChild(tagButton('genres', tag)); });
  // shortcut: top 60 keywords by count, no text search (typing with the remote is painful); add paging if users miss some.
  collectTags('keywords').sort(function (a, b) { return b.count - a.count || byName(a, b); }).slice(0, 60)
    .forEach(function (tag) { keywords.appendChild(tagButton('keywords', tag)); });
  keywords.scrollTop = 0;
  showLayer('filter');
  setFocus(genres.querySelector('.focusable') || keywords.querySelector('.focusable'));
}
function closeFilter() {
  showLayer('main');
  renderList();
}

// ---- player: fullscreen <video> on the backend's cached MP4 ----
function play(title) {
  var token = ++playToken;
  var video = $('video');
  showLayer('player');
  $('status').textContent = 'Loading trailer: ' + title.title;
  getJson(API + '/api/stream/' + title.tmdb_id, function (error, stream) {
    if (token !== playToken) return;
    if (error) { $('status').textContent = 'Trailer unavailable (' + error + '). Back returns.'; return; }
    video.src = API + stream.url;
    video.play();
  });
}
function closePlayer() {
  var video = $('video');
  playToken += 1;
  video.pause();
  video.removeAttribute('src');
  video.load();
  showLayer('main');
  setFocus(focused.main);
}
$('video').addEventListener('playing', function () { $('status').textContent = ''; });
$('video').addEventListener('ended', closePlayer);
$('video').addEventListener('error', function () {
  if ($('video').getAttribute('src')) $('status').textContent = 'Playback failed. Back returns.';
});
function playerKey(code) {
  var video = $('video');
  if (code === KEYS.ENTER || code === KEYS.PLAY_PAUSE || code === KEYS.PLAY || code === KEYS.PAUSE) {
    if (video.paused) video.play(); else video.pause();
    $('status').textContent = video.paused ? 'Paused' : '';
  } else if (code === KEYS.RIGHT || code === KEYS.FF) {
    video.currentTime = Math.min(video.duration || 0, video.currentTime + 10);
  } else if (code === KEYS.LEFT || code === KEYS.RW) {
    video.currentTime = Math.max(0, video.currentTime - 10);
  } else if (code === KEYS.STOP) {
    closePlayer();
  }
}

function showLayer(name) {
  ['main', 'filter', 'player'].forEach(function (id) {
    $(id).className = 'layer' + (id === 'main' && wall ? ' wall' : '') + (id === name ? '' : ' hidden');
  });
  layer = name;
}

function exitApp() {
  try { tizen.application.getCurrentApplication().exit(); } catch (error) {}
}

document.addEventListener('keydown', function (event) {
  var code = event.keyCode;
  var back = code === KEYS.BACK || code === KEYS.ESC || code === KEYS.BACKSPACE;
  if (back) {
    event.preventDefault();
    if (layer === 'player') closePlayer();
    else if (layer === 'filter') closeFilter();
    else exitApp();
    return;
  }
  if (layer === 'player') { playerKey(code); event.preventDefault(); return; }
  if (code === KEYS.LEFT) move(-1, 0);
  else if (code === KEYS.RIGHT) move(1, 0);
  else if (code === KEYS.UP) move(0, -1);
  else if (code === KEYS.DOWN) move(0, 1);
  else if (code === KEYS.ENTER) {
    var current = $(layer).querySelector('.focus');
    if (current && current.onactivate) current.onactivate();
  } else return;
  event.preventDefault();
});

// Media keys are only delivered after registration; arrows/OK/Back need none.
try {
  ['MediaPlay', 'MediaPause', 'MediaPlayPause', 'MediaStop', 'MediaFastForward', 'MediaRewind'].forEach(function (name) {
    tizen.tvinputdevice.registerKey(name);
  });
} catch (error) {}

function getJson(url, callback) { sendJson('GET', url, callback); }
function sendJson(method, url, callback) {
  var request = new XMLHttpRequest();
  request.open(method, url);
  request.timeout = 5 * 60 * 1000; // first play of a title may wait for the download
  request.onload = function () {
    var body;
    try { body = JSON.parse(request.responseText); } catch (error) { return callback('bad response'); }
    if (request.status < 200 || request.status >= 300) return callback(body.error || 'HTTP ' + request.status);
    callback(null, body);
  };
  request.onerror = function () { callback('backend unreachable'); };
  request.ontimeout = function () { callback('timeout'); };
  request.send();
}

getJson(API + '/api/titles', function (error, titles) {
  if (error) { $('message').textContent = 'Could not load titles: ' + error; setFocus($('open-filter')); return; }
  allTitles = titles;
  renderList();
  // Seerr state comes second; without it the request button is still offered.
  getJson(API + '/api/seerr', function (seerrError, statuses) {
    if (seerrError || layer !== 'main') return;
    seerrStatus = statuses;
    var id = focused.main && focused.main.getAttribute('data-id');
    renderList();
    if (id) setFocus($('list').querySelector('[data-id="' + id + '"]') || focused.main);
  });
});
</script>
