server {
  listen 80;
  root /usr/share/nginx/html;
  # The Tizen app is a packaged page (file origin), so it calls the API cross-origin.
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $http_host;
    add_header Access-Control-Allow-Origin * always;
  }
  # Cached trailer MP4s (LAN only, behind Caddy on rei3); nginx handles Range requests.
  location /media/ {
    alias /srv/data/media/;
    add_header Access-Control-Allow-Origin *;
  }
}
