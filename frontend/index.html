<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ReelRadar</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
<style>
:root {
  --paper: #f6f0e6; --card: #fffaf2; --ink: #1d1712; --muted: #6f655b; --line: #e3d8c8;
  --red: #c8321e; --red-dark: #a2240f; --chip: #fffdf8;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --sans: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--sans); margin: 0; }
a { color: var(--red-dark); }
button, select, input { font: inherit; color: inherit; }
.wrap { margin: 0 auto; max-width: 1180px; padding: 0 24px; }

header.top { background: var(--paper); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
header.top .wrap { align-items: center; display: flex; gap: 28px; min-height: 64px; }
.logo { font-family: var(--serif); font-size: 28px; font-weight: 700; letter-spacing: -0.5px; white-space: nowrap; }
.logo span { color: var(--red); }
#views { display: flex; gap: 22px; overflow-x: auto; scrollbar-width: none; }
#views button { background: none; border: 0; border-bottom: 2px solid transparent; cursor: pointer; font-size: 14px; padding: 20px 0 18px; white-space: nowrap; }
#views button[aria-pressed="true"] { border-color: var(--red); font-weight: 600; }

.hero { background: linear-gradient(90deg, var(--paper) 30%, rgba(246,240,230,0.75) 55%, rgba(200,50,30,0.55)), var(--red) center / cover no-repeat; border-bottom: 1px solid var(--line); }
.hero .wrap { padding-bottom: 36px; padding-top: 40px; }
.kicker { color: var(--red); font-size: 12px; font-weight: 700; letter-spacing: 3px; margin: 0 0 6px; text-transform: uppercase; }
.hero h1 { font-family: var(--serif); font-size: clamp(34px, 5vw, 54px); font-weight: 700; letter-spacing: -1px; line-height: 1.05; margin: 0 0 10px; }
.hero p.lead { color: var(--muted); margin: 0; max-width: 34em; }

.bar { align-items: center; display: flex; flex-wrap: wrap; gap: 10px; padding: 20px 0 8px; }
.chip { background: var(--chip); border: 1px solid var(--line); border-radius: 999px; cursor: pointer; font-size: 13px; font-weight: 600; padding: 7px 14px; }
.chip[aria-pressed="true"] { background: var(--red); border-color: var(--red); color: #fff; }
select.chip { appearance: none; -webkit-appearance: none; padding-right: 28px; background-image: linear-gradient(45deg, transparent 50%, var(--ink) 50%), linear-gradient(135deg, var(--ink) 50%, transparent 50%); background-position: calc(100% - 15px) 50%, calc(100% - 10px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }
#count { color: var(--muted); font-size: 13px; margin-left: auto; }

#filter { background: var(--card); border: 1px solid var(--line); border-radius: 12px; margin: 8px 0; padding: 4px 18px 16px; }
#filter h2 { font-family: var(--serif); font-size: 18px; margin: 14px 0 8px; }
#filter .chip { margin: 0 6px 6px 0; }
#keyword-search { background: var(--chip); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; max-width: 100%; padding: 8px 10px; width: 22em; }

.day { align-items: baseline; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; margin: 28px 0 14px; padding-bottom: 6px; }
.day h2 { font-family: var(--serif); font-size: 24px; margin: 0; }
.day small { color: var(--muted); font-size: 12px; }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; display: flex; gap: 14px; padding: 12px; }
.poster { align-self: flex-start; aspect-ratio: 2 / 3; background: #2a221c; border-radius: 8px; flex: 0 0 104px; object-fit: cover; width: 104px; }
.card .body { display: flex; flex: 1; flex-direction: column; min-width: 0; }
.card h3 { font-family: var(--serif); font-size: 18px; line-height: 1.15; margin: 2px 0 3px; }
.meta { color: var(--muted); font-size: 12px; margin: 0 0 6px; }
.release { font-size: 12px; font-weight: 600; margin: 0 0 4px; }
.release .kind { color: var(--red); }
.overview { color: var(--muted); display: -webkit-box; font-size: 13px; line-height: 1.4; margin: 2px 0 8px; overflow: hidden; -webkit-box-orient: vertical; -webkit-line-clamp: 3; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; }
.btn { background: var(--chip); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; padding: 7px 12px; }
.btn.primary { background: var(--red); border-color: var(--red); color: #fff; }
.btn.primary:hover { background: var(--red-dark); }
.btn:disabled { cursor: default; opacity: 0.6; }
.status { color: #3c6e2f; font-size: 12px; font-weight: 600; padding: 7px 0; }
details.check { color: var(--muted); font-size: 11px; margin-top: 8px; }
details.check summary { cursor: pointer; }
details.check div { margin: 3px 0; overflow-wrap: anywhere; }
.empty { color: var(--muted); padding: 40px 0; }

/* poster wall layout */
.layout { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.layout button { background: var(--chip); border: 0; cursor: pointer; font-size: 15px; line-height: 1; padding: 8px 11px; }
.layout button[aria-pressed="true"] { background: var(--red); color: #fff; }
.wall { display: grid; gap: 16px 12px; grid-template-columns: repeat(auto-fill, minmax(122px, 1fr)); }
.tile { background: none; border: 0; cursor: pointer; padding: 0; position: relative; text-align: center; }
.tile .art { aspect-ratio: 2 / 3; background: #2a221c center / cover no-repeat; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.18); color: #f4ede3; font-family: var(--serif); font-size: 15px; overflow: hidden; position: relative; }
.tile .art .name { left: 8px; position: absolute; right: 8px; top: 40%; }
.tile:hover .art, .tile:focus-visible .art { box-shadow: 0 0 0 3px var(--red), 0 6px 18px rgba(200,50,30,0.35); }
.tile:focus { outline: none; }
.badge { background: rgba(20,15,12,0.88); border-radius: 4px; color: #fff; font-family: var(--sans); font-size: 10px; font-weight: 800; left: 50%; letter-spacing: 1px; max-width: 88%; overflow: hidden; padding: 3px 7px; position: absolute; text-overflow: ellipsis; text-transform: uppercase; top: 7px; transform: translateX(-50%); white-space: nowrap; }
.badge.streaming { background: var(--red); }
.tile .date { color: var(--muted); display: block; font-size: 12px; margin-top: 6px; }
.tip { background: var(--ink); border-radius: 8px; box-shadow: 0 6px 18px rgba(0,0,0,0.3); color: #fff; display: none; font-size: 12px; left: 50%; padding: 8px 10px; position: absolute; text-align: left; top: 72%; transform: translateX(-50%); width: 170px; z-index: 3; }
.tip strong { display: block; font-size: 13px; margin-bottom: 2px; }
@media (hover: hover) { .tile:hover .tip { display: block; } }
body.wall-mode .hero .wrap { padding-bottom: 18px; padding-top: 22px; }
body.wall-mode .hero h1 { font-size: clamp(28px, 4vw, 40px); font-style: italic; margin-bottom: 0; }
body.wall-mode .hero p.lead { display: none; }
#detail { align-items: center; background: rgba(10, 8, 6, 0.6); display: flex; inset: 0; justify-content: center; padding: 16px; position: fixed; z-index: 9; }
#detail[hidden] { display: none; }
#detail .card { box-shadow: 0 12px 40px rgba(0,0,0,0.35); max-width: 560px; position: relative; width: 100%; }
#detail .card .poster { flex-basis: 150px; width: 150px; }
#detail .overview { -webkit-line-clamp: 8; }
#detail .x { position: absolute; right: 10px; top: 8px; }
#detail .card h3 { padding-right: 44px; }

#player { align-items: center; background: rgba(10, 8, 6, 0.9); display: flex; inset: 0; justify-content: center; padding: 24px; position: fixed; z-index: 10; }
#player[hidden] { display: none; }
#player video { background: #000; max-height: 85vh; max-width: 100%; width: 1100px; }
#player .close { position: absolute; right: 20px; top: 16px; }
#player p { color: #fff; }

footer { border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; margin-top: 48px; padding: 20px 0 32px; }

@media (max-width: 720px) {
  .wrap { padding: 0 16px; }
  header.top .wrap { flex-direction: column; align-items: flex-start; gap: 0; padding-top: 10px; }
  #views { max-width: 100%; }
  #views button { padding: 12px 0 10px; }
  .hero .wrap { padding: 24px 16px; }
  .grid { grid-template-columns: 1fr; }
  .poster { flex-basis: 88px; width: 88px; }
  .wall { gap: 12px 8px; grid-template-columns: repeat(3, 1fr); }
  #detail .card .poster { flex-basis: 96px; width: 96px; }
  #count { margin-left: 0; width: 100%; }
}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="logo">Reel<span>Radar</span></div>
  <nav id="views" aria-label="Views"></nav>
</div></header>

<section class="hero" id="hero"><div class="wrap">
  <p class="kicker" id="hero-kicker">Release calendar</p>
  <h1 id="hero-title">What's coming next</h1>
  <p class="lead" id="hero-lead">Cinema and streaming releases in Germany for the next six months.</p>
</div></section>

<main class="wrap">
  <div class="bar">
    <span id="kinds"></span>
    <select class="chip" id="service" aria-label="Streaming service"></select>
    <button type="button" class="chip" id="filter-toggle" aria-pressed="false">Genres &amp; keywords</button>
    <button type="button" class="chip" id="filter-clear">Clear filter</button>
    <span class="layout" id="layout" role="group" aria-label="Layout"></span>
    <span id="count"></span>
  </div>
  <section id="filter" hidden>
    <h2>Genres</h2>
    <div id="genres"></div>
    <h2>Keywords</h2>
    <input type="search" id="keyword-search" placeholder="Search keywords" aria-label="Search keywords">
    <div id="keywords"></div>
  </section>
  <div id="titles"><p class="empty">Loading titles...</p></div>
</main>

<div id="detail" hidden role="dialog" aria-label="Title details"></div>

<div id="player" hidden role="dialog" aria-label="Trailer">
  <button type="button" class="btn close" id="player-close">Close</button>
  <video id="video" controls playsinline></video>
</div>

<footer><div class="wrap">This product uses the TMDB API but is not endorsed or certified by TMDB. Streaming availability from JustWatch via TMDB.</div></footer>
<script>
// ES5, like the TV app.
var IMG = 'https://image.tmdb.org/t/p/';
function text(tag, value, className) {
  var element = document.createElement(tag);
  element.textContent = value;
  if (className) element.className = className;
  return element;
}
function button(label, className, onclick) {
  var b = text('button', label, className);
  b.setAttribute('type', 'button');
  if (onclick) b.onclick = onclick;
  return b;
}

// ---- trailer: the cached MP4 from /api/stream, same as the TV app ----
var player = document.getElementById('player');
var video = document.getElementById('video');
function closePlayer() { video.pause(); video.removeAttribute('src'); video.load(); player.hidden = true; }
document.getElementById('player-close').onclick = closePlayer;
player.onclick = function (event) { if (event.target === player) closePlayer(); };
document.addEventListener('keydown', function (event) {
  if (event.key !== 'Escape') return;
  if (!player.hidden) closePlayer();
  else if (!detail.hidden) closeDetail();
});

function playTrailer(title, trigger) {
  trigger.disabled = true;
  trigger.textContent = 'Loading...';
  getJson('/api/stream/' + title.tmdb_id, function (error, stream) {
    trigger.disabled = false;
    trigger.textContent = 'Play trailer';
    if (error) { trigger.textContent = 'Trailer unavailable'; return; }
    video.src = stream.url;
    player.hidden = false;
    video.play();
  });
}

function getJson(url, callback, method) {
  var xhr = new XMLHttpRequest();
  xhr.open(method || 'GET', url);
  xhr.onload = function () {
    var value;
    try { value = JSON.parse(xhr.responseText); } catch (error) {}
    if (xhr.status !== 200 || value === undefined) callback(new Error('HTTP ' + xhr.status));
    else callback(null, value);
  };
  xhr.onerror = function () { callback(new Error('network')); };
  xhr.send();
}

// ---- filter state: {v:1, genres, keywords, kind, service} in localStorage (may be missing or throw) ----
var FILTER_KEY = 'reelradar.filter';
var allTitles = [];
var seerrStatus = {}; // tmdb_id -> none|requested|partial|available; a missing id is unknown and still offers the request
var SEERR_LABELS = { requested: 'Requested in Seerr', partial: 'Partly in the library', available: 'In the library' };
var selection = loadSelection();

function loadSelection() {
  var empty = { v: 1, genres: [], keywords: [], kind: 'all', service: 0 };
  try {
    var value = JSON.parse(window.localStorage.getItem(FILTER_KEY));
    if (value && value.v === 1 && value.genres instanceof Array && value.keywords instanceof Array) {
      value.kind = value.kind || 'all';
      value.service = value.service || 0;
      return value;
    }
  } catch (error) {}
  return empty;
}
function saveSelection() {
  try { window.localStorage.setItem(FILTER_KEY, JSON.stringify(selection)); } catch (error) {}
}

function hasAny(tags, ids) {
  for (var i = 0; i < tags.length; i += 1) if (ids.indexOf(tags[i].id) !== -1) return true;
  return false;
}

// Genres/keywords: ANY selected one matches; nothing selected shows everything. Service: must be on it.
function matchesFilter(title, chosen) {
  if (chosen.service && !hasAny(title.providers || [], [chosen.service])) return false;
  if (!chosen.genres.length && !chosen.keywords.length) return true;
  return hasAny(title.genres || [], chosen.genres) || hasAny(title.keywords || [], chosen.keywords);
}

// ---- views (same logic in frontend/index.html and tv-app/index.html) ----
var VIEWS = [['upcoming', 'Release calendar'], ['trailers', 'New trailers'], ['recent', 'Recently released'], ['genres', 'Genres'], ['all', 'All titles']];
var HERO = {
  upcoming: ['Release calendar', "What's coming next", 'Cinema and streaming releases in Germany for the next six months.'],
  trailers: ['Fresh from the projector', 'New trailers', 'The latest trailers, in the original language where one exists.'],
  recent: ['Just released', 'Recently released', 'What reached German cinemas and streaming in the last three months.'],
  genres: ['Browse', 'By genre', 'Every title, shelved by genre.'],
  all: ['Everything', 'All titles', 'Every title ReelRadar knows about.']
};
var KINDS = [['all', 'All releases'], ['cinema', 'Cinema'], ['streaming', 'Streaming']];
var WINDOW_DAYS = 90; // "recently released" looks three months back
var AHEAD_DAYS = 183; // "upcoming" looks six months ahead, matching the import

function isoDay(offsetDays) {
  var d = new Date(Date.now() + offsetDays * 86400000);
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
}

// A title's German releases as entries; kind filter applies. Cinema = theatrical, streaming = digital.
function releases(title, kind) {
  var list = [];
  if (title.de_theatrical && kind !== 'streaming') list.push({ title: title, kind: 'cinema', date: title.de_theatrical });
  if (title.de_digital && kind !== 'cinema') list.push({ title: title, kind: 'streaming', date: title.de_digital });
  return list;
}

// -> [{heading, note, items:[{title, kind, date}]}]; calendar views list each release on its day.
function viewSections(view, titles, kind) {
  var today = isoDay(0);
  if (view === 'upcoming' || view === 'recent') {
    var from = view === 'upcoming' ? today : isoDay(-WINDOW_DAYS);
    var to = view === 'upcoming' ? isoDay(AHEAD_DAYS + 1) : today;
    var entries = [];
    titles.forEach(function (title) {
      releases(title, kind).forEach(function (entry) { if (entry.date >= from && entry.date < to) entries.push(entry); });
    });
    entries.sort(function (a, b) {
      var order = a.date < b.date ? -1 : a.date > b.date ? 1 : 0;
      return view === 'upcoming' ? order : -order;
    });
    var days = [];
    entries.forEach(function (entry) {
      var last = days[days.length - 1];
      if (!last || last.date !== entry.date) { last = { date: entry.date, heading: longDate(entry.date), items: [] }; days.push(last); }
      last.items.push(entry);
    });
    days.forEach(function (day) { day.note = day.items.length + (day.items.length === 1 ? ' release' : ' releases'); });
    return days;
  }
  var kept = titles.filter(function (title) { return kind === 'all' || releases(title, kind).length; });
  function asItem(title) { return { title: title, kind: null, date: null }; }
  if (view === 'trailers') {
    var withTrailer = kept.filter(function (title) { return title.trailer; });
    withTrailer.sort(function (a, b) { return (b.trailer.published_at || '') > (a.trailer.published_at || '') ? 1 : -1; });
    return [{ heading: '', items: withTrailer.map(asItem) }];
  }
  if (view === 'genres') {
    var byName = {}, names = [];
    kept.forEach(function (title) {
      (title.genres || []).forEach(function (genre) {
        if (!byName[genre.name]) { byName[genre.name] = []; names.push(genre.name); }
        byName[genre.name].push(title);
      });
    });
    return names.sort().map(function (name) {
      return { heading: name, note: byName[name].length + ' titles', items: byName[name].map(asItem) };
    });
  }
  return [{ heading: '', items: kept.map(asItem) }];
}

var DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
function longDate(iso) {
  var d = new Date(iso + 'T12:00:00');
  return DAYS[d.getDay()] + ', ' + d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear();
}
function shortDate(iso) {
  var d = new Date(iso + 'T12:00:00');
  return d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear();
}

var currentView = 'upcoming';
var LAYOUT_KEY = 'reelradar.layout';
var layout = 'list';
try { layout = window.localStorage.getItem(LAYOUT_KEY) === 'wall' ? 'wall' : 'list'; } catch (error) {}

function renderLayout() {
  var root = document.getElementById('layout');
  root.textContent = '';
  document.body.className = layout === 'wall' ? 'wall-mode' : '';
  [['wall', '\u25A6', 'Poster wall'], ['list', '\u2630', 'List']].forEach(function (option) {
    var b = button(option[1], '', function () {
      layout = option[0];
      try { window.localStorage.setItem(LAYOUT_KEY, layout); } catch (error) {}
      renderLayout();
      renderTitles();
    });
    b.setAttribute('aria-pressed', layout === option[0] ? 'true' : 'false');
    b.setAttribute('aria-label', option[2]);
    b.title = option[2];
    root.appendChild(b);
  });
}

// ---- filter controls ----
function collectTags(kind) {
  var byId = {};
  var list = [];
  for (var i = 0; i < allTitles.length; i += 1) {
    var tags = allTitles[i][kind] || [];
    for (var j = 0; j < tags.length; j += 1) {
      if (!byId[tags[j].id]) {
        byId[tags[j].id] = { id: tags[j].id, name: tags[j].name, count: 0 };
        list.push(byId[tags[j].id]);
      }
      byId[tags[j].id].count += 1;
    }
  }
  return list;
}
function byName(a, b) { return a.name < b.name ? -1 : a.name > b.name ? 1 : 0; }

function toggleButton(kind, tag) {
  var ids = selection[kind];
  var b = button(tag.name + (kind === 'keywords' ? ' (' + tag.count + ')' : ''), 'chip');
  b.setAttribute('aria-pressed', ids.indexOf(tag.id) !== -1 ? 'true' : 'false');
  b.onclick = function () {
    var index = ids.indexOf(tag.id);
    if (index === -1) ids.push(tag.id); else ids.splice(index, 1);
    b.setAttribute('aria-pressed', index === -1 ? 'true' : 'false');
    saveSelection();
    renderTitles();
  };
  return b;
}

function renderGenres() {
  var root = document.getElementById('genres');
  var genres = collectTags('genres').sort(byName);
  root.textContent = '';
  for (var i = 0; i < genres.length; i += 1) root.appendChild(toggleButton('genres', genres[i]));
}

function renderKeywords() {
  var root = document.getElementById('keywords');
  var query = document.getElementById('keyword-search').value.toLowerCase();
  var keywords = collectTags('keywords').filter(function (tag) {
    return tag.name.toLowerCase().indexOf(query) !== -1;
  }).sort(function (a, b) { return b.count - a.count || byName(a, b); });
  root.textContent = '';
  for (var i = 0; i < keywords.length && i < 40; i += 1) root.appendChild(toggleButton('keywords', keywords[i]));
  if (keywords.length > 40) root.appendChild(text('p', (keywords.length - 40) + ' more: search to narrow down.', 'meta'));
}

function renderKinds() {
  var root = document.getElementById('kinds');
  root.textContent = '';
  KINDS.forEach(function (kind) {
    var b = button(kind[1], 'chip', function () { selection.kind = kind[0]; saveSelection(); renderKinds(); renderTitles(); });
    b.setAttribute('aria-pressed', selection.kind === kind[0] ? 'true' : 'false');
    b.style.marginRight = '8px';
    root.appendChild(b);
  });
}

// Items the current view lists for each service (0 = none) under the other filters, so a chip's number is what picking it shows.
function serviceCounts(view, chosen) {
  var counts = {};
  collectTags('providers').forEach(function (service) {
    var shown = allTitles.filter(function (title) {
      return matchesFilter(title, { genres: chosen.genres, keywords: chosen.keywords, service: service.id });
    });
    counts[service.id] = viewCount(view, viewSections(view, shown, chosen.kind));
  });
  return counts;
}

function renderServices() {
  var select = document.getElementById('service');
  var services = collectTags('providers').sort(byName);
  var counts = serviceCounts(currentView, selection);
  select.textContent = '';
  var all = text('option', 'All services');
  all.value = '0';
  select.appendChild(all);
  services.forEach(function (service) {
    var option = text('option', service.name + ' (' + counts[service.id] + ')');
    option.value = String(service.id);
    select.appendChild(option);
  });
  select.value = String(selection.service);
  if (allTitles.length && select.value !== String(selection.service)) { selection.service = 0; select.value = '0'; }
  select.setAttribute('aria-pressed', selection.service ? 'true' : 'false');
  select.onchange = function () {
    selection.service = Number(select.value);
    saveSelection();
    renderTitles();
  };
}

function renderViews() {
  var nav = document.getElementById('views');
  nav.textContent = '';
  VIEWS.forEach(function (view) {
    var b = button(view[1], '', function () { currentView = view[0]; renderViews(); renderTitles(); });
    b.setAttribute('aria-pressed', view[0] === currentView ? 'true' : 'false');
    nav.appendChild(b);
  });
  var hero = HERO[currentView];
  document.getElementById('hero-kicker').textContent = hero[0];
  document.getElementById('hero-title').textContent = hero[1];
  document.getElementById('hero-lead').textContent = hero[2];
}

document.getElementById('filter-toggle').onclick = function () {
  var panel = document.getElementById('filter');
  panel.hidden = !panel.hidden;
  this.setAttribute('aria-pressed', panel.hidden ? 'false' : 'true');
};
document.getElementById('filter-clear').onclick = function () {
  selection = { v: 1, genres: [], keywords: [], kind: 'all', service: 0 };
  saveSelection();
  renderGenres();
  renderKeywords();
  renderKinds();
  renderTitles();
};
document.getElementById('keyword-search').oninput = renderKeywords;

// ---- list ----
// Entries a calendar lists, titles otherwise; genre shelves repeat a title, so count it once.
function viewCount(view, sections) {
  var count = 0, seen = {};
  sections.forEach(function (section) {
    section.items.forEach(function (item) {
      if (view !== 'genres') count += 1;
      else if (!seen[item.title.tmdb_id]) { seen[item.title.tmdb_id] = true; count += 1; }
    });
  });
  return count;
}

// Why a view is empty. A service is only known once a title is available on it, so an upcoming premiere carries none yet.
function emptyMessage(view, chosen) {
  if (!allTitles.length) return 'No titles imported yet.';
  if (chosen.service && (view === 'upcoming' || view === 'recent')) {
    var service = collectTags('providers').filter(function (tag) { return tag.id === chosen.service; })[0];
    var name = service ? service.name : 'This service';
    var serviceOnly = { genres: [], keywords: [], service: chosen.service };
    var onService = allTitles.filter(function (title) { return matchesFilter(title, serviceOnly); });
    if (!viewCount(view, viewSections(view, onService, 'all'))) {
      return name + ' has no ' + (view === 'upcoming' ? 'upcoming' : 'recent') + ' releases in Germany. ' +
        (view === 'upcoming' ? 'TMDB lists a service only once a title is available on it, so a premiere shows up here after it starts streaming. ' : '') +
        onService.length + (onService.length === 1 ? ' title is' : ' titles are') + ' on ' + name + ' now: see All titles.';
    }
  }
  return 'No titles in this view match the filter.';
}

function renderTitles() {
  renderServices();
  var shown = allTitles.filter(function (title) { return matchesFilter(title, selection); });
  var sections = viewSections(currentView, shown, selection.kind);
  var count = viewCount(currentView, sections);
  var noun = currentView === 'upcoming' || currentView === 'recent' ? ' releases' : ' titles';
  document.getElementById('count').textContent = count + noun + ' of ' + allTitles.length + ' titles';
  setHeroImage(sections);
  render(sections);
}

// Backdrop of the first title in view behind the hero, washed into the paper colour.
function setHeroImage(sections) {
  var first = sections.length && sections[0].items.length ? sections[0].items[0].title : null;
  var hero = document.getElementById('hero');
  hero.style.backgroundImage = 'linear-gradient(90deg, #f6f0e6 30%, rgba(246,240,230,0.8) 52%, rgba(200,50,30,0.45))' +
    (first && first.backdrop_path ? ', url(' + IMG + 'w1280' + first.backdrop_path + ')' : '');
}

function render(sections) {
  var root = document.getElementById('titles');
  root.textContent = '';
  if (!sections.length || (sections.length === 1 && !sections[0].items.length)) {
    root.appendChild(text('p', emptyMessage(currentView, selection), 'empty'));
    return;
  }
  if (layout === 'wall') { renderWall(root, sections); return; }
  sections.forEach(function (section) {
    if (section.heading) {
      var day = document.createElement('div');
      day.className = 'day';
      day.appendChild(text('h2', section.heading));
      if (section.note) day.appendChild(text('small', section.note));
      root.appendChild(day);
    } else {
      root.appendChild(document.createElement('div')).style.height = '12px';
    }
    var grid = document.createElement('div');
    grid.className = 'grid';
    section.items.forEach(function (item) { grid.appendChild(card(item)); });
    root.appendChild(grid);
  });
}

// Poster wall: calendar views become one flat grid in date order; genre shelves keep their headings.
function renderWall(root, sections) {
  var flat = currentView !== 'genres';
  var groups = flat ? [{ heading: '', items: [].concat.apply([], sections.map(function (s) { return s.items; })) }] : sections;
  groups.forEach(function (group) {
    if (group.heading) {
      var head = document.createElement('div');
      head.className = 'day';
      head.appendChild(text('h2', group.heading));
      if (group.note) head.appendChild(text('small', group.note));
      root.appendChild(head);
    } else {
      root.appendChild(document.createElement('div')).style.height = '12px';
    }
    var wall = document.createElement('div');
    wall.className = 'wall';
    group.items.forEach(function (item) { wall.appendChild(tile(item)); });
    root.appendChild(wall);
  });
}

function badgeText(title, kind) {
  if (kind === 'cinema') return 'Cinema';
  return title.providers && title.providers.length ? title.providers[0].name : 'Streaming';
}

function tile(item) {
  var title = item.title;
  var release = itemRelease(item);
  var b = button('', 'tile', function () { openDetail(item); });
  b.setAttribute('aria-label', title.title + (release ? ', ' + badgeText(title, release.kind) + ', ' + shortDate(release.date) : ''));
  var art = document.createElement('span');
  art.className = 'art';
  art.style.display = 'block';
  if (title.poster_path) art.style.backgroundImage = 'url(' + IMG + 'w342' + title.poster_path + ')';
  else art.appendChild(text('span', title.title, 'name'));
  if (release) art.appendChild(text('span', badgeText(title, release.kind), 'badge ' + release.kind));
  b.appendChild(art);
  b.appendChild(text('span', release ? shortDate(release.date) : 'No German date', 'date'));
  var tip = document.createElement('span');
  tip.className = 'tip';
  tip.appendChild(text('strong', title.title));
  if (release) tip.appendChild(text('span', shortDate(release.date) + ' · ' + whereText(title, release.kind)));
  if (seerrStatus && SEERR_LABELS[seerrStatus[title.tmdb_id]]) {
    tip.appendChild(document.createElement('br'));
    tip.appendChild(text('span', SEERR_LABELS[seerrStatus[title.tmdb_id]]));
  }
  b.appendChild(tip);
  return b;
}

// Clicking a wall poster shows the full card (trailer, Seerr, synopsis) in a dialog.
var detail = document.getElementById('detail');
var detailReturn = null;
function openDetail(item) {
  detailReturn = document.activeElement;
  detail.textContent = '';
  var c = card(item);
  c.appendChild(button('\u2715', 'btn x', closeDetail)).setAttribute('aria-label', 'Close');
  detail.appendChild(c);
  detail.hidden = false;
  c.querySelector('.btn').focus();
}
function closeDetail() {
  detail.hidden = true;
  detail.textContent = '';
  if (detailReturn) detailReturn.focus();
}
detail.onclick = function (event) { if (event.target === detail) closeDetail(); };

// The release an item stands for: its calendar entry, or the title's next (else latest) German date.
function itemRelease(item) {
  if (item.kind) return item;
  var all = releases(item.title, 'all').sort(function (a, b) { return a.date < b.date ? -1 : 1; });
  var today = isoDay(0);
  return all.filter(function (entry) { return entry.date >= today; })[0] || all[all.length - 1] || null;
}
function whereText(title, kind) {
  if (kind === 'cinema') return 'Cinema';
  return title.providers && title.providers.length ? title.providers.map(function (p) { return p.name; }).join(', ') : 'Streaming';
}

// "Cinema · 6 Mar 2026" or "Netflix · 6 Mar 2026"; for a plain list, the next (or latest) German date.
function releaseLine(item) {
  var release = itemRelease(item);
  if (!release) return null;
  var line = document.createElement('p');
  line.className = 'release';
  line.appendChild(text('span', whereText(item.title, release.kind), 'kind'));
  line.appendChild(document.createTextNode(' · ' + shortDate(release.date)));
  return line;
}

function card(item) {
  var title = item.title;
  var article = document.createElement('article');
  article.className = 'card';
  var poster = document.createElement('img');
  poster.className = 'poster';
  poster.alt = '';
  poster.loading = 'lazy';
  if (title.poster_path) poster.src = IMG + 'w342' + title.poster_path;
  article.appendChild(poster);

  var body = document.createElement('div');
  body.className = 'body';
  body.appendChild(text('h3', title.title));
  var meta = (title.genres || []).slice(0, 2).map(function (g) { return g.name; }).join(' · ');
  if (title.original_title !== title.title) meta = title.original_title + (meta ? ' — ' + meta : '');
  if (meta) body.appendChild(text('p', meta, 'meta'));
  var line = releaseLine(item);
  if (line) body.appendChild(line);
  if (title.overview) body.appendChild(text('p', title.overview, 'overview'));

  var actions = document.createElement('div');
  actions.className = 'actions';
  if (title.trailer) {
    actions.appendChild(button('Play trailer', 'btn primary', function () { playTrailer(title, this); }));
  }
  actions.appendChild(seerrControl(title));
  body.appendChild(actions);

  var check = document.createElement('details');
  check.className = 'check';
  check.appendChild(text('summary', title.trailer ? 'Trailer check' + (title.trailer.kinocheck_url ? ' · KinoCheck' : '') : 'No trailer · why'));
  if (title.trailer && title.trailer.kinocheck_url) {
    var link = text('a', 'Trailer: KinoCheck');
    link.href = title.trailer.kinocheck_url;
    check.appendChild(document.createElement('div')).appendChild(link);
  }
  title.decisions.forEach(function (decision) {
    check.appendChild(text('div', decision.key + ' (' + decision.source + '): ' +
      (decision.playable ? 'playable — ' : 'hidden — ') + decision.reason));
  });
  body.appendChild(check);
  article.appendChild(body);
  return article;
}

function seerrControl(title) {
  var status = seerrStatus[title.tmdb_id];
  if (SEERR_LABELS[status]) return text('span', SEERR_LABELS[status], 'status');
  var b = button('Request via Seerr', 'btn', function () {
    b.disabled = true;
    b.textContent = 'Requesting...';
    getJson('/api/request/' + title.tmdb_id, function (error, result) {
      if (error) { b.disabled = false; b.textContent = 'Request failed - try again'; return; }
      seerrStatus[title.tmdb_id] = result.status;
      b.parentNode.replaceChild(seerrControl(title), b);
    }, 'POST');
  });
  return b;
}

renderViews();
renderKinds();
renderLayout();

// Seerr state loads after the list; without it the request button is still offered.
getJson('/api/titles', function (error, titles) {
  if (error) {
    document.getElementById('titles').textContent = error.message === 'network' ? 'Backend unreachable.' : 'Could not load titles.';
    return;
  }
  allTitles = titles;
  renderGenres();
  renderKeywords();
  renderTitles();
  getJson('/api/seerr', function (seerrError, statuses) {
    if (seerrError) return;
    seerrStatus = statuses;
    renderTitles();
  });
});
</script>
</body>
</html>
