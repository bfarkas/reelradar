<!DOCTYPE html>
<html lang="en" class="rr">
<head>
<meta charset="utf-8">
<title>ReelRadar</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#0D3438">
<link rel="preload" href="/design/fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/design/tokens.css">
<link rel="stylesheet" href="/design/components.css">
<style>
/* Design kit: design/README.md. Tokens, Inter and the rr-* components come from design/tokens.css and components.css (copied here by build_tokens.py); this block only lays them out. */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; }
::selection { background: var(--accent); color: var(--on-accent); }
html { caret-color: var(--accent-text); scrollbar-color: var(--line-strong) var(--bg); }
a { color: var(--fg); text-underline-offset: 3px; }
button, select, input { font: inherit; color: inherit; }
:focus { outline: none; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.rr-btn:focus-visible, .rr-chip:focus-visible, .rr-seg__opt:focus-visible { outline: none; }
/* the kit rings on :focus; a mouse click on the web should not leave one behind */
.rr-btn:focus:not(:focus-visible), .rr-chip:focus:not(:focus-visible), .rr-seg__opt:focus:not(:focus-visible) { box-shadow: none; }
.rr-seg__opt.is-on:focus:not(:focus-visible) { box-shadow: var(--shadow-card); }
.wrap { margin: 0 auto; max-width: 1180px; padding: 0 var(--space-5); }

header.top { background: var(--brand-teal); color: var(--brand-white); position: sticky; top: 0; z-index: 5; }
header.top .wrap { align-items: center; display: flex; gap: var(--space-6); min-height: 64px; }
header.top :focus-visible { outline-color: var(--brand-white); }
.logo { display: block; flex: none; height: 32px; width: auto; }
#views { display: flex; gap: var(--space-2); }
#views a { border-bottom: 3px solid transparent; border-top: 3px solid transparent; color: rgba(255,255,255,0.72); font-size: 15px; font-weight: 600; line-height: 20px; padding: 19px var(--space-3) 16px; text-decoration: none; transition: color var(--duration-fast) var(--ease-out); white-space: nowrap; }
#views a:hover { color: var(--brand-white); }
/* the current view is white and underlined in white: orange is kept for the one primary action */
#views a[aria-current="page"] { border-bottom-color: var(--brand-white); color: var(--brand-white); font-weight: 700; }
#views a:focus-visible { outline-offset: -3px; }

/* list mode: the first title's backdrop on the right, washed into teal by renderHero */
.hero { background: var(--brand-teal) right center / cover no-repeat; color: var(--brand-white); overflow: hidden; }
/* the text carries its own near-solid wash, soft at the edges: 4.5:1 over any backdrop at any width */
.panel { background: rgba(13,52,56,0.88); box-shadow: 0 0 80px 40px rgba(13,52,56,0.88); max-width: 40em; }
.hero.next { --bg: var(--brand-teal); --focus: var(--brand-white); }
#hero-actions { align-items: center; display: flex; flex-wrap: wrap; gap: var(--space-3); margin-top: var(--space-5); }
#hero-actions:empty { display: none; }
#hero-actions .rr-btn { height: 44px; margin-left: 0; }
#hero-actions .rr-btn--secondary { border-color: rgba(255,255,255,0.5); color: var(--brand-white); }
#hero-actions .rr-btn--secondary:hover { background: rgba(255,255,255,0.12); }
#hero-actions .note { color: rgba(255,255,255,0.82); }
body:not(.wall-mode) #hero-count, body.wall-mode #count { display: none; }
.hero .wrap { padding-bottom: var(--space-7); padding-top: var(--space-7); }
.hero h1 { font-size: clamp(32px, 5vw, 48px); font-weight: 800; letter-spacing: -0.02em; line-height: 1.08; margin: 0 0 var(--space-3); max-width: 14em; text-wrap: balance; }
.hero p.lead { color: rgba(255,255,255,0.82); font-size: 16px; line-height: 24px; margin: 0; max-width: 34em; }

.bar { align-items: center; display: flex; flex-wrap: wrap; gap: var(--space-2); padding: var(--space-5) 0 var(--space-2); }
.bar .rr-chip, #active-tags .rr-chip, #filter .rr-chip, #filter .rr-field__input, #filter-clear, .rr-seg__opt { height: 44px; }
.rr-seg__opt { justify-content: center; min-width: 44px; }
#filter-clear { padding: 0 var(--space-3); font-size: 14px; }
#count { color: var(--fg-muted); font-size: 13px; font-variant-numeric: tabular-nums; margin-left: auto; }
#layout .rr-seg__opt { align-items: center; display: inline-flex; padding: 0 var(--space-3); }
#layout svg { display: block; fill: currentColor; height: 16px; width: 16px; }
#active-tags .rr-chip { margin: 0 var(--space-2) var(--space-2) 0; }
.x-icon { display: inline-flex; margin-left: var(--space-2); }
#detail .x .x-icon { margin: 0; }
#detail .x svg { height: 14px; width: 14px; }

#filter { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); margin: var(--space-2) 0; padding: var(--space-1) var(--space-5) var(--space-4); }
#filter h2 { font-size: 17px; font-weight: 700; line-height: 22px; margin: var(--space-5) 0 var(--space-3); }
#filter .rr-chip { margin: 0 var(--space-2) var(--space-2) 0; }
#filter .rr-field__input { margin-bottom: var(--space-3); max-width: 100%; width: 22em; }

.day { align-items: baseline; border-bottom: 1px solid var(--line); display: flex; gap: var(--space-3); justify-content: space-between; margin: var(--space-7) 0 var(--space-4); padding-bottom: var(--space-2); scroll-margin-top: 132px; }
.day h2 { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; line-height: 28px; margin: 0; }
.day small { color: var(--fg-muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.grid { display: grid; gap: var(--space-4); grid-template-columns: repeat(auto-fill, minmax(440px, 1fr)); }
/* month jumps stay under the header while the calendar scrolls; the month in view is bold and underlined in ink */
.months { background: var(--bg); border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: var(--space-2); margin: 0 calc(-1 * var(--space-5)); padding: var(--space-2) var(--space-5); position: sticky; top: 64px; z-index: 4; }
.month { background: none; border: 0; border-bottom: 3px solid transparent; cursor: pointer; font-size: 14px; font-variant-numeric: tabular-nums; font-weight: 500; height: 44px; min-width: 44px; padding: 0 var(--space-3); white-space: nowrap; }
.month:hover { background: var(--surface-raised); }
.month[aria-current] { border-bottom-color: var(--fg); font-weight: 800; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md); box-shadow: var(--shadow-card); display: flex; gap: var(--space-4); padding: var(--space-4); }
.posterwrap { align-self: flex-start; flex: 0 0 104px; position: relative; width: 104px; }
/* the inset line is painted under the picture, so it only shows where there is none: an empty box stays visible on dark */
.poster { aspect-ratio: 2 / 3; background: var(--poster-empty); border-radius: var(--radius-sm); box-shadow: inset 0 0 0 1px var(--line-strong); display: block; object-fit: cover; width: 100%; }
.card .body { display: flex; flex: 1; flex-direction: column; min-width: 0; }
.card h3 { font-size: 17px; font-weight: 700; line-height: 22px; margin: var(--space-1) 0 var(--space-1); }
.card .open { background: none; border: 0; border-radius: var(--radius-sm); cursor: pointer; display: block; font: inherit; padding: 0; text-align: left; width: 100%; }
.card h3 .open:hover { text-decoration: underline; text-underline-offset: 3px; }
/* list cards: the poster is flush with the card edge and fills its height */
.grid .card { gap: 0; padding: 0; }
.grid .posterwrap { align-self: stretch; flex-basis: 132px; min-height: 198px; width: 132px; }
.grid .posterwrap .open, .grid .poster { height: 100%; }
.grid .posterwrap .open { position: absolute; top: 0; left: 0; }
.grid .poster { aspect-ratio: auto; border-radius: var(--radius-md) 0 0 var(--radius-md); width: 100%; }
.grid > .card > .posterwrap > .poster { position: absolute; }
.grid .card .body { padding: var(--space-3) var(--space-4); }
.grid .card .release { font-weight: 500; }
.grid .card .release.premiere { font-weight: 800; }
.grid .actions .rr-btn { height: 44px; }
.grid .actions .rr-status, .grid .note { line-height: 44px; }
.grid .credit { margin-top: var(--space-1); }
.posterwrap .rr-badge { left: 50%; position: absolute; top: var(--space-2); transform: translateX(-50%); }
.credit { font-size: 12px; margin: var(--space-2) 0 0; }
.credit a { color: var(--fg-muted); }
.meta { color: var(--fg-muted); font-size: 13px; line-height: 18px; margin: 0 0 var(--space-1); }
.release { font-size: 13px; font-variant-numeric: tabular-nums; font-weight: 600; line-height: 18px; margin: 0 0 var(--space-1); }
.overview { color: var(--fg-muted); display: -webkit-box; font-size: 14px; line-height: 20px; margin: var(--space-1) 0 var(--space-3); overflow: hidden; -webkit-box-orient: vertical; -webkit-line-clamp: 3; }
.overview .lang { border: 1px solid currentColor; border-radius: 3px; font-size: 11px; font-weight: 700; letter-spacing: 0.04em; line-height: 14px; margin-right: 6px; padding: 0 3px; }
.actions { align-items: center; display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: auto; }
.actions .rr-btn { height: 36px; margin-left: 0; padding: 0 var(--space-4); font-size: 14px; }
/* a request is the second action: a text button, so the card has one filled button */
.actions .rr-btn--text { background: none; border: 0; color: var(--fg); padding: 0 2px; text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 4px; }
.actions .rr-btn--text:hover { text-decoration-color: currentColor; }
.actions .rr-status { line-height: 36px; }
.note { color: var(--fg-muted); font-size: 13px; font-weight: 600; line-height: 36px; }
details.check { color: var(--fg-muted); font-size: 12px; margin-top: var(--space-3); }
details.check summary { cursor: pointer; }
details.check div { margin: var(--space-1) 0; overflow-wrap: anywhere; }
.empty { color: var(--fg-muted); padding: var(--space-7) 0; }
.empty[role="alert"] { color: var(--fg); padding-bottom: var(--space-3); }
.more { display: flex; margin: var(--space-4) auto 0; }

/* poster wall: the default layout */
.wall { align-items: start; display: grid; gap: var(--space-5) var(--space-4); grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); }
.tile { background: none; border: 0; border-radius: var(--radius-sm); color: var(--fg); cursor: pointer; padding: 0; position: relative; text-align: left; }
.tile .art { box-shadow: inset 0 0 0 1px var(--line-strong), var(--shadow-card); transition: transform var(--duration-base) var(--ease-out), box-shadow var(--duration-base) var(--ease-out); }
.tile:hover .art, .tile:focus-visible .art { box-shadow: 0 0 0 2px var(--bg), 0 0 0 5px var(--focus), var(--shadow-pop); transform: translateY(-2px); }
.tile:focus-visible { outline: none; }
.tile .rr-badge { bottom: var(--space-2); left: 50%; max-width: 94%; overflow: hidden; position: absolute; text-overflow: ellipsis; transform: translateX(-50%); }
.tile .ttl { display: -webkit-box; font-size: 14px; font-weight: 600; line-height: 18px; margin-top: var(--space-2); overflow: hidden; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
.tile .date { color: var(--fg-muted); display: block; font-size: 12px; font-variant-numeric: tabular-nums; font-weight: 500; line-height: 16px; margin-top: 2px; }
/* where and Seerr state; the title is already under the poster. Hover and keyboard focus both show it. */
body.wall-mode .hero { background: none; color: var(--fg); }
body.wall-mode .hero .wrap { padding-bottom: 0; padding-top: var(--space-6); }
body.wall-mode .hero h1 { font-size: 32px; line-height: 38px; margin-bottom: 0; }
body.wall-mode .hero p.lead { display: none; }
body.wall-mode .panel { align-items: baseline; background: none; box-shadow: none; display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-4); justify-content: space-between; max-width: none; }
#hero-count { color: var(--fg-muted); font-size: 14px; font-variant-numeric: tabular-nums; }
body.wall-mode #layout { margin-left: auto; }
#detail { align-items: center; background: var(--scrim); display: flex; inset: 0; justify-content: center; padding: var(--space-4); position: fixed; z-index: 9; }
#detail[hidden] { display: none; }
#detail .card { border-radius: var(--radius-lg); box-shadow: var(--shadow-pop); max-height: 100%; max-width: 600px; overflow-y: auto; padding: var(--space-5); position: relative; width: 100%; }
#detail .card .posterwrap { flex-basis: 150px; width: 150px; }
#detail .card h3 { font-size: 22px; letter-spacing: -0.01em; line-height: 28px; padding-right: 44px; }
#detail .overview { -webkit-line-clamp: 8; }
#detail .x { height: 36px; padding: 0; position: absolute; right: var(--space-3); top: var(--space-3); width: 36px; }

#player { align-items: center; background: rgba(4,16,18,0.94); display: flex; inset: 0; justify-content: center; padding: var(--space-5); position: fixed; z-index: 10; }
#player[hidden] { display: none; }
#player video { background: #000; border-radius: var(--radius-md); max-height: 85vh; max-width: 100%; width: 1100px; }
#player .close { border-color: rgba(255,255,255,0.5); color: var(--brand-white); position: absolute; right: var(--space-5); top: var(--space-4); }
#player .close:hover { background: rgba(255,255,255,0.12); }
#player p { color: var(--brand-white); font-size: 17px; text-align: center; }
#player video[hidden], #player p[hidden] { display: none; }

footer { border-top: 1px solid var(--line); color: var(--fg-muted); font-size: 12px; line-height: 16px; margin-top: var(--space-7); padding: var(--space-5) 0 var(--space-6); }

@media (max-width: 720px) {
  .wrap { padding: 0 var(--space-4); }
  /* the header scrolls away on a phone; the month jumps take its place at the top */
  header.top { position: static; }
  header.top .wrap { flex-direction: column; align-items: flex-start; gap: 0; padding-top: var(--space-3); }
  .logo { height: 28px; }
  /* every view stays visible: the tabs wrap onto a second line instead of running off the edge */
  #views { flex-wrap: wrap; gap: 0 var(--space-1); margin-left: calc(-1 * var(--space-2)); }
  #views a { padding: var(--space-3) var(--space-2) 9px; }
  /* list mode puts artwork behind the heading: this near-solid wash keeps its text at 4.5:1 even over white */
  .hero .wrap { background: rgba(13,52,56,0.92); padding: var(--space-5) var(--space-4); }
  body.wall-mode .hero .wrap { background: none; padding-top: var(--space-4); }
  body.wall-mode .hero h1 { font-size: 26px; line-height: 32px; }
  .rr-chip, .rr-btn, .rr-seg__opt, #filter-clear { min-height: 44px; min-width: 44px; }
  .actions .rr-btn { height: 44px; }
  .actions .rr-status, .note { line-height: 44px; }
  .bar { padding: var(--space-3) 0 0; }
  .months { flex-wrap: nowrap; margin: 0 calc(-1 * var(--space-4)); overflow-x: auto; padding: var(--space-2) var(--space-4); scrollbar-width: none; top: 0; }
  .months .month { flex: none; }
  .day { margin: var(--space-2) 0 var(--space-3); scroll-margin-top: 72px; }
  .day h2 { font-size: 20px; }
  .grid { grid-template-columns: 1fr; }
  .card { padding: var(--space-3); gap: var(--space-3); }
  .posterwrap { flex-basis: 88px; width: 88px; }
  .grid .posterwrap { flex-basis: 112px; min-height: 168px; width: 112px; }
  .panel { background: none; box-shadow: none; }
  .wall { gap: var(--space-4) var(--space-2); grid-template-columns: repeat(3, 1fr); }
  #detail .card .posterwrap { flex-basis: 96px; width: 96px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; }
}
</style>
</head>
<body>
<div id="page">
<header class="top"><div class="wrap">
  <img class="logo" src="/design/logo-on-dark.svg" alt="ReelRadar" width="145" height="32">
  <nav id="views" aria-label="Views"></nav>
</div></header>

<section class="hero" id="hero"><div class="wrap">
  <div class="panel">
    <h1 id="hero-title">What's coming next</h1>
    <span id="hero-count"></span>
    <p class="lead" id="hero-lead">Cinema and streaming releases in Germany for the next six months.</p>
    <div id="hero-actions"></div>
  </div>
</div></section>

<main class="wrap">
  <div class="bar" id="bar">
    <button type="button" class="rr-chip" id="filter-toggle" aria-expanded="false" aria-controls="filter">Filter</button>
    <button type="button" class="rr-btn rr-btn--ghost" id="filter-clear" hidden>Clear filter</button>
    <span id="count"></span>
    <span class="rr-seg" id="layout" role="group" aria-label="Layout"></span>
  </div>
  <div id="active-tags" role="group" aria-label="Active filters"></div>
  <section id="filter" hidden>
    <h2>Releases</h2>
    <div id="kinds"></div>
    <h2>Streaming service</h2>
    <select class="rr-field__input" id="service" aria-label="Streaming service"></select>
    <h2>Genres</h2>
    <div id="genres"></div>
    <h2>Keywords</h2>
    <input type="search" class="rr-field__input" id="keyword-search" placeholder="Search keywords" aria-label="Search keywords">
    <div id="keywords"></div>
  </section>
  <div id="titles"><p class="empty">Loading titles...</p></div>
</main>

<footer><div class="wrap">This product uses the TMDB API but is not endorsed or certified by TMDB. Streaming availability from JustWatch via TMDB.</div></footer>
</div>

<div id="detail" hidden role="dialog" aria-modal="true" aria-label="Title details"></div>

<div id="player" hidden role="dialog" aria-modal="true" aria-label="Trailer">
  <button type="button" class="rr-btn rr-btn--secondary close" id="player-close">Close</button>
  <video id="video" controls playsinline></video>
  <p id="player-error" role="alert" hidden></p>
</div>

<script>
// ES5, like the TV app.
var IMG = 'https://image.tmdb.org/t/p/';
function text(tag, value, className) {
  var element = document.createElement(tag);
  element.textContent = value;
  if (className) element.className = className;
  return element;
}
function button(label, className, onclick) {
  var b = text('button', label, className);
  b.setAttribute('type', 'button');
  if (onclick) b.onclick = onclick;
  return b;
}

// ---- trailer: the cached MP4 from /api/stream, same as the TV app ----
var player = document.getElementById('player');
var video = document.getElementById('video');
var playerReturn = null;
// The message replaces the blank video box; '' brings the video back.
function showPlayerError(message) {
  var error = document.getElementById('player-error');
  error.textContent = message;
  error.hidden = !message;
  video.hidden = !!message;
}
video.addEventListener('error', function () {
  if (!video.getAttribute('src')) return; // closing removes the source, which is not a failure
  showPlayerError('This trailer could not be played.');
  document.getElementById('player-close').focus();
});
function hidePlayer() {
  video.pause(); video.removeAttribute('src'); video.load(); player.hidden = true;
  setModal();
  if (playerReturn) playerReturn();
}
function closePlayer() { if (player.hidden) return; hidePlayer(); window.history.back(); }
document.getElementById('player-close').onclick = closePlayer;
player.onclick = function (event) { if (event.target === player) closePlayer(); };
document.addEventListener('keydown', function (event) {
  if (event.key !== 'Escape') return;
  if (!player.hidden) closePlayer();
  else if (!detail.hidden) closeDetail();
});

function playTrailer(title, trigger) {
  var returnFocus = keepPlace(trigger); // before disabling, which drops focus
  trigger.disabled = true;
  trigger.textContent = 'Loading...';
  getJson('/api/stream/' + mediaType(title) + '/' + title.tmdb_id, function (error, stream) {
    trigger.disabled = false;
    trigger.textContent = 'Play trailer';
    if (error) { trigger.textContent = 'Trailer unavailable, try again'; return; }
    showPlayerError('');
    video.src = stream.url;
    if (player.hidden) {
      playerReturn = returnFocus;
      player.hidden = false;
      setModal();
      pushOverlay();
      document.getElementById('player-close').focus();
    }
    video.play();
  });
}

function getJson(url, callback, method) {
  var xhr = new XMLHttpRequest();
  xhr.open(method || 'GET', url);
  xhr.onload = function () {
    var value;
    try { value = JSON.parse(xhr.responseText); } catch (error) {}
    if (xhr.status !== 200 || value === undefined) callback(new Error('HTTP ' + xhr.status));
    else callback(null, value);
  };
  xhr.onerror = function () { callback(new Error('network')); };
  xhr.send();
}

// ---- filter state: {v:1, genres, keywords, kind, service} in localStorage (may be missing or throw) ----
var FILTER_KEY = 'reelradar.filter';
var allTitles = [];
var loadError = ''; // the message while the list could not be loaded
var seerrStatus = {}; // titleKey -> none|requested|partial|available; a missing key is unknown and still offers the request
var SEERR_LABELS = { requested: 'Requested in Seerr', partial: 'Partly in the library', available: 'In the library' };
var selection = loadSelection();

function loadSelection() {
  var empty = { v: 1, genres: [], keywords: [], kind: 'all', service: 0 };
  try {
    var value = JSON.parse(window.localStorage.getItem(FILTER_KEY));
    if (value && value.v === 1 && value.genres instanceof Array && value.keywords instanceof Array) {
      value.kind = value.kind || 'all';
      value.service = value.service || 0;
      return value;
    }
  } catch (error) {}
  return empty;
}
function saveSelection() {
  try { window.localStorage.setItem(FILTER_KEY, JSON.stringify(selection)); } catch (error) {}
}

function hasAny(tags, ids) {
  for (var i = 0; i < tags.length; i += 1) if (ids.indexOf(tags[i].id) !== -1) return true;
  return false;
}

// Genres/keywords: ANY selected one matches; nothing selected shows everything. Service: must be on it, or (chosen.expected,
// the release calendar) premiere on it according to TMDB's German release note.
function matchesFilter(title, chosen) {
  if (chosen.service && !hasAny(title.providers || [], [chosen.service]) &&
      !(chosen.expected && hasAny(title.providers_expected || [], [chosen.service]))) return false;
  if (!chosen.genres.length && !chosen.keywords.length) return true;
  return hasAny(title.genres || [], chosen.genres) || hasAny(title.keywords || [], chosen.keywords);
}

// ---- identity: movie and series ids overlap in TMDB, so a title is (media_type, tmdb_id) ----
function mediaType(title) { return title.media_type === 'tv' ? 'tv' : 'movie'; }
function isSeries(title) { return mediaType(title) === 'tv'; }
function titleKey(title) { return mediaType(title) + ':' + title.tmdb_id; }
// A series has no German dates. Where it streams in Germany comes from TMDB's flatrate list; null shows nothing.
function availableText(title, short) {

  var names = title.providers.map(function (p) { return p.name; }).join(', ');
  return short ? 'On ' + names : 'Available on ' + names + ' in Germany';

// ---- views (same logic in frontend/index.html and tv-app/index.html) ----
var VIEWS = [['upcoming', 'Release calendar'], ['trailers', 'New trailers'], ['recent', 'Recently released'], ['genres', 'Genres'], ['all', 'All titles']];
var HERO = {
  upcoming: ["What's coming next", 'Cinema and streaming releases in Germany for the next six months. Series have no German date: find them under the other views.'],
  trailers: ['New trailers', 'The latest trailers, in the original language where one exists.'],
  recent: ['Recently released', 'What reached German cinemas and streaming in the last three months. Series are under the other views.'],
  genres: ['By genre', 'Every title, shelved by genre.'],
  all: ['All titles', 'Every title ReelRadar knows about.']
};
var KINDS = [['all', 'All releases'], ['cinema', 'Cinema'], ['streaming', 'Streaming']];
var WINDOW_DAYS = 90; // "recently released" looks three months back
var AHEAD_DAYS = 183; // "upcoming" looks six months ahead, matching the import

function isoDay(offsetDays) {
  var d = new Date(Date.now() + offsetDays * 86400000);
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
}

// A title's German releases as entries; kind filter applies. Cinema = theatrical, streaming = digital.
function releases(title, kind) {
  var list = [];
  if (title.de_theatrical && kind !== 'streaming') list.push({ title: title, kind: 'cinema', date: title.de_theatrical });
  if (title.de_digital && kind !== 'cinema') list.push({ title: title, kind: 'streaming', date: title.de_digital });
  return list;
}

// Kind filter for the views without a calendar. A series has no cinema release; it counts as streaming when
// TMDB lists a German flatrate service for it.
function inKind(title, kind) {
  if (kind === 'all') return true;
  if (isSeries(title)) return kind === 'streaming' && !!(title.providers && title.providers.length);
  return releases(title, kind).length > 0;
}

// -> [{heading, note, items:[{title, kind, date}]}]; calendar views list each release on its day. A series has no
// German date, so it is not in the calendar views (Release calendar, Recently released); it is in the others.
// It is never under Cinema, and under Streaming only while it is on a German service.
function viewSections(view, titles, kind) {
  var today = isoDay(0);
  if (view === 'upcoming' || view === 'recent') {
    var from = view === 'upcoming' ? today : isoDay(-WINDOW_DAYS);
    var to = view === 'upcoming' ? isoDay(AHEAD_DAYS + 1) : today;
    var entries = [];
    titles.forEach(function (title) {
      releases(title, kind).forEach(function (entry) { if (entry.date >= from && entry.date < to) entries.push(entry); });
    });
    entries.sort(function (a, b) {
      var order = a.date < b.date ? -1 : a.date > b.date ? 1 : 0;
      return view === 'upcoming' ? order : -order;
    });
    var days = [];
    entries.forEach(function (entry) {
      var last = days[days.length - 1];
      if (!last || last.date !== entry.date) { last = { date: entry.date, heading: longDate(entry.date), items: [] }; days.push(last); }
      last.items.push(entry);
    });
    days.forEach(function (day) { day.note = day.items.length + (day.items.length === 1 ? ' release' : ' releases'); });
    return days;
  }
  var kept = titles.filter(function (title) { return inKind(title, kind); });
  function asItem(title) { return { title: title, kind: null, date: null }; }
  if (view === 'trailers') {
    var withTrailer = kept.filter(function (title) { return title.trailer; });
    withTrailer.sort(function (a, b) { return (b.trailer.published_at || '') > (a.trailer.published_at || '') ? 1 : -1; });
    return [{ heading: '', items: withTrailer.map(asItem) }];
  }
  if (view === 'genres') {
    var byName = {}, names = [];
    kept.forEach(function (title) {
      (title.genres || []).forEach(function (genre) {
        if (!byName[genre.name]) { byName[genre.name] = []; names.push(genre.name); }
        byName[genre.name].push(title);
      });
    });
    return names.sort().map(function (name) {
      return { heading: name, note: byName[name].length + ' titles', items: byName[name].map(asItem) };
    });
  }
  kept.sort(byTitle);
  return [{ heading: '', items: kept.map(asItem) }];
}
// A to Z, ignoring case and accents. Equal titles go by id: the TV's engine does not keep their order by itself.
function byTitle(a, b) {
  return a.title.localeCompare(b.title, 'en', { sensitivity: 'base' }) || (titleKey(a) < titleKey(b) ? -1 : 1);
}

var DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

}
function shortDate(iso) {

}

// ---- filter controls ----
function collectTags(kind) {
  var byId = {};
  var list = [];
  for (var i = 0; i < allTitles.length; i += 1) {
    var tags = allTitles[i][kind] || [];
    for (var j = 0; j < tags.length; j += 1) {
      if (!byId[tags[j].id]) {
        byId[tags[j].id] = { id: tags[j].id, name: tags[j].name, count: 0 };
        list.push(byId[tags[j].id]);
      }
      byId[tags[j].id].count += 1;
    }
  }

}
function byName(a, b) { return a.name < b.name ? -1 : a.name > b.name ? 1 : 0; }

function toggleButton(kind, tag) {

  b.setAttribute('aria-pressed', ids.indexOf(tag.id) !== -1 ? 'true' : 'false');

function chipClass(on) { return on ? 'rr-chip is-on' : 'rr-chip'; }

function activeCount() {

}

// What is filtering the list, visible with the panel closed: the number on the Filter button, a removable chip for the
// release kind, the service and each genre or keyword, and Clear filter only when there is something to clear.
function renderActive() {

  }

function renderGenres() {

// Only the release calendar counts expected providers: recent and the other lists show where a title streams now.
function scoped(view, chosen) {
  return { genres: chosen.genres, keywords: chosen.keywords, service: chosen.service, expected: view === 'upcoming' };
}

// Services a view offers: where titles stream now, plus (calendar) where premieres are expected.
function serviceTags(view) {
  var tags = collectTags('providers');
  if (view !== 'upcoming') return tags;
  collectTags('providers_expected').forEach(function (tag) {
    if (!tags.some(function (known) { return known.id === tag.id; })) tags.push(tag);
  });
  return tags;
}

// Items the current view lists for each service (0 = none) under the other filters, so a chip's number is what picking it shows.
function serviceCounts(view, chosen) {
  var counts = {};
  serviceTags(view).forEach(function (service) {
    var shown = allTitles.filter(function (title) {
      return matchesFilter(title, { genres: chosen.genres, keywords: chosen.keywords, service: service.id, expected: view === 'upcoming' });
    });
    counts[service.id] = viewCount(view, viewSections(view, shown, chosen.kind));
  });
  return counts;
}

function renderServices() {
  var select = document.getElementById('service');

  select.appendChild(all);
  services.forEach(function (service) {

    option.value = String(service.id);

  });
  select.value = String(selection.service);

// ---- list ----
// Entries a calendar lists, titles otherwise; genre shelves repeat a title, so count it once.
function viewCount(view, sections) {
  var count = 0, seen = {};
  sections.forEach(function (section) {
    section.items.forEach(function (item) {
      if (view !== 'genres') count += 1;
      else if (!seen[titleKey(item.title)]) { seen[titleKey(item.title)] = true; count += 1; }
    });
  });
  return count;
}

// Why a view is empty. A premiere carries a service only when TMDB's German release note names it, or once it streams there.
function emptyMessage(view, chosen) {
  if (!allTitles.length) return 'No titles imported yet.';
  if (chosen.service && (view === 'upcoming' || view === 'recent')) {
    var service = serviceTags(view).filter(function (tag) { return tag.id === chosen.service; })[0];
    var name = service ? service.name : 'This service';
    var serviceOnly = { genres: [], keywords: [], service: chosen.service };
    var onService = allTitles.filter(function (title) { return matchesFilter(title, serviceOnly); });
    var listed = allTitles.filter(function (title) { return matchesFilter(title, scoped(view, serviceOnly)); });
    if (!viewCount(view, viewSections(view, listed, 'all'))) {
      return name + ' has no ' + (view === 'upcoming' ? 'upcoming' : 'recent') + ' releases in Germany. ' +
        (view === 'upcoming' ? 'A premiere shows up here once TMDB names its service, in the German release note or after it starts streaming. ' : '') +
        onService.length + (onService.length === 1 ? ' title is' : ' titles are') + ' on ' + name + ' now: see All titles.';
    }
  }
  return 'No titles in this view match the filter.';
}

function renderTitles() {
  if (loadError) { showLoadError(); return; } // a view or filter change must not turn the failure into "no titles"
  renderServices();
  var shown = allTitles.filter(function (title) { return matchesFilter(title, scoped(currentView, selection)); });
  var sections = viewSections(currentView, shown, selection.kind);
  var count = viewCount(currentView, sections);
  var total = activeCount() ? viewCount(currentView, viewSections(currentView, allTitles, 'all')) : null;
  document.getElementById('count').textContent = document.getElementById('hero-count').textContent = countText(count, total);
  renderActive();
  renderHero(sections);
  render(sections);
}

// "310 releases", or "44 of 310 releases" with a filter (total is then the unfiltered number). Same words as on the TV.
function countText(count, total) {
  var last = total === null ? count : total;

  return (total === null ? '' : count + ' of ') + last + noun + (last === 1 ? '' : 's');

var GENRE_CAP = 12; // titles a genre starts with: all of them made a phone page of 1,378 posters
var expandedGenres = {};

function render(sections) {
  var root = document.getElementById('titles');
  root.textContent = '';
  monthMarks = [];
  if (!sections.length || (sections.length === 1 && !sections[0].items.length)) {
    root.appendChild(text('p', emptyMessage(currentView, selection), 'empty'));
    return;
  }
  var wall = layout === 'wall';
  var calendar = currentView === 'upcoming' || currentView === 'recent';
  // The wall groups calendar views by week, a day per heading would leave rows of one or two posters.
  var groups = !wall || currentView === 'genres' ? sections : calendar ? byWeek(sections) :
    [{ heading: '', items: [].concat.apply([], sections.map(function (s) { return s.items; })) }];
  var months = [], seen = {};
  groups.forEach(function (group) {
    var head = null;
    if (group.heading) {
      head = document.createElement('div');
      head.className = 'day';
      head.appendChild(text('h2', calendar && !wall ? dayHeading(group.date) : group.heading));
      if (group.note) head.appendChild(text('small', group.note));
      root.appendChild(head);
    } else {
      root.appendChild(document.createElement('div')).style.height = '12px';
    }
    if (calendar) group.items.forEach(function (item) {
      var month = item.date.slice(0, 7);
      if (!seen[month]) { seen[month] = true; months.push({ month: month, head: head }); }
    });
    var grid = document.createElement('div');
    grid.className = wall ? 'wall' : 'grid';
    root.appendChild(grid);
    fill(root, grid, group, wall ? tile : card);
  });
  if (months.length > 1) root.insertBefore(monthNav(months), root.firstChild);
  markMonth();
}

// The group's posters or cards; a genre shows the first few until "Show all", which appends the rest in place.
function fill(root, grid, group, make) {
  var capped = currentView === 'genres' && !expandedGenres[group.heading] && group.items.length > GENRE_CAP;
  function add(item) { return grid.appendChild(make(item)); }
  (capped ? group.items.slice(0, GENRE_CAP) : group.items).forEach(add);
  if (!capped) return;
  var more = button('Show all ' + group.items.length, 'rr-btn rr-btn--secondary more', function () {
    expandedGenres[group.heading] = true; // kept when the list is redrawn
    var first = group.items.slice(GENRE_CAP).map(add)[0];
    root.removeChild(more);
    (make === tile ? first : first.querySelector('.open')).focus();
  });
  more.setAttribute('aria-label', 'Show all ' + group.items.length + ' titles in ' + group.heading);
  root.appendChild(more);

// Monday of the date's week.
function weekStart(iso) {
  var d = new Date(iso + 'T12:00:00Z');
  d.setUTCDate(d.getUTCDate() - (d.getUTCDay() + 6) % 7);
  return d.toISOString().slice(0, 10);
}
// Calendar days (in order) -> one group per week.
function byWeek(days) {
  var weeks = [];
  days.forEach(function (day) {
    var start = weekStart(day.date);
    var last = weeks[weeks.length - 1];
    if (!last || last.start !== start) { last = { start: start, heading: weekHeading(start), items: [] }; weeks.push(last); }
    last.items = last.items.concat(day.items);
  });
  weeks.forEach(function (week) { week.note = week.items.length + (week.items.length === 1 ? ' release' : ' releases'); });
  return weeks;
}
// "This week · until 29 Nov", "Next week · 30 Nov – 6 Dec", other weeks the dates alone. Recently released looks back.
function weekHeading(start) {
  var end = new Date(start + 'T12:00:00Z');
  end.setUTCDate(end.getUTCDate() + 6);
  end = end.toISOString().slice(0, 10);
  if (start === weekStart(isoDay(0))) return 'This week · ' + (currentView === 'recent' ? 'since ' + dayMonth(start) : 'until ' + dayMonth(end));
  var range = (start.slice(0, 7) === end.slice(0, 7) ? Number(start.slice(8)) : dayMonth(start)) + ' – ' + dayMonth(end);
  if (start === weekStart(isoDay(7))) return 'Next week · ' + range;
  return start === weekStart(isoDay(-7)) ? 'Last week · ' + range : range;
}
// Dates for headings and captions name the year only when it is not this year's.
function yearSuffix(d) { return d.getFullYear() === new Date().getFullYear() ? '' : ' ' + d.getFullYear(); }
function dayMonth(iso) { // "7 Dec"
  var d = new Date(iso + 'T12:00:00');
  return d.getDate() + ' ' + MONTHS[d.getMonth()] + yearSuffix(d);
}
function captionDate(iso) { return DAYS[new Date(iso + 'T12:00:00').getDay()] + ' ' + dayMonth(iso); } // "Tue 24 Nov", as on the TV
var WEEKDAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
var MONTH_NAMES = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
function dayHeading(iso) { // "Tuesday, 24 November"
  var d = new Date(iso + 'T12:00:00');
  return WEEKDAYS[d.getDay()] + ', ' + d.getDate() + ' ' + MONTH_NAMES[d.getMonth()] + yearSuffix(d);
}

// Jumps to the first heading with a release of that month. Buttons, not anchors: the hash holds the view.
function monthNav(months) {
  var nav = document.createElement('nav');
  nav.className = 'months';
  nav.setAttribute('aria-label', 'Jump to month');
  months.forEach(function (entry) {
    var jump = button(MONTHS[Number(entry.month.slice(5)) - 1] + ' ' + entry.month.slice(0, 4), 'month', function () {
      var heading = entry.head.firstChild;
      heading.setAttribute('tabindex', '-1');
      heading.focus({ preventScroll: true });
      entry.head.scrollIntoView();
      setMonth(mark);
    });
    var mark = { button: jump, head: entry.head };
    monthMarks.push(mark);
    nav.appendChild(jump);
  });
  return nav;
}

// The month in view: the last one whose heading has reached the month bar.
var monthMarks = [], currentMonth = null;
function setMonth(mark) {
  monthMarks.forEach(function (other) {
    if (other === mark) other.button.setAttribute('aria-current', 'true'); else other.button.removeAttribute('aria-current');
  });
  currentMonth = mark;
}
function markMonth() {
  if (!monthMarks.length) return;
  var line = monthMarks[0].button.parentNode.getBoundingClientRect().bottom + 24;
  var reached = monthMarks.filter(function (mark) { return mark.head.getBoundingClientRect().top <= line; });
  var head = (reached[reached.length - 1] || monthMarks[0]).head;
  // two months can start under one heading: the one already marked (just chosen) stays, else the first
  setMonth(currentMonth && currentMonth.head === head && monthMarks.indexOf(currentMonth) !== -1 ? currentMonth :
    monthMarks.filter(function (mark) { return mark.head === head; })[0]);
}
window.onscroll = markMonth;

// "Premieres on Netflix": a streaming release whose service is only expected (TMDB's release note), not yet listed as streaming.
function premiereText(title, kind, date) {
  if (kind !== 'streaming' || (title.providers && title.providers.length) || date < isoDay(0)) return null;
  var expected = title.providers_expected || [];
  return expected.length ? 'Premieres on ' + expected.map(function (p) { return p.name; }).join(', ') : null;
}

function badgeText(title, kind, date) {
  if (kind === 'cinema') return 'Cinema';
  return premiereText(title, kind, date) || (title.providers && title.providers.length ? title.providers[0].name : 'Streaming');
}

function badge(label, kind) { return text('span', label, 'badge rr-badge rr-badge--' + kind + ' ' + kind); }

function tile(item) {
  var title = item.title;
  var release = itemRelease(item);
  var b = button('', 'tile', function () { openDetail(item, this); });
  b.setAttribute('aria-label', (isSeries(title) ? 'Series, ' : '') + title.title + (release ? ', ' + badgeText(title, release.kind, release.date) + ', ' + shortDate(release.date) : ''));
  var art = document.createElement('span');
  art.className = 'art rr-poster'; // without a picture the empty, outlined box stays; the title is under it anyway
  if (title.poster_path) {
    var image = document.createElement('img');
    image.alt = '';
    image.loading = 'lazy'; // before src, so that off-screen posters are not fetched
    image.src = IMG + 'w342' + title.poster_path;
    art.appendChild(image);
  }
  if (isSeries(title)) art.appendChild(badge('Series', 'series'));
  else if (release) art.appendChild(badge(badgeText(title, release.kind, release.date), release.kind));
  b.appendChild(art);
  b.appendChild(text('span', title.title, 'ttl'));
  b.appendChild(text('span', release ? captionDate(release.date) : availableText(title, true) || (isSeries(title) ? '' : 'No German date'), 'date'));
  return b;
}

// Clicking a wall poster shows the full card (trailer, Seerr, synopsis) in a dialog.
var detail = document.getElementById('detail');
var detailReturn = null;
function openDetail(item, opener) {
  detailReturn = keepPlace(opener);
  detail.textContent = '';
  var c = card(item, true);
  var close = c.appendChild(button('', 'rr-btn rr-btn--ghost x', closeDetail));
  close.setAttribute('aria-label', 'Close');
  close.appendChild(closeIcon());
  detail.appendChild(c);
  detail.hidden = false;
  setModal();
  pushOverlay();
  c.querySelector('.rr-btn').focus();
}
function hideDetail() {
  detail.hidden = true;
  detail.textContent = '';
  setModal();
  if (detailReturn) detailReturn();
}
function closeDetail() { if (detail.hidden) return; hideDetail(); window.history.back(); }
detail.onclick = function (event) { if (event.target === detail) closeDetail(); };

// The release an item stands for: its calendar entry, or the title's next (else latest) German date.
function itemRelease(item) {
  if (item.kind) return item;
  var all = releases(item.title, 'all').sort(function (a, b) { return a.date < b.date ? -1 : 1; });
  var today = isoDay(0);
  return all.filter(function (entry) { return entry.date >= today; })[0] || all[all.length - 1] || null;
}
function whereText(title, kind, date) {
  if (kind === 'cinema') return 'Cinema';
  return premiereText(title, kind, date) || (title.providers && title.providers.length ? title.providers.map(function (p) { return p.name; }).join(', ') : 'Streaming');
}

// "Cinema · 6 Mar 2026" ahead; "In cinemas since 6 Mar 2026" or "On Netflix since …" once it is out.
function releaseText(title, release) {
  if (release.date >= isoDay(0)) return whereText(title, release.kind, release.date) + ' · ' + shortDate(release.date);
  var where = release.kind === 'cinema' ? 'In cinemas' : title.providers && title.providers.length ? 'On ' + whereText(title, release.kind, release.date) : 'Streaming';
  return where + ' since ' + shortDate(release.date);
}

// The release line on a card; for a plain list, the next (or latest) German date.
function releaseLine(item) {
  var release = itemRelease(item);
  if (!release && availableText(item.title)) return text('p', availableText(item.title), 'release');
  if (!release) return null;
  return text('p', releaseText(item.title, release), releaseClass(item.title, release));
}
function releaseClass(title, release) { return premiereText(title, release.kind, release.date) ? 'release premiere' : 'release'; }

// In the list, poster and title open the details dialog; the dialog's own card (inDetail) adds the trailer decisions.
function card(item, inDetail) {
  var title = item.title;
  var article = document.createElement('article');
  article.className = 'card';
  var poster = document.createElement(title.poster_path ? 'img' : 'span'); // no picture: the outlined empty box
  poster.className = 'poster';
  if (title.poster_path) {
    poster.alt = '';
    poster.loading = 'lazy';
    poster.src = IMG + 'w342' + title.poster_path;
  }
  var posterWrap = document.createElement('div');
  posterWrap.className = 'posterwrap';
  if (inDetail) posterWrap.appendChild(poster);
  else {
    var open = button('', 'open', function () { openDetail(item, this); });
    open.setAttribute('aria-label', 'Details: ' + title.title);
    open.appendChild(poster);
    posterWrap.appendChild(open);
  }
  if (isSeries(title)) posterWrap.appendChild(badge('Series', 'series'));
  article.appendChild(posterWrap);

  var body = document.createElement('div');
  body.className = 'body';
  if (inDetail) body.appendChild(text('h3', title.title));
  else body.appendChild(document.createElement('h3')).appendChild(button(title.title, 'open', function () { openDetail(item, this); }));
  var meta = (title.genres || []).slice(0, 2).map(function (g) { return g.name; }).join(' · ');
  if (inDetail && title.original_title !== title.title) meta = title.original_title + (meta ? ' — ' + meta : '');
  if (meta) body.appendChild(text('p', meta, 'meta'));
  // under a day heading the date is already said: where it shows is enough
  var line = !inDetail && item.kind ? text('p', whereText(title, item.kind, item.date), releaseClass(title, item)) : releaseLine(item);
  if (line) body.appendChild(line);
  if (inDetail && title.overview) {
    var synopsis = text('p', title.overview, 'overview');
    if (title.overview_lang === 'de') synopsis.insertBefore(text('span', 'DE', 'lang'), synopsis.firstChild);
    body.appendChild(synopsis);
  }

  var actions = document.createElement('div');
  actions.className = 'actions';
  if (title.trailer) {
    actions.appendChild(button('Play trailer', 'rr-btn rr-btn--primary', function () { playTrailer(title, this); }));
  } else actions.appendChild(text('span', 'No trailer', 'note')); // the same words as on the TV
  actions.appendChild(seerrControl(title));
  body.appendChild(actions);

  if (title.trailer && title.trailer.kinocheck_url) { // attribution, wherever the card is
    var link = text('a', 'Trailer: KinoCheck');
    link.href = title.trailer.kinocheck_url;
    body.appendChild(text('p', '', 'credit')).appendChild(link);
  }
  if (inDetail && DEBUG) {
    var check = document.createElement('details');
    check.className = 'check';
    check.appendChild(text('summary', title.trailer ? 'Trailer check' : 'No trailer · why'));
    title.decisions.forEach(function (decision) {
      check.appendChild(text('div', decision.key + ' (' + decision.source + '): ' +
        (decision.playable ? 'playable — ' : 'hidden — ') + decision.reason));
    });
    body.appendChild(check);
  }
  article.appendChild(body);
  return article;
}

function seerrControl(title) {
  var status = seerrStatus[titleKey(title)];
  if (SEERR_LABELS[status]) return text('span', SEERR_LABELS[status], 'rr-status');
  var b = button(isSeries(title) ? 'Request season 1 via Seerr' : 'Request via Seerr', 'rr-btn rr-btn--text', function () { // a series request asks for the first season only
    b.disabled = true;
    b.textContent = 'Requesting...';
    getJson('/api/request/' + mediaType(title) + '/' + title.tmdb_id, function (error, result) {
      if (error) { b.disabled = false; b.textContent = 'Request failed, try again'; return; }
      seerrStatus[titleKey(title)] = result.status;
      b.parentNode.replaceChild(seerrControl(title), b);
    }, 'POST');
  });
  return b;
}

// A reload with a dialog open leaves its history entries behind; step back to the view's own one.
var leftOver = window.history.state && window.history.state.overlays;
if (leftOver && leftOver.length) window.history.go(-leftOver.length);
currentView = viewFromHash();
renderViews();
renderKinds();
renderLayout();

function showLoadError() {
  var root = document.getElementById('titles');
  var message = text('p', loadError, 'empty');
  message.setAttribute('role', 'alert');
  var retry = button('Try again', 'rr-btn rr-btn--primary', function () {
    loadError = '';
    root.textContent = '';
    root.appendChild(text('p', 'Loading titles...', 'empty'));
    loadTitles(true);
  });
  root.textContent = '';
  root.appendChild(message);
  root.appendChild(retry);
  return retry;
}

// Seerr state loads after the list; without it the request button is still offered.
function loadTitles(retried) {
  getJson('/api/titles', function (error, titles) {
    if (error) {
      loadError = error.message === 'network' ? 'The ReelRadar server cannot be reached. Check that it is running, then try again.' : 'Could not load titles.';
      var retry = showLoadError();
      if (retried) retry.focus(); // the pressed button was replaced, which drops focus
      return;
    }
    allTitles = titles;
    renderGenres();
    renderKeywords();
    renderTitles();
    getJson('/api/seerr', function (seerrError, statuses) {
      if (seerrError) return;
      seerrStatus = statuses;
      renderTitles();
    });
  });
}
loadTitles();
</script>
</body>
</html>
