<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>ReelRadar</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body { background: #101418; color: #eee; font-family: sans-serif; margin: 2em auto; max-width: 900px; padding: 0 1em; }
article { border-bottom: 1px solid #777; padding: 1em 0; }
h1, h2 { margin-bottom: 0.3em; }
.dates, .decision { color: #ccc; }
.decision { font-size: 0.85em; margin: 0.25em 0; }
button { font-size: 1.1em; margin: 0.75em 0; padding: 0.6em 1em; }
iframe { border: 0; display: block; height: 360px; max-width: 100%; width: 640px; }
a { color: #9cf; }
footer { margin-top: 2em; }
#filter { border: 1px solid #777; margin: 0.5em 0; padding: 0.5em 1em; }
#filter h2 { font-size: 1.1em; }
.tag { background: #2a3038; border: 2px solid #555; color: #eee; font-size: 1.1em; margin: 0.25em; padding: 0.4em 0.8em; }
.tag[aria-pressed="true"] { background: #2d6cdf; border-color: #9cf; }
#keyword-search { font-size: 1.1em; padding: 0.4em; width: 20em; max-width: 100%; }
#count { color: #ccc; }
#views button[aria-pressed="true"] { background: #2d6cdf; color: #fff; }
h2.shelf { border-bottom: 2px solid #2d6cdf; margin-top: 1.5em; }
.seerr { color: #9c9; margin: 0.25em 0; }
</style>
</head>
<body>
<h1>ReelRadar</h1>
<nav id="views"></nav>
<button type="button" id="filter-toggle">Filter</button>
<button type="button" id="filter-clear">Clear filter</button>
<span id="count"></span>
<section id="filter" hidden>
<h2>Genres</h2>
<div id="genres"></div>
<h2>Keywords</h2>
<input type="search" id="keyword-search" placeholder="Search keywords" aria-label="Search keywords">
<div id="keywords"></div>
</section>
<main id="titles">Loading titles...</main>
<footer>This product uses the TMDB API but is not endorsed or certified by TMDB.</footer>
<script>
// ES5 only (Tizen 4.0 / Chromium M56)
function text(tag, value, className) {
  var element = document.createElement(tag);
  element.textContent = value;
  if (className) element.className = className;
  return element;
}

// If the player reports an error (101/150 = embedding disabled), open the watch page instead.
function openOnYouTube(iframe, key) {
  var url = 'https://www.youtube.com/watch?v=' + encodeURIComponent(key);
  var link = text('a', 'Open trailer on YouTube');
  link.href = url;
  link.target = '_blank';
  iframe.parentNode.replaceChild(link, iframe);
  // The error arrives after the click, so a popup blocker may stop this; the link stays as a fallback.
  window.open(url, '_blank');
}

function playTrailer(event) {
  var button = event.currentTarget;
  var key = button.getAttribute('data-key');
  var iframe = document.createElement('iframe');
  var failed = false;
  iframe.src = 'https://www.youtube.com/embed/' + encodeURIComponent(key) + '?enablejsapi=1';
  iframe.title = 'Trailer';
  iframe.setAttribute('allowfullscreen', 'allowfullscreen');
  iframe.onload = function () {
    iframe.contentWindow.postMessage(JSON.stringify({ event: 'listening', id: key }), '*');
  };
  window.addEventListener('message', function onMessage(message) {
    if (failed || message.source !== iframe.contentWindow) return;
    var data;
    try { data = JSON.parse(message.data); } catch (error) { return; }
    if (data && data.event === 'onError') {
      failed = true;
      window.removeEventListener('message', onMessage);
      openOnYouTube(iframe, key);
    }
  });
  button.parentNode.replaceChild(iframe, button);
}

// Selection: {v:1, genres:[ids], keywords:[ids]} in localStorage; storage may be missing or throw.
var FILTER_KEY = 'reelradar.filter';
var allTitles = [];
var seerrStatus = null; // tmdb_id -> none|requested|partial|available; null while unknown
var SEERR_LABELS = { requested: 'Requested in Seerr', partial: 'Partly in the library', available: 'In the library' };
var selection = loadSelection();

function loadSelection() {
  try {
    var value = JSON.parse(window.localStorage.getItem(FILTER_KEY));
    if (value && value.v === 1 && value.genres instanceof Array && value.keywords instanceof Array) return value;
  } catch (error) {}
  return { v: 1, genres: [], keywords: [] };
}

function saveSelection() {
  try { window.localStorage.setItem(FILTER_KEY, JSON.stringify(selection)); } catch (error) {}
}

function hasAny(tags, ids) {
  for (var i = 0; i < tags.length; i += 1) if (ids.indexOf(tags[i].id) !== -1) return true;
  return false;
}

// Match rule: ANY selected genre or keyword; nothing selected shows everything.
function matchesFilter(title, chosen) {
  if (!chosen.genres.length && !chosen.keywords.length) return true;
  return hasAny(title.genres || [], chosen.genres) || hasAny(title.keywords || [], chosen.keywords);
}

// ---- views (same logic in frontend/index.html and tv-app/index.html) ----
var VIEWS = [['upcoming', 'Upcoming'], ['trailers', 'New trailers'], ['recent', 'Recently released'], ['genres', 'Genres'], ['all', 'All']];
var WINDOW_DAYS = 90; // "upcoming" and "recently released" look three months ahead/back

function isoDay(offsetDays) {
  var d = new Date(Date.now() + offsetDays * 86400000);
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
}

// German theatrical or digital dates inside [from, to); both count (cinema and streaming premieres).
function datesIn(title, from, to) {
  return [title.de_theatrical, title.de_digital].filter(function (date) { return date && date >= from && date < to; }).sort();
}

// -> [{heading, titles}] for the chosen view; titles are already filtered.
function viewSections(view, titles) {
  var today = isoDay(0);
  if (view === 'upcoming' || view === 'recent') {
    var from = view === 'upcoming' ? today : isoDay(-WINDOW_DAYS);
    var to = view === 'upcoming' ? isoDay(WINDOW_DAYS + 1) : today;
    var hits = titles.filter(function (title) { return datesIn(title, from, to).length; });
    hits.sort(function (a, b) {
      var x = datesIn(a, from, to), y = datesIn(b, from, to);
      return view === 'upcoming' ? (x[0] < y[0] ? -1 : x[0] > y[0] ? 1 : 0) : (x[x.length - 1] > y[y.length - 1] ? -1 : 1);
    });
    return [{ heading: '', titles: hits }];
  }
  if (view === 'trailers') {
    var withTrailer = titles.filter(function (title) { return title.trailer; });
    withTrailer.sort(function (a, b) { return (b.trailer.published_at || '') > (a.trailer.published_at || '') ? 1 : -1; });
    return [{ heading: '', titles: withTrailer }];
  }
  if (view === 'genres') {
    var byName = {}, names = [];
    titles.forEach(function (title) {
      (title.genres || []).forEach(function (genre) {
        if (!byName[genre.name]) { byName[genre.name] = []; names.push(genre.name); }
        byName[genre.name].push(title);
      });
    });
    return names.sort().map(function (name) { return { heading: name, titles: byName[name] }; });
  }
  return [{ heading: '', titles: titles }];
}

var currentView = 'upcoming';

// All tags of one kind on the loaded titles, with how many titles carry each.
function collectTags(kind) {
  var byId = {};
  var list = [];
  for (var i = 0; i < allTitles.length; i += 1) {
    var tags = allTitles[i][kind] || [];
    for (var j = 0; j < tags.length; j += 1) {
      if (!byId[tags[j].id]) {
        byId[tags[j].id] = { id: tags[j].id, name: tags[j].name, count: 0 };
        list.push(byId[tags[j].id]);
      }
      byId[tags[j].id].count += 1;
    }
  }
  return list;
}

function toggleButton(kind, tag) {
  var ids = selection[kind];
  var button = text('button', tag.name + (kind === 'keywords' ? ' (' + tag.count + ')' : ''), 'tag');
  button.setAttribute('type', 'button');
  button.setAttribute('aria-pressed', ids.indexOf(tag.id) !== -1 ? 'true' : 'false');
  button.onclick = function () {
    var index = ids.indexOf(tag.id);
    if (index === -1) ids.push(tag.id); else ids.splice(index, 1);
    button.setAttribute('aria-pressed', index === -1 ? 'true' : 'false');
    saveSelection();
    renderTitles();
  };
  return button;
}

function renderGenres() {
  var root = document.getElementById('genres');
  var genres = collectTags('genres').sort(function (a, b) { return a.name < b.name ? -1 : a.name > b.name ? 1 : 0; });
  root.textContent = '';
  for (var i = 0; i < genres.length; i += 1) root.appendChild(toggleButton('genres', genres[i]));
}

function renderKeywords() {
  var root = document.getElementById('keywords');
  var query = document.getElementById('keyword-search').value.toLowerCase();
  var keywords = collectTags('keywords').filter(function (tag) {
    return tag.name.toLowerCase().indexOf(query) !== -1;
  }).sort(function (a, b) {
    return b.count - a.count || (a.name < b.name ? -1 : a.name > b.name ? 1 : 0);
  });
  root.textContent = '';
  for (var i = 0; i < keywords.length && i < 40; i += 1) root.appendChild(toggleButton('keywords', keywords[i]));
  if (keywords.length > 40) root.appendChild(text('p', (keywords.length - 40) + ' more: search to narrow down.'));
}

function renderTitles() {
  var shown = allTitles.filter(function (title) { return matchesFilter(title, selection); });
  var sections = viewSections(currentView, shown);
  var count = currentView === 'genres' ? shown.length : sections[0].titles.length;
  document.getElementById('count').textContent = 'Showing ' + count + ' of ' + allTitles.length + ' titles';
  render(sections);
}

function renderViews() {
  var nav = document.getElementById('views');
  nav.textContent = '';
  VIEWS.forEach(function (view) {
    var button = text('button', view[1]);
    button.setAttribute('type', 'button');
    button.setAttribute('aria-pressed', view[0] === currentView ? 'true' : 'false');
    button.onclick = function () { currentView = view[0]; renderViews(); renderTitles(); };
    nav.appendChild(button);
  });
}
renderViews();

document.getElementById('filter-toggle').onclick = function () {
  var panel = document.getElementById('filter');
  panel.hidden = !panel.hidden;
};
document.getElementById('filter-clear').onclick = function () {
  selection = { v: 1, genres: [], keywords: [] };
  saveSelection();
  renderGenres();
  renderKeywords();
  renderTitles();
};
document.getElementById('keyword-search').oninput = renderKeywords;

function render(sections) {
  var root = document.getElementById('titles');
  root.textContent = '';
  var empty = !sections.length || (sections.length === 1 && !sections[0].titles.length);
  if (empty) root.appendChild(text('p', allTitles.length ? 'No titles in this view match the filter.' : 'No titles imported yet.'));
  sections.forEach(function (section) {
    if (section.heading) root.appendChild(text('h2', section.heading, 'shelf'));
    renderArticles(root, section.titles);
  });
}

function renderArticles(root, titles) {
  for (var i = 0; i < titles.length; i += 1) {
    var title = titles[i];
    var article = document.createElement('article');
    var dates = title.de_theatrical ? 'German theatrical: ' + title.de_theatrical : 'no German date';
    if (title.de_digital) dates += ' · digital: ' + title.de_digital;
    article.appendChild(text('h2', title.title));
    article.appendChild(text('div', dates, 'dates'));

    if (seerrStatus && seerrStatus[title.tmdb_id]) article.appendChild(seerrLine(title));

    if (title.trailer) {
      var button = text('button', 'Play trailer');
      button.setAttribute('type', 'button');
      button.setAttribute('data-key', title.trailer.key);
      button.onclick = playTrailer;
      article.appendChild(button);
      if (title.trailer.kinocheck_url) {
        var source = document.createElement('div');
        var link = text('a', 'Trailer: KinoCheck');
        link.href = title.trailer.kinocheck_url;
        source.appendChild(link);
        article.appendChild(source);
      }
    } else {
      article.appendChild(text('p', 'no trailer'));
    }

    for (var j = 0; j < title.decisions.length; j += 1) {
      var decision = title.decisions[j];
      article.appendChild(text('div', decision.key + ' (' + decision.source + '): ' +
        (decision.playable ? 'playable — ' : 'hidden — ') + decision.reason, 'decision'));
    }
    root.appendChild(article);
  }
}

function seerrLine(title) {
  var status = seerrStatus[title.tmdb_id];
  var line = text('div', SEERR_LABELS[status] || '', 'seerr');
  if (status === 'none') {
    var button = text('button', 'Request in Seerr');
    button.setAttribute('type', 'button');
    button.onclick = function () {
      button.disabled = true;
      button.textContent = 'Requesting...';
      var post = new XMLHttpRequest();
      post.open('POST', '/api/request/' + title.tmdb_id);
      post.onload = function () {
        try {
          if (post.status !== 200) throw new Error();
          seerrStatus[title.tmdb_id] = JSON.parse(post.responseText).status;
          line.parentNode.replaceChild(seerrLine(title), line);
        } catch (error) {
          button.disabled = false;
          button.textContent = 'Request failed - try again';
        }
      };
      post.onerror = post.onload;
      post.send();
    };
    line.appendChild(button);
  }
  return line;
}

// Seerr state loads after the list; without it the page simply shows no status.
function loadSeerr() {
  var statusRequest = new XMLHttpRequest();
  statusRequest.open('GET', '/api/seerr');
  statusRequest.onload = function () {
    if (statusRequest.status !== 200) return;
    try { seerrStatus = JSON.parse(statusRequest.responseText); } catch (error) { return; }
    renderTitles();
  };
  statusRequest.send();
}

var request = new XMLHttpRequest();
request.open('GET', '/api/titles');
request.onload = function () {
  try {
    if (request.status < 200 || request.status >= 300) throw new Error('HTTP ' + request.status);
    allTitles = JSON.parse(request.responseText);
    renderGenres();
    renderKeywords();
    renderTitles();
    loadSeerr();
  } catch (error) {
    document.getElementById('titles').textContent = 'Could not load titles.';
  }
};
request.onerror = function () {
  document.getElementById('titles').textContent = 'Backend unreachable.';
};
request.send();
</script>
</body>
</html>
