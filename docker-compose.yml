services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Europe/Berlin # IMPORT_TIME is local time
      HEVC_ENCODER: nvenc # trailer transcoding on the NVIDIA GPU (software x265 if that fails); remove on a host without one
    volumes:
      - reelradar-data:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, video, utility] # "video" is what NVENC needs
  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on: [backend]
    volumes:
      - reelradar-data:/srv/data:ro # trailer cache at /media/
    ports:
      - "127.0.0.1:8180:80" # only the host's Caddy reaches this
volumes:
  reelradar-data:
